<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Map test · London Buses</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#f6f7f9; --surf:#fff; --tx:#111827; --tx2:#4b5563; --mu:#6b7280; --bd:#e5e7eb; --acc:#2563eb; --warn:#b45309;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f1115; --surf:#171a21; --tx:#f3f4f6; --tx2:#c3c8d1; --mu:#8b93a1; --bd:#262b36; --acc:#6ea0ff; --warn:#f59e0b; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"]{ --bg:#0f1115; --surf:#171a21; --tx:#f3f4f6; --tx2:#c3c8d1; --mu:#8b93a1; --bd:#262b36; --acc:#6ea0ff; --warn:#f59e0b; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); }
  *{ box-sizing:border-box }
  html,body{ height:100%; margin:0 }
  body{ background:var(--bg); color:var(--tx); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; display:flex; flex-direction:column }
  header{ padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; background:var(--surf); border-bottom:1px solid var(--bd) }
  header h1{ font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em }
  header a{ color:var(--acc); text-decoration:none; font-weight:500 }
  .grow{ flex:1 }
  .seg{ display:inline-flex; background:var(--bg); border:1px solid var(--bd); border-radius:999px; padding:2px }
  .seg button{ border:0; background:transparent; color:var(--tx2); font:inherit; font-size:12.5px; padding:5px 12px; border-radius:999px; cursor:pointer }
  .seg button.on{ background:var(--surf); color:var(--tx); box-shadow:0 1px 3px rgba(0,0,0,.15); font-weight:600 }
  #wrap{ position:relative; flex:1; min-height:0 }
  #map{ position:absolute; inset:0; background:var(--bg) }
  .panel{ position:absolute; z-index:1000; left:12px; bottom:28px; background:var(--surf); border:1px solid var(--bd); border-radius:14px; box-shadow:var(--shadow); padding:10px 12px; max-width:calc(100% - 24px) }
  .panel h2{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--mu); margin:0 0 7px; font-weight:650 }
  .chips{ display:flex; flex-wrap:wrap; gap:6px }
  .chip{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--bd); background:var(--surf); color:var(--tx); border-radius:999px; padding:4px 11px 4px 5px; font:inherit; font-size:13px; font-weight:600; cursor:pointer }
  .chip i{ min-width:26px; text-align:center; color:#fff; border-radius:999px; font-style:normal; font-size:12px; padding:1px 6px }
  .chip.off{ opacity:.45 }
  .chip.off i{ background:var(--mu)!important }
  #banner{ display:none; position:absolute; z-index:1100; top:12px; left:50%; transform:translateX(-50%); width:min(560px, calc(100% - 24px)); background:var(--surf); border:1px solid var(--warn); border-radius:12px; box-shadow:var(--shadow); padding:11px 14px; font-size:13px; color:var(--tx2) }
  #banner b{ color:var(--tx) }
  #banner code{ background:var(--bg); border:1px solid var(--bd); border-radius:5px; padding:0 5px; font-size:12px }
  .leaflet-container{ font:inherit }
  .leaflet-control-attribution{ font-size:10.5px }
  .routeTip{ font-weight:650 }
</style>
</head>
<body>
<header>
  <h1>Basemap test</h1>
  <span style="color:var(--mu)" id="provider">Stadia Maps</span>
  <div class="seg" id="styleSeg" role="group" aria-label="Basemap style"></div>
  <div class="grow"></div>
  <a href="/">← Back to the app</a>
</header>
<div id="wrap">
  <div id="map"></div>
  <div id="banner"></div>
  <div class="panel"><h2>Routes</h2><div class="chips" id="chips"></div></div>
</div>

<script>
/* Stadia Maps basemap test page — not linked from the app.
   Stadia authenticates by registered domain (free account, no card) or by API
   key. Without either, every tile is a 401, so the page probes one tile first
   and says so rather than showing a blank map. Pass ?key=… to test with a key
   before the domain is registered. */
const params = new URLSearchParams(location.search);
const KEY = params.get('key') || '';
const keyQ = KEY ? `?api_key=${encodeURIComponent(KEY)}` : '';
const stadia = (name) => `https://tiles.stadiamaps.com/tiles/${name}/{z}/{x}/{y}{r}.png${keyQ}`;
const ATTR = '&copy; <a href="https://stadiamaps.com/" target="_blank" rel="noopener">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';

const STYLES = [
  { id:'smooth',  label:'Smooth',        light:'alidade_smooth',      dark:'alidade_smooth_dark' },
  { id:'bright',  label:'Bright',        light:'osm_bright',          dark:'alidade_smooth_dark' },
  { id:'outdoors',label:'Outdoors',      light:'outdoors',            dark:'alidade_smooth_dark' },
];
// A handful of central routes with distinct colours; geometry is the same
// per-route GeoJSON the app serves.
const ROUTES = [
  { id:'25', colour:'#e11d48' },
  { id:'88', colour:'#2563eb' },
  { id:'24', colour:'#16a34a' },
  { id:'12', colour:'#d97706' },
  { id:'73', colour:'#7c3aed' },
  { id:'38', colour:'#0891b2' },
];

const mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === 'dark' : mq.matches;

const map = L.map('map', { zoomControl:true, attributionControl:true, preferCanvas:false }).setView([51.515, -0.11], 12);
map.attributionControl.setPrefix(false);

let base = null, styleIdx = 0;
function setBase(){
  if(base) map.removeLayer(base);
  const s = STYLES[styleIdx];
  base = L.tileLayer(stadia(isDark() ? s.dark : s.light), {
    maxZoom:20, attribution:ATTR, detectRetina:false,
  }).addTo(map);
  base.bringToBack();
}
const seg = document.getElementById('styleSeg');
STYLES.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.label; b.type = 'button';
  b.className = i === styleIdx ? 'on' : '';
  b.addEventListener('click', () => {
    styleIdx = i;
    seg.querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === i));
    setBase();
  });
  seg.appendChild(b);
});
mq.addEventListener('change', setBase);
setBase();

// Probe one tile so a 401 (domain not registered / no key) is explained.
(async () => {
  const probe = stadia('alidade_smooth').replace('{z}/{x}/{y}{r}', '12/2046/1362');
  try{
    const r = await fetch(probe, { method:'GET' });
    if(r.status === 401 || r.status === 403){
      const el = document.getElementById('banner');
      el.style.display = 'block';
      el.innerHTML = `<b>Stadia is refusing the tiles (HTTP ${r.status}).</b> Their free tier authenticates by domain: add <code>${location.hostname}</code> under <i>Manage Properties → Authentication</i> at client.stadiamaps.com (free, no card). To test before that, append <code>?key=YOUR_API_KEY</code> to this URL.`;
    }
  }catch(e){ /* network/CORS — tile layer will show its own failure */ }
})();

// Routes
const layers = new Map();
const chips = document.getElementById('chips');
const all = L.featureGroup().addTo(map);
Promise.all(ROUTES.map(async r => {
  try{
    const gj = await (await fetch(`/data/routes/${r.id}.geojson`)).json();
    const grp = L.featureGroup();
    // Casing under the coloured line keeps routes legible on any basemap.
    L.geoJSON(gj, { style:{ color:'#fff', weight:7, opacity:.9, lineCap:'round', lineJoin:'round' }, interactive:false }).addTo(grp);
    L.geoJSON(gj, { style:{ color:r.colour, weight:4, opacity:1, lineCap:'round', lineJoin:'round' } })
      .bindTooltip(`Route ${r.id}`, { sticky:true, className:'routeTip' }).addTo(grp);
    layers.set(r.id, grp); grp.addTo(all);
  }catch(e){ console.warn('route', r.id, e); }
})).then(() => {
  if(all.getLayers().length){
    // Keep the whole network clear of the legend panel along the bottom.
    const panelH = document.querySelector('.panel').offsetHeight + 28;
    map.fitBounds(all.getBounds(), { paddingTopLeft:[40, 40], paddingBottomRight:[40, panelH + 20] });
  }
});
// Chip labels come from the served destinations data, never hardcoded.
fetch('/data/route_destinations.json').then(r => r.json()).catch(() => ({})).then(d => {
  const dest = d.routes ?? d;
  const short = x => String(x?.destination ?? '').replace(/,.*$/, '');
  ROUTES.forEach(r => {
    const rd = dest[r.id];
    const label = rd ? `${short(rd.outbound)} – ${short(rd.inbound)}` : '';
    const c = document.createElement('button');
    c.className = 'chip'; c.type = 'button';
    c.innerHTML = `<i style="background:${r.colour}">${r.id}</i>${label}`;
    c.addEventListener('click', () => {
      const g = layers.get(r.id); if(!g) return;
      const off = c.classList.toggle('off');
      off ? all.removeLayer(g) : all.addLayer(g);
    });
    chips.appendChild(c);
  });
});
</script>
</body>
</html>
