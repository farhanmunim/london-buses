name: Intraday Status Refresh

# Service status + diversion register, every 2 hours through the day
# (07:41–21:41 UTC, 8 runs). One TfL call (/Line/Mode/bus/Status?detail=true)
# feeds data/api/line-status.json and data/api/route-diversions.json.
# Nearly every run commits (status text moves constantly), so each run is
# ~1 Cloudflare Pages build — 8/day is the ceiling that keeps total data
# commits ≈12/day ≈ 374 builds/month against the 500/month free tier.
# Minutes off the hour boundary — GitHub delays or skips scheduled jobs
# that fire on the hour (peak load).
on:
  schedule:
    - cron: "41 7-21/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch line status + diversions
        env:
          BUS_API_KEY: ${{ secrets.BUS_API_KEY }}
        run: node scripts/fetch-line-status.js

      - name: Accumulate diversion history
        # Every status snapshot feeds the rolling diversion archive — TfL
        # publishes no historical diversion feed, so this accumulation IS
        # the history (route, planned/unplanned, stated window, reason).
        run: node scripts/build-diversion-history.js

      - name: Snapshot roadworks (TIMS) + accumulate history
        # TfL's /Road/all/Disruption is live-only like the diversion feed,
        # so each snapshot is corridor-joined to bus routes and merged into
        # a rolling archive here too.
        run: node scripts/fetch-roadworks.js

      - name: Drain Street Manager events (if any)
        # Folds inbox/<id>.json files from the streetworks-inbox branch
        # (written by the /api/streetworks receiver) into the archive
        # using plain git — no extra secrets. Soft-skips until the branch
        # exists (i.e. until registration is done). See data.md.
        run: node scripts/drain-streetworks.js

      - name: Fetch D-TRO orders (DfT digital traffic regulation orders)
        # The statutory TROs behind closures, bus lanes/gates, banned turns
        # and diversions — Greater London polygon search, bus-relevant
        # orders corridor-joined to routes. Soft-skips without credentials;
        # incremental after the first full sync. See data.md.
        env:
          DTRO_CLIENT_ID:     ${{ secrets.DTRO_CLIENT_ID }}
          DTRO_API_KEY:       ${{ secrets.DTRO_API_KEY }}
          DTRO_CLIENT_SECRET: ${{ secrets.DTRO_CLIENT_SECRET }}
        run: node scripts/fetch-dtro.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api/line-status.json data/api/route-diversions.json data/api/manifest.json || true
          git add data/api/diversion-history.json || true
          git add -f data/source/diversion-history.json || true
          git add data/api/roadworks.json data/api/roadworks-history.json || true
          git add -f data/source/roadworks-history.json || true
          git add data/api/streetworks-history.json || true
          git add data/api/dtro.json || true
          git add -f data/source/dtro.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: status refresh $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" = "3" ]; then echo "Push still rejected after 3 attempts"; exit 1; fi
              # Another workflow's push landed between checkout and here (a
              # queued run checks out the SHA frozen at queue time, and the
              # D-TRO step alone can take minutes). Rebasing conflicts on
              # data/api/manifest.json, which every workflow rewrites
              # (status run #226, 2026-11-01) — so move to the new head, keep
              # THIS run's own outputs, and re-apply only its two manifest
              # rows on top of the other workflow's manifest.
              echo "Push rejected (attempt $attempt) — redoing on the new head"
              OURS=$(git rev-parse HEAD)
              git diff --name-only "$OURS~1" "$OURS" | grep -v '^data/api/manifest.json$' > "$RUNNER_TEMP/ours.txt" || true
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              # Restore only the files this run changed — not whole dirs, which
              # would clobber newer files the other workflow just pushed.
              xargs -r git checkout "$OURS" -- < "$RUNNER_TEMP/ours.txt"
              node -e '
                const fs = require("fs"), A = "data/api/";
                const mf = JSON.parse(fs.readFileSync(A + "manifest.json", "utf8"));
                const st = JSON.parse(fs.readFileSync(A + "line-status.json", "utf8"));
                const dv = JSON.parse(fs.readFileSync(A + "route-diversions.json", "utf8"));
                for (const [k, at, n] of [["line-status", st.capturedAt, st.rows.length], ["route-diversions", dv.generatedAt, dv.count]])
                  if (mf.datasets?.[k]) Object.assign(mf.datasets[k], { fetchedAt: at, status: "ok", rows: n });
                fs.writeFileSync(A + "manifest.json", JSON.stringify(mf) + "\n");
              '
              git add data/api/ || true
              git add -f data/source/diversion-history.json data/source/roadworks-history.json data/source/dtro.json || true
              if git diff --cached --quiet; then echo "New head already carries this data"; break; fi
              git commit -m "data: status refresh $(date -u +%Y-%m-%dT%H:%M)"
            done
          fi
