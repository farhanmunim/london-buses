name: Intraday Tender Refresh

# Tender award sweep, hourly through the working day (07:20–20:20 UTC).
# TfL generally publishes new award results around 1pm and 3pm UK time, but
# GitHub cron slips badly on this repo (slots observed firing 1–3h late or
# skipped outright), so a wide hourly window is what actually guarantees
# same-day pickup. The extra runs are free on both budgets: Actions minutes
# are unlimited on a public repo, and the commit step below is gated on the
# award cache actually changing, so a run with nothing new triggers no
# Cloudflare Pages build. Awards are immutable and keyed by btID.
on:
  schedule:
    - cron: "20 7-20 * * *"
  # GitHub's cron is best-effort and on this repo severely degraded (slots
  # observed slipping 1-5h or dropping entirely — 2 of 14 hourly slots fired
  # on 2026-09-03). workflow_run is event-driven and fires reliably, so the
  # tender sweep also piggy-backs on every completed status/fleet refresh;
  # the shared concurrency group serializes them, and the change-gated
  # commit keeps the extra runs free of Cloudflare builds.
  workflow_run:
    workflows: ["Intraday Status Refresh", "Intraday Fleet Sweep"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  tenders:
    runs-on: ubuntu-latest
    # Browser-mode catch-up (Cloudflare-challenge fallback in
    # fetch-tenders.js crawls sequentially, capped at 250 pages/run) can
    # take ~15 min — leave headroom over the plain-fetch fast path.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch tender awards
        # Headful Chrome under a virtual display: Cloudflare's challenge
        # flags headless automation (navigator.webdriver, HeadlessChrome
        # UA), so the browser fallback needs a real rendering session.
        env:
          TENDERS_HEADFUL: "1"
        run: xvfb-run -a node scripts/fetch-tenders.js

      - name: Fetch tendering programme
        # content.tfl.gov.uk is not behind the forms WAF; unchanged years
        # short-circuit on Last-Modified so this is seconds when quiet.
        # Programme years are auto-discovered (through current year + 2),
        # so a newly published programme lands the same day.
        run: node scripts/fetch-tender-programme.js

      - name: Rebuild served API
        run: node scripts/build-api.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit when a source cache itself moved — build-api rewrites
          # timestamps on every run, so gating on the source files avoids a
          # no-op commit (and a Cloudflare build) when TfL published nothing
          # new. Both fetchers write content-stably (no timestamp-only churn).
          git add -f data/source/tenders.json data/source/tender-programme.json || true
          if git diff --cached --quiet; then
            echo "No new tender awards"
          else
            git add data/api/ || true
            git commit -m "data: tender refresh $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" = "3" ]; then echo "Push still rejected after 3 attempts"; exit 1; fi
              git stash push --include-untracked --quiet --message "ci-residue-$attempt" || true
              git pull --rebase origin main
            done
          fi
