name: CPI Release Watch

# ONS publishes the CPI index once a month at 07:00 UK time. CPI is refreshed
# here and only here (it was removed from the 03:17 UTC nightly run, which
# fires hours before any release): the first check is at 07:00 London time,
# when ONS publishes, and that one job then polls ONS every ten minutes until
# the figure is in or 17:00 passes — one run, not a chain of hourly runs
# GitHub may never schedule. The aim is the new figure on the site well
# before 09:00. The gate is two-fold: London time must be 09:00 or later, and
# `nextRelease` in the served file must be today or earlier — fetch-cpi.js
# moves `nextRelease` to the following month the moment the new figure lands,
# so every later run is a one-second no-op. If a release day is missed
# entirely, `nextRelease` stays in the past and the next morning's 09:00
# check picks it up, so it self-heals.
#
# GitHub cron slips and drops on this repo (see refresh-tenders.yml), so the
# hourly schedule is backed by workflow_run: it also fires after every
# completed status / fleet refresh, which are event-driven and reliable. The
# commit is gated on the served files actually changing, so a quiet run
# triggers no Cloudflare Pages build.
on:
  schedule:
    # ONS publishes at 07:00 London. GitHub fires only a fraction of cron slots
    # on this repo, so the morning is carpeted with slots every 10 minutes
    # (06:00–09:50 UTC covers 07:00–09:50 London in winter and summer): some
    # will fire, and the first one to fire after 07:00 London does the whole
    # job. Off release days every slot is a one-second no-op. Hourly after.
    - cron: "*/10 6-9 * * *"
    - cron: "3 10-17 * * *"
  workflow_run:
    workflows: ["Intraday Status Refresh", "Intraday Fleet Sweep", "Nightly Data Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even if no release is due"
        type: boolean
        default: false

permissions:
  contents: write

# Its own lane, not the shared data-refresh group: on release day this job
# polls ONS for hours, and must never hold up the status and fleet refreshes.
# Its commit step already copes with another workflow pushing first.
concurrency:
  group: cpi-watch
  cancel-in-progress: false

jobs:
  cpi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Is a CPI release due?
        id: due
        run: |
          LONDON_HOUR=$(TZ=Europe/London date +%H)
          DUE=$(node -e '
            const fs = require("fs");
            let due = true;
            try {
              const c = JSON.parse(fs.readFileSync("data/api/cpi-cpa.json", "utf8"));
              const t = Date.parse(String(c.nextRelease) + " UTC");   // e.g. "21 October 2026"
              if (Number.isFinite(t)) due = Date.now() >= t;
            } catch {}
            process.stdout.write(due ? "yes" : "no");
          ')
          # Never before 07:00 London time, when ONS publishes (manual runs may override with force)
          if [ "$((10#$LONDON_HOUR))" -lt 7 ]; then DUE=no; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then DUE=yes; fi
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "London hour: $LONDON_HOUR — CPI release due: $DUE"

      - name: Set up Node.js
        if: steps.due.outputs.due == 'yes'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.due.outputs.due == 'yes'
        run: npm install --no-audit --no-fund

      - name: Fetch CPI + CPA rates (poll ONS until the new figure lands)
        if: steps.due.outputs.due == 'yes'
        # GitHub's cron fires a fraction of its slots on this repo, so one run
        # cannot assume another will follow. On release day this step keeps
        # polling ONS every 10 minutes from 07:00 London until the served file
        # changes (the new month is in) or 17:00 London passes. A forced run
        # polls once. 60 polls × 10 min covers 07:00 to 17:00.
        run: |
          for i in $(seq 1 60); do
            node scripts/fetch-cpi.js || true
            if ! git diff --quiet -- data/api/cpi-cpa.json; then echo "New CPI figure fetched on poll $i"; break; fi
            H=$((10#$(TZ=Europe/London date +%H)))
            if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$H" -ge 17 ]; then echo "Stopping: $([ "$H" -ge 17 ] && echo 'past 17:00 London' || echo 'forced run polls once')"; break; fi
            echo "ONS has not published yet (poll $i, $(TZ=Europe/London date +%H:%M) London) — next check in 10 min"
            sleep 600
          done

      - name: Update the manifest row
        if: steps.due.outputs.due == 'yes'
        run: node scripts/touch-manifest.js cpi-cpa

      - name: Commit and push
        if: steps.due.outputs.due == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api/cpi-cpa.json data/api/manifest.json
          if git diff --cached --quiet; then
            echo "CPI unchanged — ONS has not published yet"
          else
            git commit -m "data: CPI refresh $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3 4; do
              if git push; then break; fi
              if [ "$attempt" = "4" ]; then echo "Push still rejected after 4 attempts"; exit 1; fi
              # Another workflow pushed first (they rewrite manifest.json too, so a rebase would conflict).
              # Move to the new head and redo this run's two small steps on top of it — both are idempotent.
              echo "Push rejected (attempt $attempt) — redoing on the new head"
              git fetch -q origin main
              git reset -q --hard origin/main
              node scripts/fetch-cpi.js
              node scripts/touch-manifest.js cpi-cpa
              git add data/api/cpi-cpa.json data/api/manifest.json
              if git diff --cached --quiet; then echo "New head already carries this data"; break; fi
              git commit -m "data: CPI refresh $(date -u +%Y-%m-%dT%H:%M)"
            done
          fi
