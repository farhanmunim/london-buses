name: Intraday Fleet Sweep

# Incremental fleet observation, three times daily every 8 hours
# (07:20/15:20/23:20 UTC ≈ morning peak, school-run afternoon, and late
# evening in UK time). Each sweep reads TfL /Line/{id}/Arrivals for every
# route (registrations of buses out right now) and accumulates into
# data/source/route-vehicles.json; new registrations get a DVLA VES lookup
# into the sticky vehicle-fleet cache. Together with the 03:17 nightly run
# (which catches the night network) this replaces the retired 24/7 fleet
# monitoring with incremental samples. Each sweep almost always commits
# (~1 Cloudflare Pages build), so 3/day is sized against the 500/month tier.
on:
  schedule:
    - cron: "20 7,15,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sweep route vehicles (TfL arrivals)
        env:
          BUS_API_KEY: ${{ secrets.BUS_API_KEY }}
        run: node scripts/fetch-route-vehicles.js

      - name: Enrich new registrations (DVLA)
        env:
          DVLA_API_KEY: ${{ secrets.DVLA_API_KEY }}
        run: node scripts/fetch-vehicle-fleet.js

      - name: Rebuild served API
        run: node scripts/build-api.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/source/route-vehicles.json data/source/vehicle-fleet.json || true
          git add data/api/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: fleet sweep $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" = "3" ]; then echo "Push still rejected after 3 attempts"; exit 1; fi
              # Another workflow's push landed between checkout and here (a
              # queued run checks out the SHA frozen at queue time, so this
              # happens even with the shared concurrency group). Rebasing the
              # commit conflicts whenever both runs rebuilt the same generated
              # data/api files (tender run #230, 2026-09-25) — so instead keep
              # THIS run's fetched sources, move to the new head, and rebuild
              # the served API from the union of sources.
              echo "Push rejected (attempt $attempt) — rebuilding on the new head"
              OURS=$(git rev-parse HEAD)
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              git checkout "$OURS" -- data/source/route-vehicles.json data/source/vehicle-fleet.json || true
              node scripts/build-api.js
              git add -f data/source/route-vehicles.json data/source/vehicle-fleet.json || true
              git add data/api/ || true
              if git diff --cached --quiet; then echo "New head already carries this data"; break; fi
              git commit -m "data: fleet sweep $(date -u +%Y-%m-%dT%H:%M)"
            done
          fi
