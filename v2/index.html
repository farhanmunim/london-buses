<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>London Buses · v2</title>
<meta name="description" content="Search and explore every London bus route, operator and garage — data refreshed straight from TfL and other public sources." />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ── Design tokens — minimal SaaS, light-only ──────────────────────────── */
:root{
  --bg:#fafaf9; --surf:#ffffff; --surf2:#f5f5f4;
  --bd:#e7e5e4; --bd2:#d6d3d1;
  --tx:#1c1917; --tx2:#57534e; --mu:#8b857f;
  --acc:#dc2626; --acc-soft:#fef2f2;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --r:12px; --r-sm:8px;
  --sh:0 1px 2px rgba(28,25,23,.05);
  --maxw:1080px;
  --tab-h:58px;
  --tipbg:#1c1917; --skel-hi:#eeedec;
}
/* Dark theme — the boot script stamps data-theme before first paint, from
   the stored choice or the system preference. */
:root[data-theme="dark"]{
  --bg:#100f0e; --surf:#1b1917; --surf2:#242019;
  --bd:#2b2725; --bd2:#3d3835;
  --tx:#f0eeec; --tx2:#b5aea8; --mu:#7c766f;
  --acc:#ef4444; --acc-soft:#3a1515;
  --good:#2fbf5f; --warn:#f59e0b; --bad:#ef4444;
  --sh:0 1px 2px rgba(0,0,0,.45);
  --tipbg:#332f2c; --skel-hi:#2c2825;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
svg{display:block}
::selection{background:#fecaca}

/* ── App shell ─────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb, var(--surf) 92%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-icon{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand small{font-weight:600;font-size:10px;color:var(--bg);background:var(--tx);border-radius:999px;padding:2px 7px;letter-spacing:.04em}
.nav-desktop{display:none;gap:2px;margin-left:14px}
.nav-desktop a{padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--tx2)}
.nav-desktop a:hover{background:var(--surf2);color:var(--tx)}
.nav-desktop a.on{background:var(--tx);color:var(--bg)}
.topbar-spacer{flex:1}
.net-chip{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;background:var(--surf)}
.net-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.net-chip.bad .dot{background:var(--warn)}
@media(min-width:760px){.nav-desktop{display:flex}.net-chip{display:inline-flex}}

main{max-width:var(--maxw);margin:0 auto;padding:16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom))}
@media(min-width:760px){main{padding-bottom:56px}}

/* mobile bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb, var(--surf) 94%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);display:flex;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mu)}
.tabbar a.on{color:var(--acc)}
.tabbar svg{width:21px;height:21px}
@media(min-width:760px){.tabbar{display:none}}

/* ── Common components ─────────────────────────────────────────────────── */
.h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.sub{color:var(--tx2);font-size:13.5px;margin-bottom:14px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.section{margin-top:18px}
.section-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 2px 8px}
.searchwrap{position:sticky;top:53px;z-index:50;background:var(--bg);padding:2px 0 10px;margin:0 -2px;}
.search{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--bd2);border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh)}
.search:focus-within{border-color:var(--tx);box-shadow:0 0 0 3px rgba(28,25,23,.06)}
.search input{flex:1;border:none;outline:none;background:none;font-size:16px;min-width:0}
.search input::placeholder{color:var(--mu)}
.search svg{color:var(--mu);flex:none}
.search .clear{color:var(--mu);padding:2px;border-radius:6px}
.search .clear:hover{color:var(--tx)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--tx2);background:var(--surf);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;transition:all .12s}
.chip:hover{border-color:var(--bd2)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.chip .x{opacity:.7;margin-left:4px}
.count-note{font-size:12.5px;color:var(--mu);margin:8px 2px 6px}
.empty{color:var(--mu);text-align:center;padding:44px 0;font-size:14px}
.skel{background:linear-gradient(90deg,var(--surf2) 25%,var(--skel-hi) 50%,var(--surf2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}

/* route list */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh);transition:border-color .12s}
.rrow:hover{border-color:var(--bd2)}
.rrow:active{background:var(--surf2)}
.rnum{flex:none;min-width:46px;height:32px;padding:0 8px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14.5px}
.rnum.night{background:#6d28d9}.rnum.school{background:#15803d}.rnum.twentyfour{background:#0e7490}
.rmeta{flex:1;min-width:0}
.rmeta .op{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.rmeta .ga{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--surf2);color:var(--tx2)}
.rtag.electric{background:#dcfce7;color:#15803d}.rtag.hydrogen{background:#cffafe;color:#0e7490}.rtag.hybrid{background:#e0e7ff;color:#4338ca}
.rrow .pvr{flex:none;text-align:right;font-size:12px;color:var(--mu);position:relative}
.rrow .pvr b{display:block;font-family:var(--mono);font-size:14px;color:var(--tx);font-weight:600}
.warn-dot{position:absolute;top:1px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media(min-width:760px){.rlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}}

/* detail pages */
.backrow{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:13.5px;font-weight:500;margin-bottom:10px;padding:4px 0}
.backrow:hover{color:var(--tx)}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.dnum{min-width:58px;height:42px;padding:0 10px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:20px}
.dnum.night{background:#6d28d9}.dnum.school{background:#15803d}.dnum.twentyfour{background:#0e7490}
.dtitle{min-width:0}
.dtitle h1{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.dtitle .sub2{font-size:13px;color:var(--tx2)}
.statusline{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;font-size:13px}
.statusline .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--good)}
.statusline.bad .dot{background:var(--warn)}
.statusline b{font-weight:600}
.statusline .reason{color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media(min-width:560px){.facts{grid-template-columns:repeat(6,1fr)}}
/* min-width:0 matters: grid items default to min-width:auto, so a long
   no-wrap value (vehicle spec strings) would force its column wider than
   the grid and break the page edge. The value scrolls inside the tile
   instead — swipe to read the tail. */
.fact{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-sm);padding:9px 10px;min-width:0}
.fact .l{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .v{font-family:var(--mono);font-weight:600;font-size:14.5px;margin-top:2px;white-space:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.fact .v::-webkit-scrollbar{display:none}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;border-top:1px solid var(--bd);font-size:13.5px}
.kv>div:first-child{border-top:none}
.kv .k{color:var(--tx2);flex:none}
.kv .v{text-align:right;font-weight:500;min-width:0}
.kv .v.mono{font-family:var(--mono);font-weight:600;font-size:13px}
#map{height:300px;border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;background:var(--surf2);position:relative;z-index:0}
@media(min-width:760px){#map{height:380px}}
.mapctl{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surf2);border-radius:9px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:600;color:var(--tx2);border-radius:7px;padding:5px 12px}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.livebtn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:6px 13px}
.livebtn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.livebtn .spin{width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
.livebtn.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.divn-note{display:flex;gap:9px;background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r);padding:11px 13px;font-size:13px;color:#92400e;margin-top:12px}
.divn-note b{font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px}
.bars>div{flex:1;background:#fca5a5;border-radius:3px 3px 0 0;min-height:3px;position:relative}
.bars>div.hi{background:var(--acc)}
.minibar{height:7px;border-radius:999px;background:var(--surf2);overflow:hidden}
.minibar>i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.legendrow{display:flex;gap:14px;font-size:11.5px;color:var(--mu);margin-top:6px;flex-wrap:wrap}
.legendrow i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* operators & garages */
.oplist{display:grid;gap:10px}
@media(min-width:560px){.oplist{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.oplist{grid-template-columns:repeat(3,1fr)}}
.opcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;transition:border-color .12s}
.opcard:hover{border-color:var(--bd2)}
.ophead{display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.03em;flex:none}
.ophead .nm{font-weight:700;font-size:14.5px}
.ophead .co{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.opstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opstat .l{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.opstat .v{font-family:var(--mono);font-weight:600;font-size:14px}
.glist{display:flex;flex-direction:column;gap:8px}
@media(min-width:760px){.glist{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.grow{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh)}
.grow:hover{border-color:var(--bd2)}
.grow .g-nm{flex:1;min-width:0}
.grow .g-nm b{font-size:14px;font-weight:600;display:block}
.grow .g-nm span{font-size:12px;color:var(--tx2)}
.grow .g-pvr{text-align:right;font-size:11.5px;color:var(--mu);flex:none}
.grow .g-pvr b{display:block;font-family:var(--mono);font-size:14px;color:var(--tx);font-weight:600}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.rchip{font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--bd);border-radius:7px;padding:4px 9px;background:var(--surf)}
.rchip:hover{border-color:var(--acc);color:var(--acc)}
.util{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--bd);font-size:13px}
.util .minibar{flex:1}

/* about */
.prose{font-size:13.5px;color:var(--tx2);line-height:1.6}
.prose p{margin-bottom:10px}
.prose b{color:var(--tx)}
.prose a{color:var(--acc);font-weight:500}
table.fresh{width:100%;border-collapse:collapse;font-size:12.5px}
table.fresh td{padding:7px 14px;border-top:1px solid var(--bd)}
table.fresh td:last-child{text-align:right;font-family:var(--mono);color:var(--tx2)}
.footer{margin-top:34px;text-align:center;font-size:11.5px;color:var(--mu);line-height:1.7}

/* UK-plate styling for vehicle registrations */
.plate{display:inline-block;font-family:var(--mono);font-weight:600;font-size:11.5px;letter-spacing:.06em;color:#111;background:#fc0;border:1.5px solid #1c1917;border-radius:5px;padding:1px 7px;line-height:1.5;white-space:nowrap}
a.plate:hover{background:#ffd83d}
/* long values (vehicle makes, company names) must not balloon a card —
   cap the cell and let it scroll inside */
.kv .v{max-height:76px;overflow-y:auto;overscroll-behavior:contain}
/* full-width message inside a card (empty states, loading) — wraps, never
   uses the k/v flex pair whose no-shrink key column overflows the card */
.kv-empty{padding:12px 14px;color:var(--mu);font-size:13px;line-height:1.5}
.livechip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--good)}
.livechip .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* tooltips — data source + refresh cadence on any label */
[data-tip]{text-decoration:underline dotted var(--bd2);text-underline-offset:3px;cursor:help}
.tipbox{position:fixed;z-index:90;max-width:280px;background:var(--tipbg);color:#fff;font-size:12px;line-height:1.5;border-radius:9px;padding:9px 12px;box-shadow:0 6px 22px rgba(28,25,23,.28);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s}
.tipbox.show{opacity:1;transform:none}
.tipbox .src{color:#d6d3d1}

/* ── Network map view ─────────────────────────────────────────────────── */
main.fullbleed{max-width:none;padding:0}
.netmap-wrap{position:relative;height:calc(100dvh - 53px - var(--tab-h) - env(safe-area-inset-bottom))}
@media(min-width:760px){.netmap-wrap{height:calc(100dvh - 53px)}}
#netmap{position:absolute;inset:0;background:var(--surf2);z-index:0}
[hidden]{display:none!important}
.sunset-banner{background:#fef3c7;color:#92400e;border-bottom:1px solid #fcd34d;font-size:12.5px;font-weight:600;line-height:1.45;text-align:center;padding:7px 14px}
:root[data-theme="dark"] .sunset-banner{background:#33260b;color:#fcd34d;border-bottom-color:#5c4a16}
.netmap-panel{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:flex;flex-direction:column;background:color-mix(in srgb, var(--surf) 97%, transparent);backdrop-filter:blur(12px);border:1px solid var(--bd2);border-radius:14px;box-shadow:0 6px 26px rgba(28,25,23,.15);max-height:calc(100% - 24px);overflow:hidden}
@media(min-width:760px){.netmap-panel{right:auto;width:342px}}
.nm-search{display:flex;align-items:center;gap:9px;padding:11px 13px}
.nm-search svg{color:var(--mu);flex:none}
.nm-search input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.nm-search .clear{color:var(--mu);padding:2px;border-radius:6px}
.nm-search .clear:hover{color:var(--tx)}
.nm-sugg{border-top:1px solid var(--bd);max-height:36dvh;overflow-y:auto;padding:5px}
.nm-sug{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:9px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.nm-sug .rnum{min-width:38px;height:24px;font-size:12px;flex:none}
.nm-sug .op{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm-sug .ty{margin-left:auto;font-size:11px;color:var(--mu);flex:none;padding-left:8px}
.nm-sug.act,.nm-sug:hover{background:var(--bg)}
.nm-nores{padding:9px 10px;font-size:12.5px;color:var(--mu)}
.nm-tools{display:flex;align-items:center;gap:7px;padding:9px 11px;flex-wrap:wrap;border-top:1px solid var(--bd)}
.nm-lbl{font-size:11px;color:var(--mu);font-weight:600}
.nm-colour{display:flex;align-items:center;justify-content:space-between;flex:1 0 100%}
.nm-legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 13px 9px;border-top:1px solid var(--bd);font-size:11px;color:var(--tx2)}
.nm-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.nm-legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.nm-badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;margin-left:5px}
.nm-term{transform:translate(-50%,-50%);display:inline-block;color:#fff;border:1.5px solid #fff;border-radius:7px;padding:1px 5px;font-family:var(--mono);font-weight:700;font-size:9.5px;white-space:nowrap;box-shadow:0 2px 7px rgba(0,0,0,.35)}
.expchip{display:inline-block;vertical-align:1px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:999px;padding:1px 8px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:6px}
.nm-filters{border-top:1px solid var(--bd);padding:11px 13px;display:flex;flex-direction:column;gap:11px;max-height:32dvh;overflow-y:auto}
.nm-group-h{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.nm-group-chips{display:flex;flex-wrap:wrap;gap:6px}
.nm-body{border-top:1px solid var(--bd);overflow-y:auto;padding:9px 11px;display:flex;flex-direction:column;gap:8px}
.netmap-card{position:relative;border:1px solid var(--bd);border-radius:11px;padding:10px 12px;background:var(--surf)}
.netmap-card .close{position:absolute;top:8px;right:8px;color:var(--mu);padding:3px;border-radius:6px}
.netmap-card .close:hover{color:var(--tx);background:var(--bg)}

  if(t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

<script type="module">
/* ════════════════════════════════════════════════════════════════════════
   London Buses v2 — single-file app, all data from this site’s own pipeline (data/api/*.json) plus TfL’s live endpoints.
   One file on purpose: the farhan.app zone edge-caches js/css for 4 h,
   which has repeatedly served mixed old/new module graphs mid-deploy.
   HTML is served max-age=0, so a single file can never version-skew.
   ════════════════════════════════════════════════════════════════════════ */

/* The data layer reads this site's own faux-API — data/api/*.json, rebuilt
   by the GitHub Actions pipeline and deployed with the site. Same shapes the
   Atlas API used to serve, so everything downstream is unchanged. */
const API = '/data/api';
const TFL = 'https://api.tfl.gov.uk';   // CORS-open, no key needed at browser rates

/* ── Data layer — one cached promise per endpoint ─────────────────────── */
const _cache = new Map();
function get(path){
  if(_cache.has(path)) return _cache.get(path);
  const p = fetch(API + path + '.json').then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .catch(err => { console.warn('data', path, err.message); _cache.delete(path); return null; });
  _cache.set(path, p);
  return p;
}
/* Historical guard from the Atlas era ("Transport UK London Bus (RATP)") —
   the pipeline now canonicalises operator names, this is a no-op safety net. */
const fixOperator = o => o === 'Transport UK London Bus (RATP)' ? 'Transport UK London Bus' : o;
const fixOperatorDeep = d => d == null ? d : JSON.parse(JSON.stringify(d).replaceAll('Transport UK London Bus (RATP)', 'Transport UK London Bus'));
/* Live fetches align with the feed's refresh clock: payloads carry
   capturedAt, and Cache-Control's max-age is CORS-readable — so the next
   poll is scheduled just after the edge copy expires, instead of on our own
   drifting timer. */
function liveGet(url){
  return fetch(url).then(async x => {
    if(!x.ok) return null;
    const j = await x.json();
    const ma = /max-age=(\d+)/.exec(x.headers.get('cache-control') ?? '');
    if(j && typeof j === 'object') j._ttl = ma ? +ma[1] : null;
    return j;
  }).catch(() => null);
}
function nextPollS(j, fallbackS){
  const ttl = Number.isFinite(j?._ttl) && j._ttl > 0 ? j._ttl : fallbackS;
  const cap = Date.parse(j?.capturedAt ?? '');
  if(!Number.isFinite(cap)) return fallbackS;
  const s = Math.round((cap + ttl*1000 + 1500 - Date.now()) / 1000);
  return Math.max(4, Math.min(ttl + fallbackS, s));   // stale edge → quick retry
}
/* TfL-direct live adapters — wrap TfL's CORS-open responses into the
   { data, capturedAt } envelope the consumers already read. */
const tflLive = (url) => liveGet(url).then(j => {
  if(j == null) return null;
  const arr = Array.isArray(j) ? j : [j];
  return { data: arr, capturedAt: new Date().toISOString(), _ttl: j?._ttl ?? arr?._ttl ?? null };
});
const D = {
  routes:      () => get('/routes'),
  meta:        () => get('/route-meta').then(d => { const r = d?.routes ?? {}; for(const m of Object.values(r)) if(m?.operator) m.operator = fixOperator(m.operator); return r; }),
  garages:     () => get('/garages').then(d => { const g = d?.garages ?? []; for(const x of g) if(x?.operator) x.operator = fixOperator(x.operator); return g; }),
  fleet:       () => get('/fleet').then(d => d?.byRoute ?? {}),
  crowding:    () => get('/crowding'),
  crowdProf:   () => get('/crowding-profile').then(d => d?.routes ?? {}),
  tenders:     () => get('/tenders').then(d => fixOperatorDeep(d?.byRoute ?? {})),
  diversions:  () => get('/route-diversions').then(d => d?.routes ?? {}),
  lineStatus:  () => get('/line-status'),
  manifest:    () => get('/manifest'),
  stops:       () => get('/route-stops').then(d => d?.routes ?? {}),      // ~1 MB gz — lazy, route detail only
  overview:    () => get('/routes-overview'),                              // GeoJSON — lazy, map only
  vehiclesReg: () => get('/vehicles').then(d => fixOperatorDeep(d?.byReg ?? {})),
  liveStatus:  (r) => tflLive(TFL + '/Line/' + encodeURIComponent(r) + '/Status'),                 // never cached — re-polled
  liveVehicles:(r) => liveGet('/api/live/vehicles?line=' + encodeURIComponent(r)),                 // BODS via our Pages Function
  arrivals:    (s) => tflLive(TFL + '/StopPoint/' + encodeURIComponent(s) + '/Arrivals'),          // never cached — polled
};
const plate = (reg, link=true) => reg
  ? (link ? `<a class="plate" href="#/vehicle/${encodeURIComponent(String(reg).toUpperCase())}">${esc(String(reg).toUpperCase())}</a>`
          : `<span class="plate">${esc(String(reg).toUpperCase())}</span>`)
  : '';

/* Stop registry — every unique stop across all routes, derived once from
   route-stops: id → { name, lat, lng, lines:Set }. */
let _stopRegP = null;
function stopRegistry(){
  return _stopRegP ??= D.stops().then(routes => {
    const reg = new Map();
    for(const [rid, rec] of Object.entries(routes ?? {})){
      for(const d of ['outbound','inbound']){
        for(const s of rec?.[d] ?? []){
          let e = reg.get(s.id);
          if(!e){ e = { id:s.id, name:s.name, lat:s.lat, lng:s.lng, letter:null, lines:new Set() }; reg.set(s.id, e); }
          // Flag letter — present on most entries; "->N"-style values are
          // TfL's unlettered compass markers, not display letters.
          if(!e.letter && s.letter && !String(s.letter).includes('->') && String(s.letter).trim().length <= 3)
            e.letter = String(s.letter).trim();
          for(const l of s.lines ?? []) e.lines.add(l);
          e.lines.add(rid.toUpperCase());
        }
      }
    }
    return reg;
  });
}

/* ── Small utils ──────────────────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stripTags = s => String(s ?? '').replace(/<[^>]*>/g, ' ')
  .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"')
  .replace(/\s+/g,' ').trim();
const num = v => Number.isFinite(v) ? v : null;
const tvrOf = pvr => Number.isFinite(pvr) ? Math.floor(pvr * 1.13) : null;
const fmtDate = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d)
  ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : null; };
const monthYear = ym => { const m = /^(\d{4})-(\d{2})/.exec(ym ?? ''); return m ? `${m[2]}/${m[1]}` : null; };
const title = s => String(s ?? '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
const cmpRoute = (a,b) => { const na=parseInt(a,10), nb=parseInt(b,10);
  if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb; if(!isNaN(na)&&isNaN(nb)) return -1; if(isNaN(na)&&!isNaN(nb)) return 1;
  return String(a).localeCompare(String(b)); };

const TYPE_LABEL = { regular:'Day', night:'Night', twentyfour:'24-hour', school:'School' };
const PROPULSION = ['electric','hybrid','hydrogen','diesel'];
const OP_INITIALS = { 'Arriva':'ARL','Arriva London':'ARL','First':'FRG','First Bus London':'FRG','First London':'FRG','Go-Ahead':'GAL','Go-Ahead London':'GAL','Metroline':'MLN','Stagecoach':'SCL','Stagecoach London':'SCL','Transport UK':'TUK','Transport UK London Bus':'TUK','Transport UK London Bus (RATP)':'TUK','RATP':'RTP','RATP Dev':'RTP','Uno':'UNO','Uno Buses':'UNO','Falcon':'FAL','Falcon Buses':'FAL' };
const OP_COLORS   = { 'Arriva London':'#2563eb','Arriva':'#2563eb','First Bus London':'#7c3aed','First London':'#7c3aed','First':'#7c3aed','Go-Ahead London':'#dc2626','Go-Ahead':'#dc2626','Metroline':'#0891b2','Stagecoach London':'#1e3a8a','Stagecoach':'#1e3a8a','Transport UK London Bus':'#db2777','Transport UK London Bus (RATP)':'#db2777','Transport UK':'#db2777','Uno':'#d97706','Uno Buses':'#d97706' };
/* Upstream sources sometimes reword operator names ("First London" became "First Bus
   London") — fall back to the longest dictionary key the name starts with,
   so a rewording degrades to the right colour, not to fallback grey. */
const opKey = (dict, n) => dict[n] != null ? n
  : Object.keys(dict).sort((a,b) => b.length - a.length).find(k => String(n ?? '').startsWith(k));
const opInitials = n => { const k = opKey(OP_INITIALS, n); return k ? OP_INITIALS[k] : String(n ?? '?').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(); };
const opColor    = n => { const k = opKey(OP_COLORS, n); return k ? OP_COLORS[k] : '#57534e'; };

/* One garage pin for every map: operator initials over the garage code —
   "GAL / (Q)" — so both identities read at a glance. */
function garagePinIcon(g, size = 38, tint = null, ring = false){
  // tint: focus colour(s) while comparing routes — the pin matches its
  // route's line so "operated from here" reads at a glance. Two focused
  // routes from one garage split the pin diagonally.
  const bg = Array.isArray(tint) && tint.length > 1
    ? `linear-gradient(135deg, ${tint[0]} 50%, ${tint[1]} 50%)`
    : (Array.isArray(tint) ? tint[0] : tint) ?? opColor(g.operator);
  return L.divIcon({ className:'', iconSize:[size,size], iconAnchor:[size/2,size/2],
    html:`<div style="width:${size}px;height:${size}px;border-radius:10px;background:${bg};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;font-family:var(--sans);border:2px solid #fff;box-shadow:${ring ? '0 0 0 3px var(--acc), ' : ''}0 2px 8px rgba(0,0,0,.3)">
      <span style="font-weight:800;font-size:${size>=38?'10.5':'9'}px;letter-spacing:.02em">${opInitials(g.operator)}</span>
      <span style="font-weight:600;font-size:8.5px;opacity:.85">(${esc(g.code)})</span></div>` });
}
/* Garage popup used by every map pin: headline numbers, every route as a
   tappable chip, and the detail link. */
function garagePopupHtml(g, meta){
  const tvr = tvrOf(g.pvr);
  const props = (g.routes ?? []).map(r => meta?.[r]?.propulsion).filter(Boolean);
  const ev = props.length ? Math.round(props.filter(p => p === 'electric' || p === 'hydrogen').length / props.length * 100) + '%' : '—';
  const row = (l, v) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:5px 0;border-top:1px solid var(--bd)"><span style="color:var(--tx2)">${l}</span><b style="font-family:var(--mono);font-size:12.5px">${v}</b></div>`;
  const chips = [...(g.routes ?? [])].sort(cmpRoute).map(r =>
    `<a href="#/route/${encodeURIComponent(r)}" style="background:var(--surf2);color:var(--tx);border-radius:6px;padding:1px 6px;font-family:var(--mono);font-weight:600;font-size:10.5px">${esc(r)}</a>`).join('');
  return `<div style="min-width:212px"><b style="font-size:13.5px">${esc(g.name)} (${esc(g.code)})</b>
    <div style="color:var(--tx2);margin:1px 0 8px">${esc(g.operator ?? '')}</div>
    ${row('PVR', g.pvr ?? '—')}${row('TVR', tvr ?? '—')}${row('Capacity', g.capacity ?? '—')}${row('Zero-emission', ev)}${row('Routes operated', (g.routes ?? []).length)}
    <div style="font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:9px 0 5px">Routes operated</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;max-width:250px;margin-bottom:9px">${chips}</div>
    <a href="#/garage/${encodeURIComponent(g.code)}" style="color:var(--acc);font-weight:600">Garage details ›</a></div>`;
}

/* A garage is pinnable only when the dataset has its real site location. When
   postcodeSource is "company" the lat/lng is the operating company's
   registered office — pinning that as the garage would be wrong data. */
const garageLocOk = g => Number.isFinite(g?.lat) && Number.isFinite(g?.lng) && g.postcodeSource !== 'company';

/* Base tiles for every map view: standard OpenStreetMap raster tiles —
   keyless. CARTO's free basemap tiles started requiring an API key (served
   "API KEY REQUIRED" watermark tiles from 2026-08), which also ends the
   nolabels/labels-pane split — OSM bakes labels into the base tiles. Dark
   mode is an invert/hue-rotate filter on the tile pane (the standard
   raster-tile dark treatment). */
function baseTiles(map){
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, className: isDark() ? 'tiles-dark' : '' }).addTo(map);
}
/* Every map view is built through this one constructor — same options, same
   single-line attribution, same tiles — so the mini maps stay consistent by
   construction rather than by review. */
function makeMap(el){
  const map = L.map(el, { zoomControl:false, preferCanvas:true, attributionControl:false });
  baseTiles(map);   // credits live in the About page, not on every map corner
  return map;
}

/* TfL publishes several notices per line, sometimes another route's. Count
   only notices whose validity window covers now (isNow is unreliable), take
   the worst, and among equals prefer prose naming this route. */
function pickStatus(name, statuses){
  if(!statuses?.length) return null;
  const now = Date.now();
  const active = statuses.filter(ls => {
    if(ls.statusSeverity === 10) return true;
    const vps = ls.validityPeriods;
    if(!vps?.length) return true;
    return vps.some(vp => {
      const f = vp.fromDate ? Date.parse(vp.fromDate) : NaN, t = vp.toDate ? Date.parse(vp.toDate) : NaN;
      return (isNaN(f) || f <= now) && (isNaN(t) || t >= now);
    });
  });
  if(!active.length) return { status:'Good Service', reason:null, severity:10 };
  const mentions = ls => {
    const r = ls.reason ?? '';
    if(new RegExp('\\broutes?\\b[^.:]*\\b'+name+'\\b','i').test(r)) return 2;
    if(new RegExp('\\b'+name+'\\b','i').test(r)) return 1;
    return 0;
  };
  const pick = active.map((ls,i)=>({ls,i,sev:ls.statusSeverity ?? 10,m:mentions(ls)}))
    .sort((a,b)=>a.sev-b.sev || b.m-a.m || a.i-b.i)[0].ls;
  return { status:pick.statusSeverityDescription ?? null, reason:pick.reason ?? null, severity:pick.statusSeverity ?? null };
}

/* ── Tooltips — source + refresh cadence on every label ───────────────────
   One dictionary keyed by visible label text, applied automatically to any
   rendered view by a MutationObserver, shown on hover (desktop) or tap
   (touch). */
const S = {
  LBR:     'londonbusroutes.net, via this site’s data pipeline|Refreshed nightly',
  TFL:     'TfL Unified API, via this site’s data pipeline|Refreshed nightly',
  BUSTO:   'TfL BUSTO demand data (archived snapshot)|TfL publishes annually',
  FLEET:   'TfL arrivals sweeps + DVLA, via this site’s data pipeline|Sampled ~midday, ~midnight and overnight',
  DIVN:    'TfL service status, diversion notices|Refreshed ~6×/day',
  TENDER:  'TfL tender award results, via this site’s data pipeline|Checked after TfL’s ~1pm/~3pm publishes',
  CURATED: 'Curated data — published for a few flagship routes only|Refreshed nightly',
  LIVE:    'TfL live status, straight from TfL|~30 s fresh',
  ARRIVE:  'TfL Countdown predictions, straight from TfL|~30 s fresh',
  STOPS:   'TfL served-stop sequence (canonical)|Refreshed nightly',
  TVR:     'Derived: PVR × 1.13, rounded down|Follows PVR (nightly)',
  CAPACITY:'Community reference, curated|Updated as allocations change',
  DERIVED: 'Derived from route data|Refreshed nightly',
  GPS:     'Live bus GPS (BODS SIRI-VM), via this site’s live proxy|~10 s fresh',
};
const LABEL_TIPS = {
  'PVR': ['Peak Vehicle Requirement — buses needed at peak', S.LBR],
  'TVR': ['Total Vehicle Requirement — PVR plus spares allowance', S.TVR],
  'Length': ['One-way route length', S.LBR],
  'Type': ['Day / night / 24-hour / school', S.TFL],
  'Power': ['Propulsion, reconciled against the DVLA-enriched live fleet', S.LBR],
  'Vehicle': ['Rostered vehicle spec', S.LBR],
  'Rostered vehicle': ['', S.LBR],
  'Peak load': ['Peak passengers ÷ capacity at the max-demand hour', S.BUSTO],
  'Busiest at': ['Stop, day and time of the peak load', S.BUSTO],
  'Weekday': ['Peak load ÷ capacity on weekdays', S.BUSTO],
  'Saturday': ['Peak load ÷ capacity on Saturdays', S.BUSTO],
  'Sunday': ['Peak load ÷ capacity on Sundays', S.BUSTO],
  'Observed in last sample': ['Distinct vehicles seen on the route in the last build — a point-in-time sample, not the full roster', S.FLEET],
  'Average age': ['Mean vehicle age across the observed sample', S.FLEET],
  'Makes': ['Chassis makers across the observed sample', S.FLEET],
  'Operator': ['Operating brand', S.LBR],
  'Company': ['Legal operating company', S.LBR],
  'Contract start': ['', S.CURATED],
  'Contract end': ['', S.CURATED],
  'Awarded on': ['Award date of this tender', S.TENDER],
  'Awarded to': ['Winning operator', S.TENDER],
  'Cost per mile': ['£ per live mile of the award', S.TENDER],
  'Accepted bid': ['Winning bid, £ per year', S.TENDER],
  'Bids received': ['How many operators bid', S.TENDER],
  'Joint bid': ['Whether tendered as part of a joint bid across routes', S.TENDER],
  'Awarded vehicle': ['Vehicle spec required by the award', S.TENDER],
  'Contracted miles': ['Annual live miles — accepted bid ÷ cost per mile', S.TENDER],
  'Tranche': ['LBSL tendering programme batch', S.TENDER],

function applyTips(root){
  root.querySelectorAll('.fact .l, .kv .k, .opstat .l, .section-h, .statusline b').forEach(el => {
    if(el.dataset.tip !== undefined) return;
    const text = (el.textContent ?? '').trim();
    let hit = LABEL_TIPS[text];
    if(!hit){  // section headers carry a suffix, e.g. "Reliability · TfL QSI Q4 25/26"
      const pk = Object.keys(LABEL_TIPS).find(k => text.startsWith(k + ' ·'));
      if(pk) hit = LABEL_TIPS[pk];
    }
    if(!hit && el.matches('.statusline b')) hit = LABEL_TIPS['Good Service'];
    if(!hit) return;
    const [desc, sf] = hit;
    const [src, fresh] = sf.split('|');
    el.dataset.tip = `${desc ? desc + '\n' : ''}Source: ${src}\n${fresh}`;
  });
}
const tipbox = document.createElement('div');
tipbox.className = 'tipbox';
document.body.appendChild(tipbox);
let tipTarget = null;
function showTip(el){
  const raw = el.dataset.tip ?? '';
  const lines = raw.split('\n');
  tipbox.innerHTML = lines.map((l,i) => i === 0 && lines.length > 1 && !l.startsWith('Source:')
    ? `<div style="margin-bottom:3px">${esc(l)}</div>` : `<div class="src">${esc(l)}</div>`).join('');
  const r = el.getBoundingClientRect();
  tipbox.classList.add('show');
  const w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  let x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  let y = r.top - h - 8; if(y < 8) y = r.bottom + 8;
  tipbox.style.left = x + 'px'; tipbox.style.top = y + 'px';
  tipTarget = el;
}
function hideTip(){ tipbox.classList.remove('show'); tipTarget = null; }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if(t && t !== tipTarget) showTip(t); });
document.addEventListener('mouseout',  e => { if(e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tip]');
  if(t){ if(t.closest('a,button') === null){ e.preventDefault(); } tipTarget === t ? hideTip() : showTip(t); }
  else hideTip();
}, true);
window.addEventListener('scroll', hideTip, { passive:true });
new MutationObserver(() => applyTips(document.getElementById('main'))).observe(
  document.getElementById('main'), { childList:true, subtree:true });

/* ── Router ───────────────────────────────────────────────────────────── */
const main = document.getElementById('main');
const routesViewState = { q:'', type:null, op:null, prop:null };  // survives back-nav
let liveTimers = [];   // every polling surface registers here — all killed on nav
const addLiveTimer = t => { liveTimers.push(t); return t; };

function navigate(){
  for(const t of liveTimers) clearInterval(t);
  liveTimers = [];
  const h = location.hash.replace(/^#\/?/, '');
  const [seg, arg] = h.split('/').map(decodeURIComponent);
  const view = seg === '' ? 'routes' : seg;
  const navKey = view === 'route' ? 'routes' : view === 'garage' ? 'garages'
    : view === 'operator' ? 'operators' : view === 'stop' ? 'stops' : view === 'vehicle' ? 'routes' : view;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));
  window.scrollTo(0, 0);
  main.classList.toggle('fullbleed', view === 'map');
  if(view === 'routes')         renderRoutes();
  else if(view === 'map')       renderNetworkMap();
  else if(view === 'route')     renderRouteDetail(arg);
  else if(view === 'stops')     renderStops();
  else if(view === 'stop')      renderStopDetail(arg);
  else if(view === 'operators') renderOperators();
  else if(view === 'operator')  renderOperatorDetail(arg);
  else if(view === 'garages')   renderGarages();
  else if(view === 'garage')    renderGarageDetail(arg);
  else if(view === 'vehicle')   renderVehicleDetail(arg);
  else if(view === 'about')     renderAbout();
  else                          renderRoutes();
}
window.addEventListener('hashchange', navigate);

/* ── Theme ── */
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('v2-theme', t); } catch(e){}
  syncThemeBtn();
  navigate();               // rebuild the view so maps pick up the dark tiles
}
function syncThemeBtn(){
  const b = document.getElementById('themeBtn');
  if(!b) return;
  b.querySelector('.th-moon').style.display = isDark() ? 'none' : '';
  b.querySelector('.th-sun').style.display  = isDark() ? '' : 'none';
  b.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode');
}
document.getElementById('themeBtn')?.addEventListener('click', () => setTheme(isDark() ? 'light' : 'dark'));
syncThemeBtn();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', e => {
  let stored = null; try { stored = localStorage.getItem('v2-theme'); } catch(err){}
  if(stored !== 'light' && stored !== 'dark'){   // still following the system
    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    syncThemeBtn(); navigate();
  }
});

async function renderRoutes(){
  main.innerHTML = `
    <div class="searchwrap">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input id="q" placeholder="Search a route, e.g. 25 or N73" autocomplete="off" inputmode="search" value="${esc(routesViewState.q)}" />
        <button class="clear" id="qClear" aria-label="Clear search" ${routesViewState.q?'':'hidden'}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="count-note" id="countNote"></div>
    <div class="rlist" id="rlist">${'<div class="skel" style="height:56px"></div>'.repeat(8)}</div>`;

  const [routes, meta, lineStatus] = await Promise.all([D.routes(), D.meta(), D.lineStatus()]);
  if(!routes){ document.getElementById('rlist').innerHTML = '<div class="empty">The route data is unreachable right now — try again shortly.</div>'; return; }
  const disrupted = new Set((lineStatus?.rows ?? []).filter(r => r.severity !== 10).map(r => r.route));

  const ops = [...new Set(Object.values(meta).map(m => m?.operator).filter(Boolean))].sort();

  function chipsHtml(){
    const st = routesViewState;
    const c = [];
    for(const [key,label] of Object.entries(TYPE_LABEL))
      c.push(`<button class="chip ${st.type===key?'on':''}" data-f="type" data-v="${key}">${label}</button>`);
    for(const p of PROPULSION)
      c.push(`<button class="chip ${st.prop===p?'on':''}" data-f="prop" data-v="${p}">${title(p)}</button>`);
    for(const o of ops)
      c.push(`<button class="chip ${st.op===o?'on':''}" data-f="op" data-v="${esc(o)}">${esc(o.replace(' London',''))}</button>`);
    return c.join('');
  }

  function rowsHtml(){
    const st = routesViewState;
    const q = st.q.trim().toUpperCase();
    let list = routes.filter(r => {
      const m = meta[r.name] ?? {};
      if(q && !r.name.toUpperCase().startsWith(q)) return false;
      if(st.type && r.type !== st.type) return false;
      if(st.op && m.operator !== st.op) return false;
      if(st.prop && m.propulsion !== st.prop) return false;
      return true;
    }).sort((a,b) => cmpRoute(a.name, b.name));
    document.getElementById('countNote').textContent =
      `${list.length} route${list.length===1?'':'s'}${q||st.type||st.op||st.prop ? ' match' : ''}`;
    if(!list.length) return '<div class="empty">No routes match.</div>';
    return list.map(r => {
      const m = meta[r.name] ?? {};
      const ga = [m.garageName, m.garage ? `(${m.garage})` : null].filter(Boolean).join(' ');
      return `<a class="rrow" href="#/route/${encodeURIComponent(r.name)}">
        <span class="rnum ${r.type}">${esc(r.name)}</span>
        <span class="rmeta">
          <span class="op">${esc(m.operator ?? '—')}
            ${m.propulsion ? `<span class="rtag ${m.propulsion}">${esc(m.propulsion)}</span>` : ''}
            ${r.type !== 'regular' ? `<span class="rtag">${TYPE_LABEL[r.type] ?? r.type}</span>` : ''}
          </span>
          <span class="ga">${esc(ga || '—')}</span>
        </span>
        <span class="pvr">${disrupted.has(r.name) ? '<span class="warn-dot" title="Disruption reported"></span>' : ''}<b>${m.pvr ?? '—'}</b>PVR</span>
      </a>`;
    }).join('');
  }

  const chips = document.getElementById('chips');
  const rlist = document.getElementById('rlist');
  const rerender = () => { rlist.innerHTML = rowsHtml(); };
  chips.innerHTML = chipsHtml();
  rerender();

  chips.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const f = b.dataset.f, v = b.dataset.v;
    routesViewState[f] = routesViewState[f] === v ? null : v;
    chips.innerHTML = chipsHtml();
    rerender();
  });
  const q = document.getElementById('q'), qClear = document.getElementById('qClear');
  q.addEventListener('input', () => {
    routesViewState.q = q.value;
    qClear.hidden = !q.value;
    rerender();
  });
  qClear.addEventListener('click', () => { q.value=''; routesViewState.q=''; qClear.hidden=true; rerender(); q.focus(); });
}
