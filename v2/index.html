/* Vehicle live-location map — find the bus in the live GPS feed (trying the
   arrival-context line first, then every route the register has seen it on),
   then draw it against its route's line and, when the user arrived from a
   stop's arrivals board, that stop. Polls every 15 s while the page is open. */
async function initVehicleLiveMap(R, v, ctxLine, ctxStop){
  const sec = document.getElementById('vLiveSec');
  const candidates = [...new Set([ctxLine, ...(v?.routes ?? [])].filter(Boolean).map(x => String(x).toUpperCase()))];
  if(!sec || !candidates.length) return;
  sec.hidden = false;

  let lastFeed = null, feedOk = false;
  async function findBus(){
    for(const line of candidates){
      const raw = await D.liveVehicles(line);
      if(raw){ lastFeed = raw; feedOk = true; }
      const hit = (raw?.data ?? []).find(x => String(x.reg ?? '').toUpperCase() === R
        && Number.isFinite(x.lat) && Number.isFinite(x.lng));
      if(hit) return hit;
    }
    return null;
  }

  const first = await findBus();
  if(!document.getElementById('vLiveSec')) return;   // navigated away
  const note = document.getElementById('vLiveNote');
  if(!first){
    document.getElementById('map').remove();
    if(note) note.textContent = 'Not in the live GPS feed right now — it may not be in service.';
    return;
  }

  if(_map){ _map.remove(); _map = null; }
  _map = makeMap(document.getElementById('map'));
  _map.setView([first.lat, first.lng], 14);   // layers need a live projection before they're added

  const line = String(first.publishedLine ?? ctxLine ?? candidates[0]).toUpperCase();
  D.overview().then(ov => {
    if(!_map) return;
    const feats = (ov?.features ?? []).filter(f => (f.properties?.name ?? '').toUpperCase() === line);
    if(feats.length) L.geoJSON({type:'FeatureCollection',features:feats},
      { style:{ color:'#dc2626', weight:4, opacity:.6, lineCap:'round', lineJoin:'round' } }).addTo(_map);
  });

  let stopLL = null;
  if(ctxStop){
    const reg = await stopRegistry();     // cached — the user came through the stops flow
    const s = reg?.get(ctxStop);
    if(s && _map){
      stopLL = [s.lat, s.lng];
      L.circleMarker(stopLL, { radius:7, color:isDark()?'#f0eeec':'#1c1917', weight:2.5, fillColor:isDark()?'#1b1917':'#fff', fillOpacity:1 })
        .bindPopup(`<b>${esc(s.name)}</b><br><a href="#/stop/${encodeURIComponent(ctxStop)}" style="color:var(--acc);font-weight:600">Live arrivals ›</a>`)
        .addTo(_map);
    }
  }

  let busMarker = null;
  function drawBus(b){
    const col = String(b.direction) === '2' ? '#06b6d4' : '#f97316';
    const icon = L.divIcon({ className:'lb-bus', iconSize:[22,22], iconAnchor:[11,11],
      html: Number.isFinite(b.bearing)
        ? `<div style="transform:rotate(${b.bearing}deg)"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 19 21 12 16 5 21Z" fill="${col}" stroke="#fff" stroke-width="1.6"/></svg></div>`
        : `<div style="width:13px;height:13px;margin:4px;border-radius:50%;background:${col};border:2px solid #fff"></div>` });
    if(busMarker){ busMarker.setLatLng([b.lat, b.lng]); busMarker.setIcon(icon); }
    else busMarker = L.marker([b.lat, b.lng], { icon })
      .bindPopup(`${plate(R, false)}<br>${esc(b.destination ? 'to ' + title(b.destination) : '')}`)
      .addTo(_map);
  }
  const noteText = extra => {
    if(note) note.innerHTML = `<span class="livechip"><i class="pulse"></i>LIVE</span> · on route ${esc(line)} · ${extra}`;
  };
  drawBus(first);
  let b = L.latLngBounds([[first.lat, first.lng]]);
  if(stopLL) b = b.extend(stopLL);
  _map.fitBounds(b.pad(0.35), { maxZoom: 15 });

  /* live-surface pattern: per-second countdown, 15 s re-poll */
  let nextIn = 15, gone = false;
  noteText('next update in 15 s');
  addLiveTimer(setInterval(async () => {
    if(!document.getElementById('vLiveSec')) return;
    nextIn -= 1;
    if(!gone) noteText(nextIn > 0 ? `next update in ${nextIn} s` : 'updating…');
    if(nextIn <= 0){
      nextIn = 999;
      feedOk = false;
      const cur = await findBus();
      nextIn = feedOk ? nextPollS(lastFeed, 15) : 8;
      if(!document.getElementById('vLiveSec')) return;
      if(cur){ gone = false; drawBus(cur); noteText(`next update in ${nextIn} s`); }
      else if(!feedOk){ if(!gone) noteText('reconnecting…'); }   // feed down ≠ bus gone
      else { gone = true; if(note) note.textContent = 'The bus has left the live feed — it may have completed its trip.'; }
    }
  }, 1000));
}

/* ════════════════════ ABOUT ════════════════════ */
/* £/mile tender history — a STEP chart: the awarded price holds until the
   next award, so the line runs flat and jumps at each new contract (a
   diagonal would invent growth that never happened). Steps wear the colour
   of the incumbent operator, so an operator change reads as the colour
   break at the riser; markers sit at award dates with a surface ring.
   Values are NOT CPI-indexed (deliberate — nominal £ as awarded). */
function cpmChartHtml(routeName, awards){
  const pts = (awards ?? [])
    .filter(a => Number.isFinite(a.costPerMile) && a.costPerMile > 0 && a.awardDate && Number.isFinite(Date.parse(a.awardDate)))
    .map(a => ({ t: Date.parse(a.awardDate), a }))
    .sort((p,q) => p.t - q.t);
  if(pts.length < 2) return '';
  // Chart-local colours: brand colour where one exists; operators outside
  // the brand palette get DISTINCT fallback shades in order of appearance
  // (two unknowns sharing one grey would hide an operator change).
  const FALLBACKS = ['#475569', '#a16207', '#be185d', '#0e7490', '#4d7c0f'];
  const colorOf = (() => {
    const assigned = new Map(); let fi = 0;
    return o => {
      if(!o) return '#57534e';
      if(assigned.has(o)) return assigned.get(o);
      const c = opColor(o);
      const col = c !== '#57534e' ? c : FALLBACKS[fi++ % FALLBACKS.length];
      assigned.set(o, col);
      return col;
    };
  })();
  const W = 640, H = 180, L = 40, R = 14, T = 12, B = 24;
  const tEnd = pts[pts.length-1].t;
  const t0 = pts[0].t;
  const vs = pts.map(p => p.a.costPerMile);

  // clean y ticks: pick a round step (0.5/1/2/5…) covering the value range
  const lo = Math.min(...vs), hi = Math.max(...vs);
  const span = (hi - lo) || hi * 0.2;
  const step = [0.2,0.25,0.5,1,2,2.5,5,10,20,50][[0.2,0.25,0.5,1,2,2.5,5,10,20,50].findIndex(st => span / st <= 4)] ?? 50;
  const v0 = Math.floor(lo / step) * step;
  const v1 = Math.ceil(hi / step) * step + (hi === Math.ceil(hi / step) * step ? 0 : 0);
  const yticks = [];
  for(let v = v0; v <= v1 + 1e-9; v += step) yticks.push(v);
  const X = t => L + (t - t0) / (tEnd - t0 || 1) * (W - L - R);
  const Y = v => T + (1 - (v - v0) / ((v1 - v0) || 1)) * (H - T - B);
  const money = v => '£' + (step < 1 ? v.toFixed(2) : v.toFixed(0));

  // x ticks: first year, last year, up to 3 between
  const y0 = new Date(t0).getUTCFullYear(), yN = new Date(tEnd).getUTCFullYear();
  const ystep = Math.max(1, Math.ceil((yN - y0) / 4));
  const xticks = [];
  for(let y = y0; y <= yN; y += ystep) xticks.push(y);

  // line segments between consecutive awards; each wears the colour of the
  // operator holding the contract through that interval (the earlier award).
  const segs = [];
  for(let i = 1; i < pts.length; i++){
    const from = pts[i-1], to = pts[i];
    segs.push(`<line x1="${X(from.t).toFixed(1)}" y1="${Y(from.a.costPerMile).toFixed(1)}" x2="${X(to.t).toFixed(1)}" y2="${Y(to.a.costPerMile).toFixed(1)}" stroke="${colorOf(from.a.operator)}" stroke-width="2" stroke-linecap="round"/>`);
  }
  const dots = pts.map(p =>
    `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.a.costPerMile).toFixed(1)}" r="4" fill="${colorOf(p.a.operator)}" stroke="var(--surf)" stroke-width="2" pointer-events="none"/>`).join('');
  // Invisible, generous hit targets carry the tooltip payload — native SVG
  // <title> is too unreliable (and absent on touch) to be the hover layer.
  const hits = pts.map((p, i) => {
    const changed = i > 0 && pts[i-1].a.operator && p.a.operator && pts[i-1].a.operator !== p.a.operator;
    const html = `<b>£${p.a.costPerMile.toFixed(2)}/mile</b> · ${esc(fmtDate(p.a.awardDate) ?? p.a.awardDate)}<br>${esc(p.a.operator ?? 'Unknown operator')}`
      + (Number.isFinite(p.a.acceptedBid) ? `<br>Accepted bid £${p.a.acceptedBid.toLocaleString('en-GB')}/yr` : '')
      + (changed ? `<br><span style="color:var(--acc);font-weight:600">Operator change</span> — from ${esc(pts[i-1].a.operator)}` : '');
    return `<circle class="cpm-hit" cx="${X(p.t).toFixed(1)}" cy="${Y(p.a.costPerMile).toFixed(1)}" r="14" fill="transparent" style="cursor:pointer" data-x="${(X(p.t)/W*100).toFixed(2)}" data-y="${(Y(p.a.costPerMile)/H*100).toFixed(2)}" data-cpmtip="${esc(html)}" tabindex="0" role="img" aria-label="${esc(fmtDate(p.a.awardDate) ?? '')} £${p.a.costPerMile.toFixed(2)} per mile, ${esc(p.a.operator ?? '')}"/>`;
  }).join('');

  // end label: the price currently in force, at the line's end (selective)
  const last = pts[pts.length-1];
  const endLabel = `<text x="${(W - R).toFixed(1)}" y="${(Y(last.a.costPerMile) - 7).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--tx)" font-family="var(--mono)">£${last.a.costPerMile.toFixed(2)}</text>`;

  const ops = [...new Set(pts.map(p => p.a.operator).filter(Boolean))];
  const legend = ops.map(o => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;color:var(--tx2)"><i style="width:10px;height:2px;border-radius:1px;background:${colorOf(o)};display:inline-block"></i>${esc(o)}</span>`).join('');

  return `<div class="section"><div class="section-h">Cost per mile · every award</div>
    <div class="card" style="padding:14px 10px 8px">
      <div class="cpmwrap">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Awarded cost per mile at each tender award for route ${esc(routeName)}">
        ${yticks.map(v => `<g><line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}" stroke="var(--bd)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--mu)" font-family="var(--mono)">${money(v)}</text></g>`).join('')}
        ${xticks.map(y => { const x = X(Date.UTC(y,0,1)); return x >= L - 1 && x <= W - R + 1 ? `<text x="${x.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="var(--mu)" font-family="var(--mono)">${y}</text>` : ''; }).join('')}
        ${segs.join('')}${dots}${endLabel}
        ${hits}
      </svg>
      <div class="cpm-tip" hidden></div>
      </div>
      <div class="legendrow" style="padding:7px 8px 3px;flex-wrap:wrap">${legend}</div>
    </div>
    <div class="legendrow" style="margin-top:7px"><span>Nominal £/mile at each award (not indexed against <a href="#/cpi" style="color:var(--acc)">CPI-CPA</a>) — a colour change marks an operator change; hover a dot for the award. ${pts.length} priced awards, ${y0}–${new Date(pts[pts.length-1].t).getUTCFullYear()}.</span></div>
  </div>`;
}

/* ════════════════════ TENDERS — every award, filterable ════════════════ */
async function renderTenders(tab){
  main.innerHTML = `<div class="wrap"><div class="skel" style="height:46px;width:50%"></div></div>`;
  const all = (await D.tendersAll() ?? []).filter(a => a.awardDate);
  if(!all.length){
    main.innerHTML = `<div class="wrap"><div class="empty">The tender register is unreachable right now — try again shortly.</div></div>`;
    return;
  }
  const ops = [...new Set(all.map(a => a.operator).filter(Boolean))].sort();
  const years = [...new Set(all.map(a => String(a.awardDate).slice(0,4)))].sort().reverse();
  const money = v => Number.isFinite(v) ? '£' + v.toLocaleString('en-GB') : '—';
  const PAGE = 20;
  const st = { q:'', op:'', yr:'', sort:'date', dir:-1, page:0 };

  main.innerHTML = `<div class="wrap">
    <div id="dhead"><h1 style="margin:2px 0 4px">Tenders</h1>
      <div style="color:var(--tx2);font-size:13.5px">Both halves of TfL's tendering: published <b>awards</b> (${all.length.toLocaleString('en-GB')} results, ${esc(years[years.length-1])}–${esc(years[0])}) and the forward <b>programme</b> of routes coming up for tender. Filter, sort, and export either.</div></div>
    <div style="display:flex;gap:6px;margin-top:14px" role="tablist" aria-label="Tender tables">
      <button class="livebtn tabpill" id="tabA" role="tab" aria-selected="true">Awards · ${all.length.toLocaleString('en-GB')}</button>
      <button class="livebtn tabpill" id="tabP" role="tab" aria-selected="false">Programme</button>
    </div>
    <div id="tabAwards">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">
      <input id="tq" type="search" placeholder="Search route (e.g. 24) or operator" style="flex:1;min-width:180px;max-width:320px;border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 15px;font-size:13.5px;color:var(--tx)">
      <span style="display:inline-flex;align-items:center;gap:4px">
        <select id="top" style="border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--tx)"><option value="">All operators</option>${ops.map(o => `<option>${esc(o)}</option>`).join('')}</select>
        <button id="topClear" hidden aria-label="Clear operator filter" title="Clear operator filter" style="width:24px;height:24px;border-radius:50%;background:var(--surf2);color:var(--tx2);font-size:13px;line-height:1">✕</button></span>
      <span style="display:inline-flex;align-items:center;gap:4px">
        <select id="tyr" style="border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--tx)"><option value="">All years</option>${years.map(y => `<option>${esc(y)}</option>`).join('')}</select>
        <button id="tyrClear" hidden aria-label="Clear year filter" title="Clear year filter" style="width:24px;height:24px;border-radius:50%;background:var(--surf2);color:var(--tx2);font-size:13px;line-height:1">✕</button></span>
      <button class="livebtn" id="tExport" title="Downloads every award matching the current filters"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>Export CSV</button>
    </div>
    <div class="facts facts--wrap" id="tKpis" style="margin-top:14px"></div>
    <div class="section"><div class="section-h" id="tCount"></div>
      <div class="card" style="overflow-x:auto"><table class="cpi-table" style="min-width:1210px">
        <thead><tr>
          <th data-sort="date" style="cursor:pointer">Awarded ↓</th><th>Route</th><th data-sort="op" style="cursor:pointer">Operator</th>
          <th class="num" data-sort="cpm" style="cursor:pointer">£/mile</th><th class="num" data-sort="acc" style="cursor:pointer">Accepted £/yr</th>
          <th class="num">Lowest</th><th class="num">Highest</th><th class="num" data-sort="bids" style="cursor:pointer">Bids</th>
          <th data-sort="start" style="cursor:pointer">Start</th><th>End</th><th class="num" data-sort="term" style="cursor:pointer">Term</th>

        <tbody id="tBody"></tbody>
      </table></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <button class="livebtn" id="tPrev">‹ Prev</button>
        <span id="tPage" style="font-size:12.5px;color:var(--tx2)"></span>
        <button class="livebtn" id="tNext">Next ›</button>
      </div>
      <div class="legendrow" style="margin-top:8px"><span>Sources: TfL tender results (bids, operators, vehicle notes — checked hourly through the day, append-only) joined with the LBSL tendering programmes (contract start dates, tranches, extension options; 2017/18 onward) and londonbusroutes.net (current contract ends). Contract end = the next contract’s observed start; term = end − start. Nominal £ as awarded. The TfL link on each row opens that award’s original result page.</span></div>
    </div>
    </div>
    <div id="tabProg" hidden>
    <div class="section" style="margin-top:14px"><div class="section-h" style="display:flex;align-items:center;gap:10px">Tendering programme<span id="pCount" style="text-transform:none;letter-spacing:0;color:var(--mu);font-weight:500"></span>
      <button class="livebtn" id="pExport" style="margin-left:auto" title="Downloads every programme entry matching the current filters"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>Export CSV</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
        <input id="pq" type="search" placeholder="Search route (e.g. 24), tranche or description" style="flex:1;min-width:180px;max-width:320px;border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 15px;font-size:13.5px;color:var(--tx)">
        <span style="display:inline-flex;align-items:center;gap:4px">
          <select id="pyr" style="border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--tx)"></select>
          <button id="pyrClear" hidden aria-label="Clear programme-year filter" title="Clear programme-year filter" style="width:24px;height:24px;border-radius:50%;background:var(--surf2);color:var(--tx2);font-size:13px;line-height:1">✕</button></span>
      </div>
      <div class="card" style="overflow-x:auto"><table class="cpi-table" style="min-width:1040px">
        <thead><tr><th>Route</th><th>Description</th><th>Programme</th><th class="num">Tranche</th><th>Issued</th><th>Returns</th><th>Est. award</th><th>Contract start</th><th>Vehicle</th><th>+2 yr</th><th>Source</th></tr></thead>
        <tbody id="pBody"></tbody>
      </table></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <button class="livebtn" id="pPrev">‹ Prev</button>
        <span id="pPage" style="font-size:12.5px;color:var(--tx2)"></span>
        <button class="livebtn" id="pNext">Next ›</button>
      </div>
      <div class="legendrow" style="margin-top:8px"><span>Source: LBSL tendering programme PDFs (one per financial year, republished ~monthly) — the forward half of <a href="https://tfl.gov.uk/forms/13923.aspx" rel="noopener" style="color:var(--acc)">TfL’s tender page</a>. The PDF link on each row opens that programme year’s original document. Routes with a contract start in the future are highlighted; the same flag appears on their route pages.</span></div>
    </div>
    </div>
  </div>`;

  /* Tabs — awards | programme. #/tenders/programme deep-links the second
     tab (the route pages' "Tendering programme" link lands there); switching
     rewrites the hash without re-rendering. */
  const setTab = (which) => {
    const a = which !== 'programme';
    document.getElementById('tabAwards').hidden = !a;
    document.getElementById('tabProg').hidden = a;
    document.getElementById('tabA').classList.toggle('on', a);
    document.getElementById('tabP').classList.toggle('on', !a);
    document.getElementById('tabA').setAttribute('aria-selected', String(a));
    document.getElementById('tabP').setAttribute('aria-selected', String(!a));
    history.replaceState(null, '', a ? '#/tenders' : '#/tenders/programme');
  };
  setTab(tab === 'programme' ? 'programme' : 'awards');
  document.getElementById('tabA').addEventListener('click', () => setTab('awards'));
  document.getElementById('tabP').addEventListener('click', () => setTab('programme'));

  const KEY = { date: a => a.awardDate ?? '', op: a => a.operator ?? '', cpm: a => a.costPerMile ?? -1, acc: a => a.acceptedBid ?? -1, bids: a => a.numberOfTenderers ?? -1, start: a => a.contractStart ?? '', term: a => a.termYears ?? -1 };
  const filtered = () => {
    const q = st.q.trim().toUpperCase();
    // Routes match EXACTLY (typing "24" means route 24, not 124/240/N241 —
    // a combined award like "24/N24" matches on either token); operators
    // still match by substring.
    const routeHit = a => String(a.route ?? '').toUpperCase().split('/').some(t => t.trim() === q);
    let list = all.filter(a =>
      (!st.op || a.operator === st.op)
      && (!st.yr || String(a.awardDate).startsWith(st.yr))
      && (!q || routeHit(a) || String(a.operator ?? '').toUpperCase().includes(q)));
    const k = KEY[st.sort];
    list.sort((x,y) => { const a = k(x), b = k(y); return (a < b ? -1 : a > b ? 1 : 0) * st.dir; });
    return list;
  };
  const routeChips = r => String(r ?? '').split('/').map(x => x.trim()).filter(Boolean)
    .map(x => `<a class="rchip" style="padding:1px 7px;font-size:11px" href="#/route/${encodeURIComponent(x)}">${esc(x)}</a>`).join(' ');

  /* KPI tiles — recomputed against the CURRENT filter, so filtering to an
     operator or a year turns the page into that slice's analysis. */
  const median = arr => { if(!arr.length) return null; const a = [...arr].sort((x,y)=>x-y); const m = a.length>>1; return a.length%2 ? a[m] : (a[m-1]+a[m])/2; };
  function kpis(list){
    const priced = list.filter(a => Number.isFinite(a.costPerMile) && a.costPerMile > 0);
    const medAll = median(priced.map(a => a.costPerMile));

    // £/mile trend: median of the newest 12 months in the slice vs the 12 before
    const newest = list[0]?.awardDate ? Date.parse(String(list.reduce((m,a)=>a.awardDate>m?a.awardDate:m, '0000').slice(0,10))) : NaN;
    const inWin = (a, from, to) => { const t = Date.parse(a.awardDate); return t > from && t <= to; };
    const YR = 3.15576e10;
    const w1 = priced.filter(a => inWin(a, newest - YR, newest)).map(a => a.costPerMile);
    const w0 = priced.filter(a => inWin(a, newest - 2*YR, newest - YR)).map(a => a.costPerMile);
    const trend = (w1.length >= 5 && w0.length >= 5) ? (median(w1) / median(w0) - 1) * 100 : null;

    const withBids = list.filter(a => Number.isFinite(a.numberOfTenderers) && a.numberOfTenderers > 0);
    const avgBids = withBids.length ? withBids.reduce((s,a)=>s+a.numberOfTenderers,0) / withBids.length : null;
    const singleShare = withBids.length ? withBids.filter(a => a.numberOfTenderers === 1).length / withBids.length * 100 : null;

    const contested = list.filter(a => a.fromOperator);
    const retained = contested.length ? contested.filter(a => !a.operatorChange).length / contested.length * 100 : null;

    const bothBids = list.filter(a => Number.isFinite(a.acceptedBid) && Number.isFinite(a.lowestBid));
    const lowestWon = bothBids.length ? bothBids.filter(a => a.acceptedBid <= a.lowestBid).length / bothBids.length * 100 : null;
    const premiums = bothBids.filter(a => a.acceptedBid > a.lowestBid).map(a => (a.acceptedBid / a.lowestBid - 1) * 100);

    const wins = {};
    for(const a of list) if(a.operator) wins[a.operator] = (wins[a.operator] ?? 0) + 1;
    const top = Object.entries(wins).sort((x,y) => y[1] - x[1])[0];

    const f1 = v => v == null ? '—' : v.toFixed(1);
    const tiles = [
      ['Median £/mile', medAll != null ? '£' + medAll.toFixed(2) : '—', `${priced.length.toLocaleString('en-GB')} priced awards`],
      ['£/mile trend', trend != null ? (trend >= 0 ? '+' : '') + trend.toFixed(1) + '%' : '—', 'median, newest 12 mo vs prior 12'],
      ['Bids per tender', avgBids != null ? avgBids.toFixed(1) : '—', singleShare != null ? `${f1(singleShare)}% single-bid` : 'competition'],
      ['Incumbent retained', retained != null ? f1(retained) + '%' : '—', `${contested.length.toLocaleString('en-GB')} re-tenders`],
      ['Won by lowest bid', lowestWon != null ? f1(lowestWon) + '%' : '—', premiums.length ? `else +${f1(median(premiums))}% median premium` : 'accepted = lowest'],
      ['Most awards', top ? top[0] : '—', top ? `${top[1].toLocaleString('en-GB')} in this view` : ''],
    ];
    document.getElementById('tKpis').innerHTML = tiles.map(([l,v,sub]) =>
      `<div class="fact"><div class="l">${l}</div><div class="v" title="${esc(sub)}">${esc(String(v))}</div><div style="font-size:10px;color:var(--mu);margin-top:2px">${esc(sub)}</div></div>`).join('');
  }
  function draw(){
    const list = filtered();
    kpis(list);
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    st.page = Math.min(st.page, pages - 1);
    const shown = list.slice(st.page * PAGE, st.page * PAGE + PAGE);
    const vehCell = a => {
      const v = a.vehicle;
      if(!v) return '—';
      const bits = [v.basis, v.propulsion, v.deck ? v.deck + '-deck' : null].filter(Boolean);
      const label = bits.length ? bits.map(title).join(' · ') : String(v.raw ?? '').replace(/^Awarded on\s*/i, '').replace(/\.$/, '');
      return label ? `<span title="${esc(v.raw ?? '')}">${esc(label.length > 34 ? label.slice(0,32) + '…' : label)}</span>` : '—';
    };
    document.getElementById('tBody').innerHTML = shown.map(a => `<tr>
      <td class="num" style="text-align:left">${esc(fmtDate(a.awardDate) ?? a.awardDate)}</td>
      <td><span style="display:inline-flex;gap:4px;flex-wrap:wrap">${routeChips(a.route)}</span></td>
      <td>${esc(a.operator ?? '—')}${a.operatorChange ? `<div style="font-size:10.5px;color:var(--acc);font-weight:600" title="Operator change">↺ from ${esc(a.fromOperator ?? '')}</div>` : ''}</td>
      <td class="num">${Number.isFinite(a.costPerMile) ? '£' + a.costPerMile.toFixed(2) : '—'}</td>
      <td class="num">${money(a.acceptedBid)}</td>
      <td class="num">${money(a.lowestBid)}</td>
      <td class="num">${money(a.highestBid)}</td>
      <td class="num">${Number.isFinite(a.numberOfTenderers) ? a.numberOfTenderers : '—'}</td>
      <td class="num" style="text-align:left">${esc(fmtDate(a.contractStart) ?? '—')}</td>
      <td class="num" style="text-align:left">${esc(fmtDate(a.contractEnd) ?? '—')}</td>
      <td class="num">${Number.isFinite(a.termYears) ? a.termYears + ' yr' + (a.twoYearExtension ? ' <span title="two-year extension option in the tendering programme" style="color:var(--mu)">+2</span>' : '') : (a.twoYearExtension ? '<span title="two-year extension option in the tendering programme" style="color:var(--mu)">+2 opt</span>' : '—')}</td>
      <td>${vehCell(a)}</td>
      <td>${a.jb?.isJoint ? (a.jb.partners?.length ? `<span style="display:inline-flex;gap:4px;flex-wrap:wrap" title="${esc(a.jb.raw ?? '')}">${routeChips(a.jb.partners.join('/'))}</span>` : 'Yes') : ''}</td>
      <td>${a.btID ? `<a href="https://tfl.gov.uk/forms/13796.aspx?btID=${encodeURIComponent(a.btID)}" target="_blank" rel="noopener" title="This award's original result page on tfl.gov.uk" style="color:var(--acc);white-space:nowrap">TfL ↗</a>` : '—'}</td></tr>`).join('');
    document.getElementById('tCount').textContent = `${list.length.toLocaleString('en-GB')} award${list.length===1?'':'s'}${list.length !== all.length ? ` (of ${all.length.toLocaleString('en-GB')})` : ''}`;
    document.getElementById('tPage').textContent = `Page ${st.page + 1} of ${pages}`;
    document.getElementById('tPrev').disabled = st.page === 0;
    document.getElementById('tNext').disabled = st.page >= pages - 1;
    document.querySelectorAll('#main th[data-sort]').forEach(th => {
      th.textContent = th.textContent.replace(/ [↓↑]$/, '') + (th.dataset.sort === st.sort ? (st.dir < 0 ? ' ↓' : ' ↑') : '');
    });
  }
  draw();
  let deb;
  document.getElementById('tq').addEventListener('input', e => { clearTimeout(deb); deb = setTimeout(() => { st.q = e.target.value; st.page = 0; draw(); }, 150); });
  const syncClears = () => {
    document.getElementById('topClear').hidden = !st.op;
    document.getElementById('tyrClear').hidden = !st.yr;
  };
  document.getElementById('top').addEventListener('change', e => { st.op = e.target.value; st.page = 0; syncClears(); draw(); });
  document.getElementById('tyr').addEventListener('change', e => { st.yr = e.target.value; st.page = 0; syncClears(); draw(); });
  document.getElementById('topClear').addEventListener('click', () => { st.op = ''; document.getElementById('top').value = ''; syncClears(); draw(); });
  document.getElementById('tyrClear').addEventListener('click', () => { st.yr = ''; document.getElementById('tyr').value = ''; syncClears(); draw(); });
  document.getElementById('tPrev').addEventListener('click', () => { st.page = Math.max(0, st.page - 1); draw(); });
  document.getElementById('tNext').addEventListener('click', () => { st.page = st.page + 1; draw(); });
  document.querySelectorAll('#main th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if(st.sort === k) st.dir = -st.dir; else { st.sort = k; st.dir = k === 'op' ? 1 : -1; }
    draw();
  }));
  document.getElementById('tExport').addEventListener('click', () => {
    downloadCsv('london-bus-tenders.csv', [
      ['award_date','route','operator','operator_change','from_operator','cost_per_mile','accepted_bid','lowest_bid','highest_bid','bids_received',
       'contract_start','contract_end','term_years','two_year_extension_option','tranche','vehicle','joint_bid','joint_with','notes','source_url'],
      ...filtered().map(a => [a.awardDate, a.route ?? '', a.operator ?? '', a.operatorChange ? 'yes' : 'no', a.operatorChange ? (a.fromOperator ?? '') : '',
        Number.isFinite(a.costPerMile) ? a.costPerMile : '', Number.isFinite(a.acceptedBid) ? a.acceptedBid : '',
        Number.isFinite(a.lowestBid) ? a.lowestBid : '', Number.isFinite(a.highestBid) ? a.highestBid : '',
        Number.isFinite(a.numberOfTenderers) ? a.numberOfTenderers : '',
        a.contractStart ?? '', a.contractEnd ?? '', Number.isFinite(a.termYears) ? a.termYears : '',
        a.twoYearExtension == null ? '' : (a.twoYearExtension ? 'yes' : 'no'), a.tranche ?? '',
        a.vehicle?.raw ?? '', a.jb?.isJoint ? 'yes' : 'no', a.jb?.partners?.join(' ') ?? '', a.notes ?? '',
        a.btID ? `https://tfl.gov.uk/forms/13796.aspx?btID=${a.btID}` : '']),
    ]);
  });

  /* ── Tendering programme table (the forward half of TfL's forms page) ── */
  const prog = await D.programme();
  document.getElementById('tabP').textContent = `Programme · ${prog.length.toLocaleString('en-GB')}`;
  const pYears = [...new Set(prog.map(e => e.programmeYear).filter(Boolean))].sort().reverse();
  document.getElementById('pyr').innerHTML = '<option value="">All programmes</option>' + pYears.map(y => `<option>${esc(y)}</option>`).join('');
  const today = new Date().toISOString().slice(0, 10);
  const pst = { q:'', yr:'', page:0 };
  const pFiltered = () => {
    const q = pst.q.trim().toUpperCase();
    return prog.filter(e =>
      (!pst.yr || e.programmeYear === pst.yr)
      && (!q || String(e.route).toUpperCase().split('/').some(t => t.trim() === q)
          || String(e.tranche ?? '').toUpperCase() === q
          || String(e.description ?? '').toUpperCase().includes(q)));
  };
  function pDraw(){
    const list = pFiltered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    pst.page = Math.min(pst.page, pages - 1);
    const shown = list.slice(pst.page * PAGE, pst.page * PAGE + PAGE);
    document.getElementById('pBody').innerHTML = shown.map(e => {
      const upcoming = e.contractStart && e.contractStart >= today;
      return `<tr${upcoming ? ' style="background:var(--acc-soft)"' : ''}>
        <td><span style="display:inline-flex;gap:4px;flex-wrap:wrap">${routeChips(e.route)}</span></td>
        <td style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.description ?? '')}">${esc(e.description ?? '—')}</td>
        <td class="num" style="text-align:left">${esc(e.programmeYear ? e.programmeYear.replace(/^(\d{4})-\d{2}(\d{2})$/, '$1/$2') : '—')}</td>
        <td class="num">${esc(e.tranche ?? '—')}</td>
        <td class="num" style="text-align:left">${esc(fmtDate(e.issueDate) ?? '—')}</td>
        <td class="num" style="text-align:left">${esc(fmtDate(e.returnDate) ?? '—')}</td>
        <td class="num" style="text-align:left">${esc(e.awardEstimated ?? '—')}</td>
        <td class="num" style="text-align:left">${upcoming ? '<b>' : ''}${esc(fmtDate(e.contractStart) ?? '—')}${upcoming ? '</b>' : ''}</td>
        <td>${esc(e.vehicleType ?? '—')}</td>
        <td>${e.twoYearExtension == null ? '—' : (e.twoYearExtension ? 'Yes' : 'No')}</td>
        <td>${e.sourceUrl ? `<a href="${esc(e.sourceUrl)}" target="_blank" rel="noopener" title="The ${esc(e.programmeYear ?? '')} programme PDF on content.tfl.gov.uk" style="color:var(--acc);white-space:nowrap">PDF ↗</a>` : '—'}</td></tr>`;
    }).join('');
    const up = list.filter(e => e.contractStart && e.contractStart >= today).length;
    document.getElementById('pCount').textContent = ` · ${list.length.toLocaleString('en-GB')} entries${up ? ` · ${up} upcoming` : ''}`;
    document.getElementById('pPage').textContent = `Page ${pst.page + 1} of ${pages}`;
    document.getElementById('pPrev').disabled = pst.page === 0;
    document.getElementById('pNext').disabled = pst.page >= pages - 1;
  }
  pDraw();
  let pdeb;
  document.getElementById('pq').addEventListener('input', e => { clearTimeout(pdeb); pdeb = setTimeout(() => { pst.q = e.target.value; pst.page = 0; pDraw(); }, 150); });
  document.getElementById('pyr').addEventListener('change', e => { pst.yr = e.target.value; pst.page = 0; document.getElementById('pyrClear').hidden = !pst.yr; pDraw(); });
  document.getElementById('pyrClear').addEventListener('click', () => { pst.yr = ''; document.getElementById('pyr').value = ''; document.getElementById('pyrClear').hidden = true; pDraw(); });
  document.getElementById('pPrev').addEventListener('click', () => { pst.page = Math.max(0, pst.page - 1); pDraw(); });
  document.getElementById('pNext').addEventListener('click', () => { pst.page = pst.page + 1; pDraw(); });
  document.getElementById('pExport').addEventListener('click', () => {
    downloadCsv('london-bus-tender-programme.csv', [
      ['programme_year','tranche','route','description','tender_issue_date','tender_return_date','award_estimated','contract_start','vehicle_type','two_year_extension','source_url'],
      ...pFiltered().map(e => [e.programmeYear ?? '', e.tranche ?? '', e.route, e.description ?? '', e.issueDate ?? '', e.returnDate ?? '', e.awardEstimated ?? '', e.contractStart ?? '', e.vehicleType ?? '', e.twoYearExtension == null ? '' : (e.twoYearExtension ? 'yes' : 'no'), e.sourceUrl ?? '']),
    ]);
  });
}

/* ════════════════════ CPI-CPA — ONS index + contract escalation ════════ */
/* CSV export: quote-escape every field, prefix formula-leading characters
   so a cell can never execute in Excel, CRLF rows, UTF-8 BOM for Excel. */
function downloadCsv(filename, rows){
  const cell = v => {
    let t = v == null ? '' : String(v);
    if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return '"' + t.replaceAll('"', '""') + '"';
  };
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel = ym => { const m = /^(\d{4})-(\d{2})$/.exec(ym ?? ''); return m ? `${MONTH_NAMES[+m[2]-1]} ${m[1]}` : ym; };
const pct2 = v => v == null ? '—' : (Number(v) * 100).toFixed(2) + '%';
async function renderCpi(){
  main.innerHTML = `<div class="wrap"><div class="skel" style="height:46px;width:50%"></div></div>`;
  const d = await D.cpi();
  if(!d?.months?.length){
    main.innerHTML = `<div class="wrap"><div class="empty">The CPI-CPA dataset is unreachable right now — try again shortly.</div></div>`;
    return;
  }
  const rows = [...d.months].reverse();   // newest first
  const latest = rows[0];
  const facts = [
    ['CPI index', latest.cpi, `${monthLabel(latest.month)} · 2015 = 100`],
    ['YoY inflation', pct2(latest.yoy), monthLabel(latest.month)],
    ['P2P rate', pct2(latest.p2p), '85% of YoY, 4-month lag'],
    ['Rolling average', pct2(latest.ra), '85% of 12-month avg YoY'],
  ];
  const tr = r => `<tr>
    <td style="font-weight:600">${esc(monthLabel(r.month))}</td>
    <td class="num">${esc(r.cpi)}</td>
    <td class="num" title="${esc(r.yoy ?? '')}">${pct2(r.yoy)}</td>
    <td class="num" title="${esc(r.p2p ?? '')}">${pct2(r.p2p)}</td>
    <td class="num" title="${esc(r.ra ?? '')}">${pct2(r.ra)}</td></tr>`;
  main.innerHTML = `<div class="wrap">
    <div id="dhead"><h1 style="margin:2px 0 4px">CPI-CPA</h1>
      <div style="color:var(--tx2);font-size:13.5px">ONS CPI All Items Index (D7BT, 2015 = 100) with the contract price adjustment rates derived from it. Rates apply <b>85% of CPI</b>: point-to-point (P2P) takes the year-on-year change from four months earlier; the rolling average (RA) averages the twelve monthly year-on-year changes ending at the previous month.</div>
      ${d.nextRelease ? `<div style="display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Next ONS release: ${esc(d.nextRelease)}</div>` : ''}</div>
    <div class="facts facts--wrap" style="margin-top:14px">${facts.map(([l,v,sub]) =>
      `<div class="fact"><div class="l">${l}</div><div class="v" title="${esc(sub)}">${esc(String(v))}</div><div style="font-size:10px;color:var(--mu);margin-top:2px">${esc(sub)}</div></div>`).join('')}</div>
    <div class="section"><div class="section-h" style="display:flex;align-items:center;gap:10px">Monthly series · since ${esc(monthLabel(d.months[0].month))}
      <a href="https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7bt/mm23" rel="noopener" target="_blank" style="margin-left:auto;font-size:12px;font-weight:600;color:var(--acc);text-transform:none;letter-spacing:0">ONS series ↗</a>
      <button class="livebtn" id="cpiExport" style="margin-left:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>Export CSV</button></div>
      <div class="card" style="overflow-x:auto"><table class="cpi-table">
        <thead><tr><th>Month</th><th class="num">CPI index</th><th class="num">YoY</th><th class="num">P2P (85%)</th><th class="num">Rolling avg (85%)</th></tr></thead>
        <tbody>${rows.map(tr).join('')}</tbody>
      </table></div>
      <div class="legendrow" style="margin-top:8px"><span>yoy[M] = (CPI[M] − CPI[M−12]) ÷ CPI[M−12] · P2P[M] = yoy[M−4] × 0.85 · RA[M] = avg(yoy[M−12] … yoy[M−1]) × 0.85. Values rounded half-up at 8 dp (hover a cell for full precision). YoY here is derived from the published 1-dp index — as the CPA calculation requires — so it can differ from ONS's headline 12-month rate (computed from unrounded indices) by up to 0.1 pp. Source: <a href="https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7bt/mm23" rel="noopener" target="_blank" style="color:var(--acc)">${esc(d.source ?? 'ONS')}</a>${d.releaseDate ? ` · released ${esc(fmtDate(d.releaseDate) ?? '')}` : ''}${d.nextRelease ? ` · next release ${esc(d.nextRelease)}` : ''}.</span></div>
    </div>
  </div>`;
  document.getElementById('cpiExport')?.addEventListener('click', () => {
    downloadCsv('cpi-cpa.csv', [
      ['month','cpi_index','yoy_change','p2p_rate','ra_rate'],
      ...d.months.map(r => [r.month, r.cpi, r.yoy ?? '', r.p2p ?? '', r.ra ?? '']),
    ]);
  });
}

        <p>An independent project, <b>not affiliated with Transport for London</b> or any bus operator. Not a journey planner — for travel advice use <a href="https://tfl.gov.uk" rel="noopener">tfl.gov.uk</a>.</p>

        <p>Built by <a href="https://farhan.app" rel="noopener">Farhan Munim</a>. Contributors: Daniel Plumb, Mark Leonard-Adoko, Ross Levine, Paul Tran, Andy Corbett. <a href="../">Classic map app ›</a></p>

    </div>

  document.getElementById('freshTable').innerHTML = rows.join('') || '<tr><td colspan="2" style="color:var(--mu)">Manifest unavailable.</td></tr>';
}

/* boot — desktops land on the Map (the map is the point of a big screen);
   small viewports land on Routes, where a full-bleed map would be cramped.
   Only a truly bare URL is redirected: an explicit #/ (Routes nav click,
   refresh after navigating) is respected. */
if(!location.hash && matchMedia('(min-width:760px)').matches){
  location.replace('#/map');   // the fragment change fires hashchange → navigate()
} else {
  navigate();
}
