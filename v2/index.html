<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>London Buses · v2</title>
<meta name="description" content="Search and explore every London bus route, operator and garage — live data from the Atlas API." />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ── Design tokens — minimal SaaS, light-only ──────────────────────────── */
:root{
  --bg:#fafaf9; --surf:#ffffff; --surf2:#f5f5f4;
  --bd:#e7e5e4; --bd2:#d6d3d1;
  --tx:#1c1917; --tx2:#57534e; --mu:#a8a29e;
  --acc:#dc2626; --acc-soft:#fef2f2;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --r:12px; --r-sm:8px;
  --sh:0 1px 2px rgba(28,25,23,.05);
  --maxw:1080px;
  --tab-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
svg{display:block}
::selection{background:#fecaca}

/* ── App shell ─────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-icon{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand small{font-weight:600;font-size:10px;color:#fff;background:var(--tx);border-radius:999px;padding:2px 7px;letter-spacing:.04em}
.nav-desktop{display:none;gap:2px;margin-left:14px}
.nav-desktop a{padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--tx2)}
.nav-desktop a:hover{background:var(--surf2);color:var(--tx)}
.nav-desktop a.on{background:var(--tx);color:#fff}
.topbar-spacer{flex:1}
.net-chip{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;background:var(--surf)}
.net-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.net-chip.bad .dot{background:var(--warn)}
@media(min-width:760px){.nav-desktop{display:flex}.net-chip{display:inline-flex}}

main{max-width:var(--maxw);margin:0 auto;padding:16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom))}
@media(min-width:760px){main{padding-bottom:56px}}

/* mobile bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);display:flex;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mu)}
.tabbar a.on{color:var(--acc)}
.tabbar svg{width:21px;height:21px}
@media(min-width:760px){.tabbar{display:none}}

/* ── Common components ─────────────────────────────────────────────────── */
.h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.sub{color:var(--tx2);font-size:13.5px;margin-bottom:14px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.section{margin-top:18px}
.section-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 2px 8px}
.searchwrap{position:sticky;top:53px;z-index:50;background:var(--bg);padding:2px 0 10px;margin:0 -2px;}
.search{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--bd2);border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh)}
.search:focus-within{border-color:var(--tx);box-shadow:0 0 0 3px rgba(28,25,23,.06)}
.search input{flex:1;border:none;outline:none;background:none;font-size:16px;min-width:0}
.search input::placeholder{color:var(--mu)}
.search svg{color:var(--mu);flex:none}
.search .clear{color:var(--mu);padding:2px;border-radius:6px}
.search .clear:hover{color:var(--tx)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--tx2);background:var(--surf);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;transition:all .12s}
.chip:hover{border-color:var(--bd2)}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.chip .x{opacity:.7;margin-left:4px}
.count-note{font-size:12.5px;color:var(--mu);margin:8px 2px 6px}
.empty{color:var(--mu);text-align:center;padding:44px 0;font-size:14px}
.skel{background:linear-gradient(90deg,var(--surf2) 25%,#eeedec 50%,var(--surf2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}

/* route list */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh);transition:border-color .12s}
.rrow:hover{border-color:var(--bd2)}
.rrow:active{background:var(--surf2)}
.rnum{flex:none;min-width:46px;height:32px;padding:0 8px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14.5px}
.rnum.night{background:#6d28d9}.rnum.school{background:#15803d}.rnum.twentyfour{background:#0e7490}
.rmeta{flex:1;min-width:0}
.rmeta .op{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.rmeta .ga{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--surf2);color:var(--tx2)}
.rtag.electric{background:#dcfce7;color:#15803d}.rtag.hydrogen{background:#cffafe;color:#0e7490}.rtag.hybrid{background:#e0e7ff;color:#4338ca}
.rrow .pvr{flex:none;text-align:right;font-size:12px;color:var(--mu);position:relative}
.rrow .pvr b{display:block;font-family:var(--mono);font-size:14px;color:var(--tx);font-weight:600}
.warn-dot{position:absolute;top:1px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media(min-width:760px){.rlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}}

/* detail pages */
.backrow{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:13.5px;font-weight:500;margin-bottom:10px;padding:4px 0}
.backrow:hover{color:var(--tx)}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.dnum{min-width:58px;height:42px;padding:0 10px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:20px}
.dnum.night{background:#6d28d9}.dnum.school{background:#15803d}.dnum.twentyfour{background:#0e7490}
.dtitle{min-width:0}
.dtitle h1{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.dtitle .sub2{font-size:13px;color:var(--tx2)}
.statusline{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;font-size:13px}
.statusline .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--good)}
.statusline.bad .dot{background:var(--warn)}
.statusline b{font-weight:600}
.statusline .reason{color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media(min-width:560px){.facts{grid-template-columns:repeat(6,1fr)}}
/* min-width:0 matters: grid items default to min-width:auto, so a long
   no-wrap value (vehicle spec strings) would force its column wider than
   the grid and break the page edge. The value scrolls inside the tile
   instead — swipe to read the tail. */
.fact{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-sm);padding:9px 10px;min-width:0}
.fact .l{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .v{font-family:var(--mono);font-weight:600;font-size:14.5px;margin-top:2px;white-space:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.fact .v::-webkit-scrollbar{display:none}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;border-top:1px solid var(--bd);font-size:13.5px}
.kv>div:first-child{border-top:none}
.kv .k{color:var(--tx2);flex:none}
.kv .v{text-align:right;font-weight:500;min-width:0}
.kv .v.mono{font-family:var(--mono);font-weight:600;font-size:13px}
#map{height:300px;border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;background:#eee9e2;position:relative;z-index:0}
@media(min-width:760px){#map{height:380px}}
.mapctl{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surf2);border-radius:9px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:600;color:var(--tx2);border-radius:7px;padding:5px 12px}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.livebtn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:6px 13px}
.livebtn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.livebtn .spin{width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
.livebtn.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.divn-note{display:flex;gap:9px;background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r);padding:11px 13px;font-size:13px;color:#92400e;margin-top:12px}
.divn-note b{font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px}
.bars>div{flex:1;background:#fca5a5;border-radius:3px 3px 0 0;min-height:3px;position:relative}
.bars>div.hi{background:var(--acc)}
.minibar{height:7px;border-radius:999px;background:var(--surf2);overflow:hidden}
.minibar>i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.legendrow{display:flex;gap:14px;font-size:11.5px;color:var(--mu);margin-top:6px;flex-wrap:wrap}
.legendrow i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* operators & garages */
.oplist{display:grid;gap:10px}
@media(min-width:560px){.oplist{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.oplist{grid-template-columns:repeat(3,1fr)}}
.opcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;transition:border-color .12s}
.opcard:hover{border-color:var(--bd2)}
.ophead{display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.03em;flex:none}
.ophead .nm{font-weight:700;font-size:14.5px}
.ophead .co{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.opstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opstat .l{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.opstat .v{font-family:var(--mono);font-weight:600;font-size:14px}
.glist{display:flex;flex-direction:column;gap:8px}
@media(min-width:760px){.glist{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.grow{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh)}
.grow:hover{border-color:var(--bd2)}
.grow .g-nm{flex:1;min-width:0}
.grow .g-nm b{font-size:14px;font-weight:600;display:block}
.grow .g-nm span{font-size:12px;color:var(--tx2)}
.grow .g-pvr{text-align:right;font-size:11.5px;color:var(--mu);flex:none}
.grow .g-pvr b{display:block;font-family:var(--mono);font-size:14px;color:var(--tx);font-weight:600}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.rchip{font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--bd);border-radius:7px;padding:4px 9px;background:var(--surf)}
.rchip:hover{border-color:var(--acc);color:var(--acc)}
.util{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--bd);font-size:13px}
.util .minibar{flex:1}

/* about */
.prose{font-size:13.5px;color:var(--tx2);line-height:1.6}
.prose p{margin-bottom:10px}
.prose b{color:var(--tx)}
.prose a{color:var(--acc);font-weight:500}
table.fresh{width:100%;border-collapse:collapse;font-size:12.5px}
table.fresh td{padding:7px 14px;border-top:1px solid var(--bd)}
table.fresh td:last-child{text-align:right;font-family:var(--mono);color:var(--tx2)}
.footer{margin-top:34px;text-align:center;font-size:11.5px;color:var(--mu);line-height:1.7}

/* UK-plate styling for vehicle registrations */
.plate{display:inline-block;font-family:var(--mono);font-weight:600;font-size:11.5px;letter-spacing:.06em;color:#111;background:#fc0;border:1.5px solid #1c1917;border-radius:5px;padding:1px 7px;line-height:1.5;white-space:nowrap}
a.plate:hover{background:#ffd83d}
/* long values (vehicle makes, company names) must not balloon a card —
   cap the cell and let it scroll inside */
.kv .v{max-height:76px;overflow-y:auto;overscroll-behavior:contain}
/* full-width message inside a card (empty states, loading) — wraps, never
   uses the k/v flex pair whose no-shrink key column overflows the card */
.kv-empty{padding:12px 14px;color:var(--mu);font-size:13px;line-height:1.5}
.livechip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--good)}
.livechip .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* tooltips — data source + refresh cadence on any label */
[data-tip]{text-decoration:underline dotted var(--bd2);text-underline-offset:3px;cursor:help}
.tipbox{position:fixed;z-index:90;max-width:280px;background:var(--tx);color:#fff;font-size:12px;line-height:1.5;border-radius:9px;padding:9px 12px;box-shadow:0 6px 22px rgba(28,25,23,.28);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s}
.tipbox.show{opacity:1;transform:none}
.tipbox .src{color:#d6d3d1}

/* ── Network map view ─────────────────────────────────────────────────── */
main.fullbleed{max-width:none;padding:0}
.netmap-wrap{position:relative;height:calc(100dvh - 53px - var(--tab-h) - env(safe-area-inset-bottom))}
@media(min-width:760px){.netmap-wrap{height:calc(100dvh - 53px)}}
#netmap{position:absolute;inset:0;background:#eee9e2;z-index:0}
.netmap-panel{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.netmap-panel>*{pointer-events:auto}
@media(min-width:760px){.netmap-panel{right:auto;width:320px;max-height:calc(100% - 24px)}}
.netmap-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid var(--bd2);border-radius:var(--r);padding:9px 13px;box-shadow:0 2px 12px rgba(28,25,23,.09)}
.netmap-search input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.netmap-search svg{color:var(--mu);flex:none}
.netmap-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.netmap-chips::-webkit-scrollbar{display:none}
@media(min-width:760px){.netmap-chips{flex-wrap:wrap;overflow:visible}}
.netmap-chips .chip{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);box-shadow:0 1px 6px rgba(28,25,23,.08)}
.netmap-chips .chip.on{background:var(--tx)}
.netmap-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.netmap-count{font-size:12px;font-weight:600;color:var(--tx2);background:rgba(255,255,255,.95);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;box-shadow:0 1px 6px rgba(28,25,23,.08)}
.netmap-card{background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;box-shadow:0 4px 18px rgba(28,25,23,.13)}
.netmap-card .close{float:right;color:var(--mu);padding:2px;border-radius:6px}
.netmap-card .close:hover{color:var(--tx)}
.netmap-search{flex-wrap:wrap}
.nm-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:600;font-size:12px;background:var(--pc);color:#fff;border-radius:7px;padding:3px 5px 3px 8px}
.nm-pill button{color:rgba(255,255,255,.85);display:grid;place-items:center;padding:2px;border-radius:4px}
.nm-pill button:hover{color:#fff;background:rgba(255,255,255,.18)}
.nm-badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;margin-left:5px}
.netmap-pop{background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:var(--r);padding:12px 13px;box-shadow:0 8px 28px rgba(28,25,23,.16);display:flex;flex-direction:column;gap:11px;max-height:46dvh;overflow-y:auto}
.nm-group-h{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.nm-group-chips{display:flex;flex-wrap:wrap;gap:6px}
.nm-cards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:38dvh}

/* leaflet touches */
.leaflet-container{font-family:var(--sans)}
.lb-bus{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 18px rgba(28,25,23,.18)}
.leaflet-popup-content{font-family:var(--sans);font-size:12.5px;margin:10px 13px}
.leaflet-popup-content b{font-size:13px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="7.5" width="17" height="15" rx="2.2"/><line x1="7.5" y1="14.5" x2="24.5" y2="14.5"/><circle cx="11" cy="19" r="1.2" fill="#fff"/><circle cx="21" cy="19" r="1.2" fill="#fff"/></svg>
      </span>
      London Buses <small>v2</small>
    </a>
    <nav class="nav-desktop" id="navDesktop">
      <a href="#/" data-nav="routes">Routes</a>
      <a href="#/map" data-nav="map">Map</a>
      <a href="#/stops" data-nav="stops">Stops</a>
      <a href="#/operators" data-nav="operators">Operators</a>
      <a href="#/garages" data-nav="garages">Garages</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="net-chip" id="netChip" hidden><span class="dot"></span><span id="netChipText"></span></div>
    <a href="#/about" data-nav="about" aria-label="About" style="display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--mu)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
    </a>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar" aria-label="Primary">
  <a href="#/" data-nav="routes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>Routes</a>
  <a href="#/map" data-nav="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</a>
  <a href="#/stops" data-nav="stops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>Stops</a>
  <a href="#/operators" data-nav="operators"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>Operators</a>
  <a href="#/garages" data-nav="garages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>Garages</a>
</nav>

<script type="module">
/* ════════════════════════════════════════════════════════════════════════
   London Buses v2 — single-file app, all data from the Atlas API.
   One file on purpose: the farhan.app zone edge-caches js/css for 4 h,
   which has repeatedly served mixed old/new module graphs mid-deploy.
   HTML is served max-age=0, so a single file can never version-skew.
   ════════════════════════════════════════════════════════════════════════ */

const API = 'https://atlas.farhan.app/api/v1';

/* ── Data layer — one cached promise per endpoint ─────────────────────── */
const _cache = new Map();
function get(path){
  if(_cache.has(path)) return _cache.get(path);
  const p = fetch(API + path).then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .catch(err => { console.warn('Atlas', path, err.message); _cache.delete(path); return null; });
  _cache.set(path, p);
  return p;
}
const D = {
  routes:      () => get('/routes'),
  meta:        () => get('/route-meta').then(d => d?.routes ?? {}),
  garages:     () => get('/garages').then(d => d?.garages ?? []),
  fleet:       () => get('/fleet').then(d => d?.byRoute ?? {}),
  perf:        () => get('/route-performance'),
  crowding:    () => get('/crowding'),
  crowdProf:   () => get('/crowding-profile').then(d => d?.routes ?? {}),
  tenders:     () => get('/tenders').then(d => d?.byRoute ?? {}),
  diversions:  () => get('/route-diversions').then(d => d?.routes ?? {}),
  lineStatus:  () => get('/line-status'),
  manifest:    () => get('/manifest'),
  stops:       () => get('/route-stops').then(d => d?.routes ?? {}),      // ~1 MB gz — lazy, route detail only
  overview:    () => get('/routes-overview'),                              // GeoJSON — lazy, map only
  vehiclesReg: () => get('/vehicles').then(d => d?.byReg ?? {}),
  liveStatus:  (r) => fetch(API + '/live/status?route=' + encodeURIComponent(r)) // never cached — re-polled
                        .then(x => x.ok ? x.json() : null).catch(() => null),
  perfHistory: (r) => get('/history/performance-history?route=' + encodeURIComponent(r) + '&limit=12'),
  liveVehicles:(r) => fetch(API + '/live/vehicles?line=' + encodeURIComponent(r)) // never cached — polled
                        .then(x => x.ok ? x.json() : null).catch(() => null),
  arrivals:    (s) => fetch(API + '/live/arrivals?stop=' + encodeURIComponent(s)) // never cached — polled
                        .then(x => x.ok ? x.json() : null).catch(() => null),
  sightings:   (r) => get('/history/vehicle-sightings?reg=' + encodeURIComponent(r) + '&limit=14'),
};
const plate = (reg, link=true) => reg
  ? (link ? `<a class="plate" href="#/vehicle/${encodeURIComponent(String(reg).toUpperCase())}">${esc(String(reg).toUpperCase())}</a>`
          : `<span class="plate">${esc(String(reg).toUpperCase())}</span>`)
  : '';

/* Stop registry — every unique stop across all routes, derived once from
   route-stops: id → { name, lat, lng, lines:Set }. */
let _stopRegP = null;
function stopRegistry(){
  return _stopRegP ??= D.stops().then(routes => {
    const reg = new Map();
    for(const [rid, rec] of Object.entries(routes ?? {})){
      for(const d of ['outbound','inbound']){
        for(const s of rec?.[d] ?? []){
          let e = reg.get(s.id);
          if(!e){ e = { id:s.id, name:s.name, lat:s.lat, lng:s.lng, lines:new Set() }; reg.set(s.id, e); }
          for(const l of s.lines ?? []) e.lines.add(l);
          e.lines.add(rid.toUpperCase());
        }
      }
    }
    return reg;
  });
}

/* ── Small utils ──────────────────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stripTags = s => String(s ?? '').replace(/<[^>]*>/g, ' ')
  .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"')
  .replace(/\s+/g,' ').trim();
const num = v => Number.isFinite(v) ? v : null;
const tvrOf = pvr => Number.isFinite(pvr) ? Math.floor(pvr * 1.13) : null;
const fmtDate = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d)
  ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : null; };
const monthYear = ym => { const m = /^(\d{4})-(\d{2})/.exec(ym ?? ''); return m ? `${m[2]}/${m[1]}` : null; };
const title = s => String(s ?? '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
const cmpRoute = (a,b) => { const na=parseInt(a,10), nb=parseInt(b,10);
  if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb; if(!isNaN(na)&&isNaN(nb)) return -1; if(isNaN(na)&&!isNaN(nb)) return 1;
  return String(a).localeCompare(String(b)); };

const TYPE_LABEL = { regular:'Day', night:'Night', twentyfour:'24-hour', school:'School' };
const PROPULSION = ['electric','hybrid','hydrogen','diesel'];
const OP_INITIALS = { 'Arriva':'ARL','Arriva London':'ARL','First':'FRG','First London':'FRG','Go-Ahead':'GAL','Go-Ahead London':'GAL','Metroline':'MLN','Stagecoach':'SCL','Stagecoach London':'SCL','Transport UK':'TUK','RATP':'RTP','RATP Dev':'RTP','Uno':'UNO','Uno Buses':'UNO','Falcon':'FAL','Falcon Buses':'FAL' };
const OP_COLORS   = { 'Arriva London':'#2563eb','Arriva':'#2563eb','First London':'#7c3aed','First':'#7c3aed','Go-Ahead London':'#dc2626','Go-Ahead':'#dc2626','Metroline':'#0891b2','Stagecoach London':'#1e3a8a','Stagecoach':'#1e3a8a','Transport UK':'#db2777','Uno':'#d97706','Uno Buses':'#d97706' };
const opInitials = n => OP_INITIALS[n] ?? String(n ?? '?').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
const opColor    = n => OP_COLORS[n] ?? '#57534e';

/* One garage pin for every map: operator initials over the garage code —
   "GAL / (Q)" — so both identities read at a glance. */
function garagePinIcon(g, size = 38){
  return L.divIcon({ className:'', iconSize:[size,size], iconAnchor:[size/2,size/2],
    html:`<div style="width:${size}px;height:${size}px;border-radius:10px;background:${opColor(g.operator)};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;font-family:var(--sans);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)">
      <span style="font-weight:800;font-size:${size>=38?'10.5':'9'}px;letter-spacing:.02em">${opInitials(g.operator)}</span>
      <span style="font-weight:600;font-size:8.5px;opacity:.85">(${esc(g.code)})</span></div>` });
}

/* TfL publishes several notices per line, sometimes another route's. Count
   only notices whose validity window covers now (isNow is unreliable), take
   the worst, and among equals prefer prose naming this route. */
function pickStatus(name, statuses){
  if(!statuses?.length) return null;
  const now = Date.now();
  const active = statuses.filter(ls => {
    if(ls.statusSeverity === 10) return true;
    const vps = ls.validityPeriods;
    if(!vps?.length) return true;
    return vps.some(vp => {
      const f = vp.fromDate ? Date.parse(vp.fromDate) : NaN, t = vp.toDate ? Date.parse(vp.toDate) : NaN;
      return (isNaN(f) || f <= now) && (isNaN(t) || t >= now);
    });
  });
  if(!active.length) return { status:'Good Service', reason:null, severity:10 };
  const mentions = ls => {
    const r = ls.reason ?? '';
    if(new RegExp('\\broutes?\\b[^.:]*\\b'+name+'\\b','i').test(r)) return 2;
    if(new RegExp('\\b'+name+'\\b','i').test(r)) return 1;
    return 0;
  };
  const pick = active.map((ls,i)=>({ls,i,sev:ls.statusSeverity ?? 10,m:mentions(ls)}))
    .sort((a,b)=>a.sev-b.sev || b.m-a.m || a.i-b.i)[0].ls;
  return { status:pick.statusSeverityDescription ?? null, reason:pick.reason ?? null, severity:pick.statusSeverity ?? null };
}

/* ── Tooltips — source + refresh cadence on every label ───────────────────
   One dictionary keyed by visible label text, applied automatically to any
   rendered view by a MutationObserver, shown on hover (desktop) or tap
   (touch). Wording follows the Atlas API reference (atlas.farhan.app/docs). */
const S = {
  LBR:     'londonbusroutes.net, via the Atlas API|Refreshed daily',
  TFL:     'TfL Unified API, via the Atlas API|Refreshed daily',
  QSI:     'TfL QSI reports, via the Atlas API|TfL publishes every ~4 weeks',
  MPS:     'TfL per-route MPS reports, via the Atlas API|TfL publishes every ~4 weeks',
  BUSTO:   'TfL BUSTO demand data, via the Atlas API|TfL publishes annually',
  FLEET:   'TfL arrivals sample + DVLA + bustimes.org, via the Atlas API|Sampled daily ~03:17 UTC',
  SIGHT:   'Vehicle-on-route observations, Atlas warehouse|Accrues daily',
  DIVN:    'TfL status diffed against the frozen route, via the Atlas API|Refreshed every ~4 h',
  TENDER:  'TfL tender award results, via the Atlas API|Checked daily, append-only',
  CURATED: 'Curated Atlas data — published for a few flagship routes only|Refreshed daily',
  LIVE:    'TfL live status, via the Atlas API|~30 s fresh',
  ARRIVE:  'TfL Countdown predictions, via the Atlas API|~30 s fresh',
  STOPS:   'TfL served-stop sequence (canonical), via the Atlas API|Refreshed daily',
  TVR:     'Derived: PVR × 1.13, rounded down|Follows PVR (daily)',
  CAPACITY:'Community reference, curated via the Atlas API|Updated as allocations change',
  DERIVED: 'Derived from Atlas route data|Refreshed daily',
  GPS:     'Live bus GPS (BODS SIRI-VM), via the Atlas API|~10 s fresh',
};
const LABEL_TIPS = {
  'PVR': ['Peak Vehicle Requirement — buses needed at peak', S.LBR],
  'TVR': ['Total Vehicle Requirement — PVR plus spares allowance', S.TVR],
  'Length': ['One-way route length', S.LBR],
  'Type': ['Day / night / 24-hour / school', S.TFL],
  'Power': ['Propulsion, reconciled against the DVLA-enriched live fleet', S.LBR],
  'Vehicle': ['Rostered vehicle spec', S.LBR],
  'Rostered vehicle': ['', S.LBR],
  'Excess wait time': ['How much longer passengers waited than scheduled — the headline reliability metric, shown against the contractual standard', S.QSI],
  'Average wait': ['Actual vs scheduled passenger wait', S.QSI],
  'On time': ['Departures on time (low-frequency routes), against the contractual standard', S.QSI],
  'Mileage operated': ['Scheduled mileage actually run in the latest TfL period, against the contractual minimum', S.MPS],
  'Peak load': ['Peak passengers ÷ capacity at the max-demand hour', S.BUSTO],
  'Busiest at': ['Stop, day and time of the peak load', S.BUSTO],
  'Weekday': ['Peak load ÷ capacity on weekdays', S.BUSTO],
  'Saturday': ['Peak load ÷ capacity on Saturdays', S.BUSTO],
  'Sunday': ['Peak load ÷ capacity on Sundays', S.BUSTO],
  'Observed in last sample': ['Distinct vehicles seen on the route in the last build — a point-in-time sample, not the full roster', S.FLEET],
  'Average age': ['Mean vehicle age across the observed sample', S.FLEET],
  'Makes': ['Chassis makers across the observed sample', S.FLEET],
  'Operator': ['Operating brand', S.LBR],
  'Company': ['Legal operating company', S.LBR],
  'Contract start': ['', S.CURATED],
  'Contract end': ['', S.CURATED],
  'Awarded on': ['Award date of this tender', S.TENDER],
  'Awarded to': ['Winning operator', S.TENDER],
  'Cost per mile': ['£ per live mile of the award', S.TENDER],
  'Accepted bid': ['Winning bid, £ per year', S.TENDER],
  'Bids received': ['How many operators bid', S.TENDER],
  'Joint bid': ['Whether tendered as part of a joint bid across routes', S.TENDER],
  'Awarded vehicle': ['Vehicle spec required by the award', S.TENDER],
  'Contracted miles': ['Annual live miles — accepted bid ÷ cost per mile', S.TENDER],
  'Tranche': ['LBSL tendering programme batch', S.TENDER],
  'Registrations': ['Vehicles observed on the route in the last sample — tap a plate for its record', S.FLEET],
  'Make': ['Chassis maker (DVLA)', S.FLEET],
  'Body': ['Full vehicle type — chassis + bodywork (bustimes.org)', S.FLEET],
  'Year': ['Year of manufacture (DVLA)', S.FLEET],
  'Deck': ['Single or double deck (bustimes.org)', S.FLEET],
  'Fleet code': ['Operator fleet number (bustimes.org)', S.FLEET],
  'Observed on': ['Routes this vehicle has been seen working', S.FLEET],
  'Recent sightings': ['', S.SIGHT],
  'Live location': ['Where this bus is right now, drawn against its route', S.GPS],
  'Capacity': ['Approximate bus capacity of the garage', S.CAPACITY],
  'Utilisation': ['PVR ÷ capacity', S.DERIVED],
  'Routes': ['Routes allocated', S.LBR],
  'Garages': ['Operating garages', S.LBR],
  'Zero-emission': ['Share of routes running electric or hydrogen', S.DERIVED],
  'Night routes': ['N-prefixed routes', S.TFL],
  'Postcode': ['Garage postcode', S.LBR],
  'Code': ['LBR garage code', S.LBR],
  'Next buses': ['Live arrival predictions at this stop', S.ARRIVE],
  'Routes serving this stop': ['', S.STOPS],
  'Live buses': ['Real-time bus positions', S.GPS],
  'Stops': ['Served stops in sequence', S.STOPS],
  'Good Service': ['Live service status', S.LIVE],
  'Reliability': ['TfL’s published Quality of Service Indicators', S.QSI],
  'Crowding': ['How full the route gets, from TfL’s BUSTO demand model', S.BUSTO],
  'Fleet': ['The vehicles observed running the route', S.FLEET],
  'Current contract': ['The route’s operating contract and most recent tender award', S.TENDER],
  'Previous award': ['The tender award before the current one', S.TENDER],
};
function applyTips(root){
  root.querySelectorAll('.fact .l, .kv .k, .opstat .l, .section-h, .statusline b').forEach(el => {
    if(el.dataset.tip !== undefined) return;
    const text = (el.textContent ?? '').trim();
    let hit = LABEL_TIPS[text];
    if(!hit){  // section headers carry a suffix, e.g. "Reliability · TfL QSI Q4 25/26"
      const pk = Object.keys(LABEL_TIPS).find(k => text.startsWith(k + ' ·'));
      if(pk) hit = LABEL_TIPS[pk];
    }
    if(!hit && el.matches('.statusline b')) hit = LABEL_TIPS['Good Service'];
    if(!hit) return;
    const [desc, sf] = hit;
    const [src, fresh] = sf.split('|');
    el.dataset.tip = `${desc ? desc + '\n' : ''}Source: ${src}\n${fresh}`;
  });
}
const tipbox = document.createElement('div');
tipbox.className = 'tipbox';
document.body.appendChild(tipbox);
let tipTarget = null;
function showTip(el){
  const raw = el.dataset.tip ?? '';
  const lines = raw.split('\n');
  tipbox.innerHTML = lines.map((l,i) => i === 0 && lines.length > 1 && !l.startsWith('Source:')
    ? `<div style="margin-bottom:3px">${esc(l)}</div>` : `<div class="src">${esc(l)}</div>`).join('');
  const r = el.getBoundingClientRect();
  tipbox.classList.add('show');
  const w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  let x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  let y = r.top - h - 8; if(y < 8) y = r.bottom + 8;
  tipbox.style.left = x + 'px'; tipbox.style.top = y + 'px';
  tipTarget = el;
}
function hideTip(){ tipbox.classList.remove('show'); tipTarget = null; }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if(t && t !== tipTarget) showTip(t); });
document.addEventListener('mouseout',  e => { if(e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tip]');
  if(t){ if(t.closest('a,button') === null){ e.preventDefault(); } tipTarget === t ? hideTip() : showTip(t); }
  else hideTip();
}, true);
window.addEventListener('scroll', hideTip, { passive:true });
new MutationObserver(() => applyTips(document.getElementById('main'))).observe(
  document.getElementById('main'), { childList:true, subtree:true });

/* ── Router ───────────────────────────────────────────────────────────── */
const main = document.getElementById('main');
const routesViewState = { q:'', type:null, op:null, prop:null };  // survives back-nav
let liveTimers = [];   // every polling surface registers here — all killed on nav
const addLiveTimer = t => { liveTimers.push(t); return t; };

function navigate(){
  for(const t of liveTimers) clearInterval(t);
  liveTimers = [];
  const h = location.hash.replace(/^#\/?/, '');
  const [seg, arg] = h.split('/').map(decodeURIComponent);
  const view = seg === '' ? 'routes' : seg;
  const navKey = view === 'route' ? 'routes' : view === 'garage' ? 'garages'
    : view === 'operator' ? 'operators' : view === 'stop' ? 'stops' : view === 'vehicle' ? 'routes' : view;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));
  window.scrollTo(0, 0);
  main.classList.toggle('fullbleed', view === 'map');
  if(view === 'routes')         renderRoutes();
  else if(view === 'map')       renderNetworkMap();
  else if(view === 'route')     renderRouteDetail(arg);
  else if(view === 'stops')     renderStops();
  else if(view === 'stop')      renderStopDetail(arg);
  else if(view === 'operators') renderOperators();
  else if(view === 'operator')  renderOperatorDetail(arg);
  else if(view === 'garages')   renderGarages();
  else if(view === 'garage')    renderGarageDetail(arg);
  else if(view === 'vehicle')   renderVehicleDetail(arg);
  else if(view === 'about')     renderAbout();
  else                          renderRoutes();
}
window.addEventListener('hashchange', navigate);

/* ── Network status chip (topbar, desktop) ────────────────────────────── */
D.lineStatus().then(ls => {
  const s = ls?.summary; if(!s) return;
  const chip = document.getElementById('netChip');
  document.getElementById('netChipText').textContent =
    s.disrupted ? `${s.good}/${s.total} on good service` : `All ${s.total} routes on good service`;
  chip.classList.toggle('bad', s.disrupted > 0);
  chip.hidden = false;
});

/* ════════════════════ ROUTES (home) ════════════════════ */
async function renderRoutes(){
  main.innerHTML = `
    <div class="searchwrap">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input id="q" placeholder="Search a route, e.g. 25 or N73" autocomplete="off" inputmode="search" value="${esc(routesViewState.q)}" />
        <button class="clear" id="qClear" aria-label="Clear search" ${routesViewState.q?'':'hidden'}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="count-note" id="countNote"></div>
    <div class="rlist" id="rlist">${'<div class="skel" style="height:56px"></div>'.repeat(8)}</div>`;

  const [routes, meta, lineStatus] = await Promise.all([D.routes(), D.meta(), D.lineStatus()]);
  if(!routes){ document.getElementById('rlist').innerHTML = '<div class="empty">The Atlas API is unreachable right now — try again shortly.</div>'; return; }
  const disrupted = new Set((lineStatus?.rows ?? []).filter(r => r.severity !== 10).map(r => r.route));

  const ops = [...new Set(Object.values(meta).map(m => m?.operator).filter(Boolean))].sort();

  function chipsHtml(){
    const st = routesViewState;
    const c = [];
    for(const [key,label] of Object.entries(TYPE_LABEL))
      c.push(`<button class="chip ${st.type===key?'on':''}" data-f="type" data-v="${key}">${label}</button>`);
    for(const p of PROPULSION)
      c.push(`<button class="chip ${st.prop===p?'on':''}" data-f="prop" data-v="${p}">${title(p)}</button>`);
    for(const o of ops)
      c.push(`<button class="chip ${st.op===o?'on':''}" data-f="op" data-v="${esc(o)}">${esc(o.replace(' London',''))}</button>`);
    return c.join('');
  }

  function rowsHtml(){
    const st = routesViewState;
    const q = st.q.trim().toUpperCase();
    let list = routes.filter(r => {
      const m = meta[r.name] ?? {};
      if(q && !r.name.toUpperCase().startsWith(q)) return false;
      if(st.type && r.type !== st.type) return false;
      if(st.op && m.operator !== st.op) return false;
      if(st.prop && m.propulsion !== st.prop) return false;
      return true;
    }).sort((a,b) => cmpRoute(a.name, b.name));
    document.getElementById('countNote').textContent =
      `${list.length} route${list.length===1?'':'s'}${q||st.type||st.op||st.prop ? ' match' : ''}`;
    if(!list.length) return '<div class="empty">No routes match.</div>';
    return list.map(r => {
      const m = meta[r.name] ?? {};
      const ga = [m.garageName, m.garage ? `(${m.garage})` : null].filter(Boolean).join(' ');
      return `<a class="rrow" href="#/route/${encodeURIComponent(r.name)}">
        <span class="rnum ${r.type}">${esc(r.name)}</span>
        <span class="rmeta">
          <span class="op">${esc(m.operator ?? '—')}
            ${m.propulsion ? `<span class="rtag ${m.propulsion}">${esc(m.propulsion)}</span>` : ''}
            ${r.type !== 'regular' ? `<span class="rtag">${TYPE_LABEL[r.type] ?? r.type}</span>` : ''}
          </span>
          <span class="ga">${esc(ga || '—')}</span>
        </span>
        <span class="pvr">${disrupted.has(r.name) ? '<span class="warn-dot" title="Disruption reported"></span>' : ''}<b>${m.pvr ?? '—'}</b>PVR</span>
      </a>`;
    }).join('');
  }

  const chips = document.getElementById('chips');
  const rlist = document.getElementById('rlist');
  const rerender = () => { rlist.innerHTML = rowsHtml(); };
  chips.innerHTML = chipsHtml();
  rerender();

  chips.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const f = b.dataset.f, v = b.dataset.v;
    routesViewState[f] = routesViewState[f] === v ? null : v;
    chips.innerHTML = chipsHtml();
    rerender();
  });
  const q = document.getElementById('q'), qClear = document.getElementById('qClear');
  q.addEventListener('input', () => {
    routesViewState.q = q.value;
    qClear.hidden = !q.value;
    rerender();
  });
  qClear.addEventListener('click', () => { q.value=''; routesViewState.q=''; qClear.hidden=true; rerender(); q.focus(); });
}

/* ════════════════════ ROUTE DETAIL ════════════════════ */
async function renderRouteDetail(name){
  const id = String(name ?? '').toUpperCase();
  main.innerHTML = `
    <a class="backrow" href="#/">‹ All routes</a>
    <div id="dhead"><div class="skel" style="height:46px;width:70%"></div></div>
    <div id="dstatus"></div>
    <div id="dfacts" class="facts">${'<div class="skel" style="height:52px"></div>'.repeat(6)}</div>
    <div class="section"><div class="section-h">Map</div><div id="map"></div>
      <div class="mapctl">
        <div class="seg" id="dirSeg"><button data-d="outbound" class="on">Outbound</button><button data-d="inbound">Inbound</button></div>
        <button class="livebtn" id="stopsBtn" style="margin-left:auto"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>Stops</button>
        <button class="livebtn" id="liveBtn" style="margin-left:0"><span class="spin"></span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="13" rx="2"/><line x1="5" y1="10" x2="19" y2="10"/><circle cx="9" cy="14" r=".8" fill="currentColor"/><circle cx="15" cy="14" r=".8" fill="currentColor"/></svg>Live buses</button>
        <span id="busLiveNote" style="display:none;align-items:center;gap:7px;font-size:12px;color:var(--mu)"><span class="livechip"><i class="pulse"></i>LIVE</span><span id="busLiveText"></span></span>
      </div>
      <div id="divnNote"></div>
    </div>
    <div id="dsections"></div>`;

  const [routes, meta] = await Promise.all([D.routes(), D.meta()]);
  const route = routes?.find(r => r.name.toUpperCase() === id);
  const m = meta?.[route?.name] ?? meta?.[id] ?? {};
  if(!route){ main.innerHTML = `<a class="backrow" href="#/">‹ All routes</a><div class="empty">Route “${esc(id)}” isn’t in the current TfL network.</div>`; return; }

  /* header */
  document.getElementById('dhead').outerHTML = `
    <div class="dhead">
      <span class="dnum ${route.type}">${esc(route.name)}</span>
      <div class="dtitle">
        <h1 id="dTermini">${esc(m.operator ?? 'London bus route')}</h1>
        <div class="sub2">${[
          TYPE_LABEL[route.type] ? esc(TYPE_LABEL[route.type]) : null,
          m.operator ? `<a href="#/operator/${encodeURIComponent(m.operator)}" style="color:var(--acc);font-weight:500">${esc(m.operator)}</a>` : null,
          m.garageName ? `<a href="#/garage/${encodeURIComponent(String(m.garage).split(/[^A-Za-z]/)[0])}" style="color:var(--acc);font-weight:500">${esc(m.garageName)} (${esc(m.garage)})</a>` : null,
        ].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;

  /* live status — seconds-fresh feed, snapshot fallback, silently
     re-polled every 60 s so the banner tracks reality while the page
     stays open */
  async function refreshStatus(){
    const raw = await D.liveStatus(route.name);
    const host = document.getElementById('dstatus');
    if(!host) return;   // navigated away
    let st = pickStatus(route.name, raw?.data?.[0]?.lineStatuses);
    if(!st){
      const snap = await D.lineStatus();
      const row = snap?.rows?.find(r => r.route === route.name);
      if(row) st = { status: row.status, reason: row.reason || null, severity: row.severity };
    }
    if(!st) return;
    const good = st.severity === 10;
    host.innerHTML = `
      <div class="statusline ${good?'':'bad'}"><span class="dot"></span>
        <div><b>${esc(st.status ?? (good?'Good Service':'Disruption'))}</b>
        ${st.reason && !good ? `<div class="reason">${esc(st.reason)}</div>` : ''}</div>
      </div>`;
  }
  refreshStatus();
  addLiveTimer(setInterval(refreshStatus, 60000));

  /* fact tiles */
  const facts = [];
  facts.push(['PVR', m.pvr ?? '—'], ['TVR', tvrOf(m.pvr) ?? '—']);
  if(num(m.lengthKm)) facts.push(['Length', m.lengthKm + ' km']);
  facts.push(['Type', TYPE_LABEL[route.type] ?? route.type]);
  if(m.propulsion) facts.push(['Power', title(m.propulsion)]);
  if(m.fleet) facts.push(['Vehicle', stripTags(m.fleet)]);
  document.getElementById('dfacts').innerHTML =
    facts.slice(0,6).map(([l,v]) => `<div class="fact"><div class="l">${l}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`).join('');

  /* diversion note */
  D.diversions().then(divs => {
    const dv = divs?.[route.name];
    if(!dv?.reasons?.length && !dv?.disruptions?.length) return;
    const reason = dv.disruptions?.[0]?.reason ?? '';
    const until = fmtDate(dv.until);
    document.getElementById('divnNote').innerHTML = `
      <div class="divn-note"><span aria-hidden="true">⚠️</span>
        <div><b>Diversion in effect${until ? ` until ${until}` : ''}.</b> ${esc(reason)}</div>
      </div>`;
  });

  /* the rest of the page */
  buildRouteSections(route, m);

  /* map — lazy heavy payloads */
  initRouteMap(route, m);

  /* termini in header once stops arrive */
  D.stops().then(stops => {
    const rec = stops?.[route.name.toLowerCase()] ?? stops?.[route.name];
    const out = rec?.outbound ?? [];
    if(out.length >= 2){
      // TfL stop names occasionally carry sort-hack prefixes (".Russell Square")
      const clean = n => String(n ?? '').replace(/^[.\s#>]+/, '');
      document.getElementById('dTermini').textContent = `${clean(out[0].name)} → ${clean(out[out.length-1].name)}`;
    }
  });
}

function sevClass(v, mps, lowerIsBetter){
  if(!Number.isFinite(v) || !Number.isFinite(mps) || mps <= 0) return '';
  const ok = lowerIsBetter ? v <= mps : v >= mps;
  return ok ? 'style="color:var(--good)"' : 'style="color:var(--bad)"';
}

async function buildRouteSections(route, m){
  const el = document.getElementById('dsections');
  const frag = [];

  /* Performance */
  const perf = (await D.perf())?.routes?.[route.name.toUpperCase()];
  if(perf?.serviceClass){
    const hf = perf.serviceClass === 'high-frequency';
    const rows = [];
    if(hf && num(perf.ewtMinutes) != null){
      rows.push(`<div><span class="k">Excess wait time</span><span class="v mono" ${sevClass(perf.ewtMinutes, perf.ewtMps, true)}>${perf.ewtMinutes.toFixed(1)} min${num(perf.ewtMps)?` · standard ≤ ${perf.ewtMps}`:''}</span></div>`);
      if(num(perf.awtMinutes) && num(perf.swtMinutes))
        rows.push(`<div><span class="k">Average wait</span><span class="v mono">${perf.awtMinutes.toFixed(1)} min · scheduled ${perf.swtMinutes.toFixed(1)}</span></div>`);
    }
    if(!hf && num(perf.onTimePercent) != null)
      rows.push(`<div><span class="k">On time</span><span class="v mono" ${sevClass(perf.onTimePercent, perf.otpMps, false)}>${perf.onTimePercent.toFixed(0)}%${num(perf.otpMps)?` · standard ≥ ${perf.otpMps}%`:''}</span></div>`);
    if(num(perf.mileagePercent) != null)
      rows.push(`<div><span class="k">Mileage operated</span><span class="v mono" ${sevClass(perf.mileagePercent, perf.mileageMps, false)}>${perf.mileagePercent.toFixed(1)}%${num(perf.mileageMps)?` · standard ≥ ${perf.mileageMps}%`:''}</span></div>`);
    if(rows.length){
      frag.push(`<div class="section"><div class="section-h">Reliability · TfL QSI ${esc((await D.perf())?.periodLabel ?? '')}</div>
        <div class="card"><div class="kv">${rows.join('')}</div><div id="perfTrend"></div></div></div>`);
    }
  }

  /* Crowding */
  const cr = await D.crowding();
  const crRec = cr?.routes?.[route.name];
  if(crRec && num(crRec.peakVC)){
    const bandLabel = cr.bands?.find(b => b.key === crRec.band)?.label ?? title(crRec.band ?? '');
    const days = ['Weekday','Saturday','Sunday'].map(d => {
      const v = crRec.byDay?.[d]?.vc;
      return num(v) ? `<div><span class="k">${d}</span><span class="v mono">${Math.round(v*100)}% of capacity</span></div>` : '';
    }).join('');
    frag.push(`<div class="section"><div class="section-h">Crowding · TfL BUSTO ${esc(cr.year ?? '')}</div>
      <div class="card"><div class="kv">
        <div><span class="k">Peak load</span><span class="v"><b>${esc(bandLabel)}</b> · <span class="mono">${Math.round(crRec.peakVC*100)}%</span> of capacity</span></div>
        ${crRec.stopname ? `<div><span class="k">Busiest at</span><span class="v">${esc(title(crRec.stopname))}${crRec.time?` · ${esc(String(crRec.time).slice(0,5))}`:''}</span></div>` : ''}
        ${days}
      </div><div id="crowdProf"></div></div></div>`);
  }

  /* Fleet */
  const fl = (await D.fleet())?.[route.name];
  if(fl && (fl.count > 0 || m.fleet)){
    const rows = [];
    if(m.fleet) rows.push(`<div><span class="k">Rostered vehicle</span><span class="v">${esc(stripTags(m.fleet))}</span></div>`);
    if(fl.count > 0) rows.push(`<div><span class="k">Observed in last sample</span><span class="v mono">${fl.count} vehicles</span></div>`);
    if(num(fl.avgAgeYears)) rows.push(`<div><span class="k">Average age</span><span class="v mono">${fl.avgAgeYears.toFixed(1)} years</span></div>`);
    if(fl.makes?.length) rows.push(`<div><span class="k">Makes</span><span class="v">${fl.makes.map(x=>`${esc(title(x.make))} (${x.n})`).join(', ')}</span></div>`);
    if(fl.regs?.length){
      const shown = fl.regs.slice(0, 24);
      rows.push(`<div><span class="k">Registrations</span><span class="v" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end">${shown.map(r => plate(r)).join('')}${fl.regs.length > shown.length ? `<span style="color:var(--mu);font-size:12px;align-self:center">+${fl.regs.length - shown.length} more</span>` : ''}</span></div>`);
    }
    if(rows.length) frag.push(`<div class="section"><div class="section-h">Fleet</div><div class="card"><div class="kv">${rows.join('')}</div></div></div>`);
  }

  /* Contract & tendering — latest and previous awards as individual lines */
  const tn = (await D.tenders())?.[route.name] ?? [];
  const latest = tn[0], prev = tn[1];
  const rows = [];
  if(m.operator)   rows.push(`<div><span class="k">Operator</span><span class="v"><a href="#/operator/${encodeURIComponent(m.operator)}" style="color:var(--acc);font-weight:500">${esc(m.operator)}</a></span></div>`);
  if(m.company)    rows.push(`<div><span class="k">Company</span><span class="v">${esc(stripTags(m.company))}</span></div>`);
  if(m.contractStart) rows.push(`<div><span class="k">Contract start</span><span class="v mono">${esc(monthYear(m.contractStart) ?? m.contractStart)}</span></div>`);
  if(m.contractEnd)   rows.push(`<div><span class="k">Contract end</span><span class="v mono">${esc(monthYear(m.contractEnd) ?? m.contractEnd)}</span></div>`);
  const awardRows = (a) => {
    const r = [];
    if(a.awardDate) r.push(`<div><span class="k">Awarded on</span><span class="v mono">${esc(fmtDate(a.awardDate) ?? a.awardDate)}</span></div>`);
    if(a.operator)  r.push(`<div><span class="k">Awarded to</span><span class="v">${esc(a.operator)}</span></div>`);
    if(num(a.costPerMile))  r.push(`<div><span class="k">Cost per mile</span><span class="v mono">£${a.costPerMile.toFixed(2)}</span></div>`);
    if(num(a.acceptedBid))  r.push(`<div><span class="k">Accepted bid</span><span class="v mono">£${a.acceptedBid.toLocaleString('en-GB')}/yr</span></div>`);
    if(num(a.acceptedBid) && num(a.costPerMile) && a.costPerMile > 0)
      r.push(`<div><span class="k">Contracted miles</span><span class="v mono">${Math.round(a.acceptedBid/a.costPerMile).toLocaleString('en-GB')} mi/yr</span></div>`);
    if(num(a.numberOfTenderers)) r.push(`<div><span class="k">Bids received</span><span class="v mono">${a.numberOfTenderers}</span></div>`);
    const jb = a.jb;
    r.push(`<div><span class="k">Joint bid</span><span class="v">${jb?.isJoint ? 'Yes' + (jb.partners?.length ? ' · with ' + jb.partners.map(esc).join(', ') : '') : 'No'}</span></div>`);
    const v = a.vehicle;
    if(v && (v.basis || v.propulsion || v.deck)){
      const bits = [v.basis, v.propulsion, v.deck ? v.deck + '-deck' : null, v.euro ? 'Euro ' + v.euro : null].filter(Boolean);
      r.push(`<div><span class="k">Awarded vehicle</span><span class="v">${esc(bits.join(' · '))}</span></div>`);
    }
    if(num(a.tranche)) r.push(`<div><span class="k">Tranche</span><span class="v mono">${a.tranche}</span></div>`);
    return r;
  };
  if(rows.length || latest){
    frag.push(`<div class="section"><div class="section-h">Current contract</div><div class="card"><div class="kv">${rows.join('')}${latest ? awardRows(latest).join('') : ''}</div></div></div>`);
  }
  if(prev){
    const opChanged = prev.operator && latest?.operator && prev.operator !== latest.operator;
    frag.push(`<div class="section"><div class="section-h">Previous award${opChanged ? ' · operator change' : ''}</div>
      <div class="card"><div class="kv">${awardRows(prev).join('')}</div></div></div>`);
  }

  el.innerHTML = frag.join('');

  /* performance trend (lazy, after paint) */
  if(document.getElementById('perfTrend')){
    D.perfHistory(route.name.toUpperCase()).then(h => {
      const rows = (h?.rows ?? []).filter(r => r.period_start).sort((a,b)=>String(a.period_start).localeCompare(String(b.period_start)));
      const hf = rows.some(r => num(r.ewt_minutes) != null);
      const vals = rows.map(r => hf ? num(r.ewt_minutes) : num(r.on_time_percent)).filter(v => v != null);
      if(vals.length < 3) return;
      const max = Math.max(...vals);
      const bars = rows.map(r => {
        const v = hf ? num(r.ewt_minutes) : num(r.on_time_percent);
        if(v == null) return '';
        const pc = Math.max(6, Math.round(v / max * 100));
        return `<div style="height:${pc}%" title="${esc(r.period_label)} · ${v}"></div>`;
      }).join('');
      document.getElementById('perfTrend').innerHTML =
        `<div style="padding:10px 14px;border-top:1px solid var(--bd)">
          <div class="bars">${bars}</div>
          <div class="legendrow"><span>${hf?'Excess wait time':'On-time %'} per TfL quarter, oldest → newest</span></div>
        </div>`;
    });
  }

  /* crowding profile (lazy) */
  if(document.getElementById('crowdProf')){
    D.crowdProf().then(cp => {
      const prof = cp?.[route.name]?.loadProfile;
      if(!prof || prof.length < 5) return;
      const bars = prof.map(p =>
        `<div class="${p.vc>=0.8?'hi':''}" style="height:${Math.max(4, Math.round(Math.min(p.vc,1.2)/1.2*100))}%" title="${esc(title(p.name))} · ${Math.round(p.vc*100)}%"></div>`).join('');
      document.getElementById('crowdProf').innerHTML =
        `<div style="padding:10px 14px;border-top:1px solid var(--bd)">
          <div class="bars">${bars}</div>
          <div class="legendrow"><span>Load along the route (peak direction)</span><span><i style="background:var(--acc)"></i>Crowded stop (≥80%)</span></div>
        </div>`;
    });
  }
}

/* ── Route map ────────────────────────────────────────────────────────── */
let _map = null;
async function initRouteMap(route, m = {}){
  const el = document.getElementById('map');
  if(_map){ _map.remove(); _map = null; }
  _map = L.map(el, { zoomControl:false, attributionControl:true, preferCanvas:true });
  L.control.attribution({ prefix:false }).addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © CARTO').addTo(_map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(_map);
  _map.setView([51.505,-0.118], 11);

  let dir = 'outbound';
  let lineLayer = null, stopsLayer = null, busLayer = null;
  let liveOn = false, stopsOn = false;

  const [ov, stops, garages] = await Promise.all([D.overview(), D.stops(), D.garages()]);
  if(location.hash !== `#/route/${encodeURIComponent(route.name)}` && !decodeURIComponent(location.hash).endsWith('/'+route.name)) return;

  const feats = (ov?.features ?? []).filter(f => (f.properties?.name ?? '').toUpperCase() === route.name.toUpperCase()
    || (f.properties?.routeId ?? '').toUpperCase() === route.name.toUpperCase());
  const stopRec = stops?.[route.name.toLowerCase()] ?? stops?.[route.name] ?? {};

  /* Operating garage pin(s) — same treatment as the garage view, linked
     through to the garage page. route-meta may list several codes. */
  const codes = String(m.garage ?? '').split(/[^A-Za-z]+/).filter(Boolean).map(c => c.toUpperCase());
  const garagePins = (garages ?? []).filter(g =>
    codes.includes(String(g.code).toUpperCase()) && Number.isFinite(g.lat) && Number.isFinite(g.lng));
  for(const g of garagePins){
    L.marker([g.lat, g.lng], { icon: garagePinIcon(g) })
      .bindPopup(`<b>${esc(g.name)} (${esc(g.code)})</b><br><span style="color:var(--tx2)">Operating garage</span><br><a href="#/garage/${encodeURIComponent(g.code)}" style="color:var(--acc);font-weight:600">Garage details ›</a>`)
      .addTo(_map);
  }

  function draw(){
    if(lineLayer){ _map.removeLayer(lineLayer); lineLayer = null; }
    if(stopsLayer){ _map.removeLayer(stopsLayer); stopsLayer = null; }
    const dnum = dir === 'outbound' ? '1' : '2';
    const dirFeats = feats.filter(f => String(f.properties?.direction) === dnum);
    const use = dirFeats.length ? dirFeats : feats;
    if(use.length){
      lineLayer = L.geoJSON({type:'FeatureCollection',features:use},
        { style:{ color:'#dc2626', weight:5, opacity:.95, lineCap:'round', lineJoin:'round' } }).addTo(_map);
      try{
        let b = lineLayer.getBounds();
        for(const g of garagePins) b = b.extend([g.lat, g.lng]);
        _map.fitBounds(b, { padding:[24,24] });
      }catch(e){}
    }
    stopsLayer = L.layerGroup();
    for(const s of (stopRec[dir] ?? [])){
      L.circleMarker([s.lat, s.lng], { radius:4.5, color:'#dc2626', weight:2, fillColor:'#fff', fillOpacity:1 })
        .bindPopup(`<b>${esc(s.name)}</b><br><a href="#/stop/${encodeURIComponent(s.id)}" style="color:var(--acc);font-weight:600">Live arrivals ›</a>`)
        .addTo(stopsLayer);
    }
    if(stopsOn) stopsLayer.addTo(_map);
  }
  draw();

  /* stops — toggle chip, same grammar as live buses */
  const stopsBtn = document.getElementById('stopsBtn');
  stopsBtn.addEventListener('click', () => {
    stopsOn = !stopsOn;
    stopsBtn.classList.toggle('on', stopsOn);
    if(!stopsLayer) return;
    if(stopsOn) stopsLayer.addTo(_map); else _map.removeLayer(stopsLayer);
  });

  document.getElementById('dirSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    dir = b.dataset.d;
    document.querySelectorAll('#dirSeg button').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });

  /* live buses — opt-in poll every 15 s */
  const liveBtn = document.getElementById('liveBtn');
  async function pollBuses(first){
    if(first) liveBtn.classList.add('loading');
    const [raw, reg] = await Promise.all([D.liveVehicles(route.name), D.vehiclesReg()]);
    liveBtn.classList.remove('loading');
    if(!liveOn) return;
    const rows = (raw?.data ?? []).filter(v => Number.isFinite(v.lat) && Number.isFinite(v.lng));
    if(busLayer){ _map.removeLayer(busLayer); busLayer = null; }
    busLayer = L.layerGroup();
    for(const v of rows){
      const col = String(v.direction) === '2' ? '#06b6d4' : '#f97316';
      const icon = L.divIcon({ className:'lb-bus', iconSize:[20,20], iconAnchor:[10,10],
        html: Number.isFinite(v.bearing)
          ? `<div style="transform:rotate(${v.bearing}deg)"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2 19 21 12 16 5 21Z" fill="${col}" stroke="#fff" stroke-width="1.6"/></svg></div>`
          : `<div style="width:12px;height:12px;margin:4px;border-radius:50%;background:${col};border:2px solid #fff"></div>` });
      const rec = v.reg ? reg?.[String(v.reg).toUpperCase()] : null;
      const bits = [rec?.make ? title(rec.make) : null, rec?.body ?? null, rec?.year ?? null, rec?.propulsion ? title(rec.propulsion) : null].filter(Boolean).join(' · ');
      L.marker([v.lat, v.lng], { icon })
        .bindPopup(`${v.reg ? plate(v.reg) : '<b>Bus</b>'}<br>${esc(v.destination ? 'to ' + title(v.destination) : '')}${bits?`<br><span style="color:var(--tx2)">${esc(bits)}</span>`:''}${v.reg?`<br><a href="#/vehicle/${encodeURIComponent(String(v.reg).toUpperCase())}" style="color:var(--acc);font-weight:600">Vehicle details ›</a>`:''}`)
        .addTo(busLayer);
    }
    busLayer.addTo(_map);
    if(first && !rows.length){
      liveBtn.insertAdjacentHTML('afterend', `<span id="noBuses" style="font-size:12px;color:var(--mu);align-self:center;margin-left:8px">No buses tracked right now</span>`);
      setTimeout(() => document.getElementById('noBuses')?.remove(), 4000);
    }
  }
  /* live-surface pattern: 1 s ticker shows 'next update in N s' and fires
     the 15 s re-poll — registered once, gated by the toggle */
  let busNextIn = 0, busTickerOn = false;
  const busNote = document.getElementById('busLiveNote'), busText = document.getElementById('busLiveText');
  liveBtn.addEventListener('click', () => {
    liveOn = !liveOn;
    liveBtn.classList.toggle('on', liveOn);
    if(busNote) busNote.style.display = liveOn ? 'inline-flex' : 'none';
    if(liveOn){
      pollBuses(true); busNextIn = 15;
      if(!busTickerOn){
        busTickerOn = true;
        addLiveTimer(setInterval(() => {
          if(!liveOn || !document.getElementById('map')) return;
          busNextIn -= 1;
          if(busText) busText.textContent = busNextIn > 0 ? `next update in ${busNextIn} s` : 'updating…';
          if(busNextIn <= 0){ busNextIn = 15; pollBuses(false); }
        }, 1000));
      }
    } else if(busLayer){ _map.removeLayer(busLayer); busLayer = null; }
  });
}

/* ════════════════════ NETWORK MAP ════════════════════ */
const netmapState = {
  pills: [],                                   // focused routes, in selection order
  f: { type:new Set(), prop:new Set(), op:new Set() },   // multi-select filters
  colorBy: 'operator', garages: false, panelOpen: false,
};
const FOCUS_COLORS = ['#2563eb','#c2410c','#199e70','#7c3aed','#a16207','#db2777','#15803d','#86198f'];
async function renderNetworkMap(){
  main.innerHTML = `
    <div class="netmap-wrap">
      <div id="netmap"></div>
      <div class="netmap-panel">
        <div class="netmap-search" id="nmSearch">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
          <span id="nmPills" style="display:contents"></span>
          <input id="nmq" placeholder="Add routes to compare…" autocomplete="off" />
          <button class="clear" id="nmqClear" aria-label="Clear all focused routes" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="netmap-foot">
          <button class="livebtn" id="nmFilters" style="margin:0">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filters<span id="nmFBadge" class="nm-badge" hidden></span>
          </button>
          <div class="seg" style="box-shadow:0 1px 6px rgba(28,25,23,.08)">
            <button data-cb="operator" class="${netmapState.colorBy==='operator'?'on':''}">Operator</button>
            <button data-cb="type" class="${netmapState.colorBy==='type'?'on':''}">Type</button>
          </div>
          <button class="livebtn ${netmapState.garages?'on':''}" id="nmGarages" style="margin:0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10 12 4l9 6"/><path d="M5 9v11h14V9"/></svg>Garages</button>
        </div>
        <div class="netmap-pop" id="nmPop" hidden></div>
        <div class="netmap-foot"><span class="netmap-count" id="nmCount">Loading network…</span><button class="livebtn" id="nmReset" style="margin:0" hidden>Reset all</button></div>
        <div id="nmInfo" class="nm-cards"></div>
      </div>
    </div>`;

  const [ov, meta, routes, garages] = await Promise.all([D.overview(), D.meta(), D.routes(), D.garages()]);
  if(!document.getElementById('netmap')) return;
  if(!ov?.features?.length){ document.getElementById('nmCount').textContent = 'The Atlas API is unreachable right now.'; return; }

  if(_map){ _map.remove(); _map = null; }
  _map = L.map(document.getElementById('netmap'), { zoomControl:false, preferCanvas:true, attributionControl:true });
  L.control.attribution({ prefix:false }).addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © CARTO · Powered by TfL Open Data').addTo(_map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(_map);
  _map.setView([51.505,-0.118], 11);

  const st = netmapState;
  const typeInfo = new Map(routes.map(r => [r.name.toUpperCase(), r.type]));
  const TYPE_COLORS = { regular:'#dc2626', night:'#6d28d9', twentyfour:'#0e7490', school:'#15803d' };
  const focusColor = name => FOCUS_COLORS[st.pills.indexOf(name) % FOCUS_COLORS.length];

  const passes = (name) => {
    const m = meta?.[name] ?? {};
    if(st.f.type.size && !st.f.type.has(typeInfo.get(name.toUpperCase()))) return false;
    if(st.f.op.size   && !st.f.op.has(m.operator)) return false;
    if(st.f.prop.size && !st.f.prop.has(m.propulsion)) return false;
    return true;
  };
  const styleFor = (f) => {
    const name = f.properties?.name ?? '';
    const up = name.toUpperCase();
    if(st.pills.length){
      return st.pills.includes(up)
        ? { color: focusColor(up), opacity: 1, weight: 5 }
        : { color: '#a8a29e', opacity: passes(name) ? .08 : 0, weight: 1.5 };
    }
    if(!passes(name)) return { opacity: 0, weight: 0 };
    const base = st.colorBy === 'type'
      ? (TYPE_COLORS[typeInfo.get(up)] ?? '#dc2626')
      : opColor(meta?.[name]?.operator);
    return { color: base, opacity: .75, weight: 2 };
  };

  const layer = L.geoJSON(ov, {
    style: styleFor,
    onEachFeature: (f, ly) => {
      const name = f.properties?.name ?? '';
      ly.bindTooltip(`Route ${name}`, { sticky:true, direction:'top' });
      ly.on('click', () => {
        const up = name.toUpperCase();
        if(st.pills.includes(up)) removeFocus(up);
        else if(passes(name)) addFocus(up);
      });
    },
  }).addTo(_map);

  let garageLayer = null;
  function syncGarages(){
    if(st.garages && !garageLayer){
      garageLayer = L.layerGroup();
      for(const g of garages ?? []){
        if(!Number.isFinite(g.lat) || !Number.isFinite(g.lng)) continue;
        L.marker([g.lat, g.lng], { icon: garagePinIcon(g, 34) })
          .bindPopup(`<b>${esc(g.name)} (${esc(g.code)})</b><br>${esc(g.operator ?? '')}<br><a href="#/garage/${encodeURIComponent(g.code)}" style="color:var(--acc);font-weight:600">Garage details ›</a>`)
          .addTo(garageLayer);
      }
      garageLayer.addTo(_map);
    } else if(!st.garages && garageLayer){
      _map.removeLayer(garageLayer); garageLayer = null;
    }
  }
  syncGarages();

  /* ── filter popover — grouped, multi-select, with its own clear ── */
  const ops = [...new Set(Object.values(meta ?? {}).map(m => m?.operator).filter(Boolean))].sort();
  const GROUPS = [
    ['type', 'Route type', Object.entries(TYPE_LABEL).map(([v,l]) => [v,l])],
    ['prop', 'Power', PROPULSION.map(p => [p, title(p)])],
    ['op', 'Operator', ops.map(o => [o, o.replace(' London','')])],
  ];
  function popHtml(){
    return GROUPS.map(([key, label, opts]) => `
      <div class="nm-group"><div class="nm-group-h">${label}</div>
        <div class="nm-group-chips">${opts.map(([v,l]) =>
          `<button class="chip ${st.f[key].has(v)?'on':''}" data-f="${key}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>
      </div>`).join('') +
      `<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:2px">
        <button class="livebtn" id="nmFClear" style="margin:0">Clear filters</button>
        <button class="livebtn on" id="nmFDone" style="margin:0">Done</button>
      </div>`;
  }
  const pop = document.getElementById('nmPop');
  function syncPop(){
    pop.hidden = !st.panelOpen;
    if(st.panelOpen) pop.innerHTML = popHtml();
    const n = st.f.type.size + st.f.prop.size + st.f.op.size;
    const badge = document.getElementById('nmFBadge');
    if(badge){ badge.hidden = !n; badge.textContent = n; }
    document.getElementById('nmFilters')?.classList.toggle('on', st.panelOpen || n > 0);
  }

  function repaint(){
    layer.setStyle(styleFor);
    let shown = 0;
    for(const name of new Set((ov.features ?? []).map(f => f.properties?.name).filter(Boolean))) if(passes(name)) shown++;
    const cEl = document.getElementById('nmCount');
    if(cEl) cEl.textContent = st.pills.length
      ? `${st.pills.length} route${st.pills.length===1?'':'s'} focused · ${shown} shown`
      : `${shown} routes shown`;
    const anything = st.pills.length || st.f.type.size || st.f.prop.size || st.f.op.size;
    const reset = document.getElementById('nmReset');
    if(reset) reset.hidden = !anything;
    const qc = document.getElementById('nmqClear');
    if(qc) qc.hidden = !st.pills.length;
  }

  /* ── multi-focus: pills in the search box + a card per route ── */
  function pillsHtml(){
    return st.pills.map(p => `<span class="nm-pill" style="--pc:${focusColor(p)}">${esc(p)}
      <button data-rm="${esc(p)}" aria-label="Remove ${esc(p)}"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>`).join('');
  }
  function cardsHtml(){
    return st.pills.map(p => {
      const m = meta?.[p] ?? {};
      const t = typeInfo.get(p);
      return `<div class="netmap-card" style="border-left:4px solid ${focusColor(p)}">
        <button class="close" data-rm="${esc(p)}" aria-label="Remove ${esc(p)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div style="display:flex;align-items:center;gap:9px">
          <span class="rnum ${t}" style="min-width:40px;height:27px;font-size:13px">${esc(p)}</span>
          <div style="min-width:0;font-size:12px;color:var(--tx2)">
            <b style="color:var(--tx);font-size:12.5px">${esc(m.operator ?? '')}</b><br>
            ${[TYPE_LABEL[t], m.garageName ? `${m.garageName} (${m.garage})` : null, num(m.pvr) ? `PVR ${m.pvr}` : null].filter(Boolean).map(esc).join(' · ')}
          </div>
        </div>
        <a href="#/route/${encodeURIComponent(p)}" style="display:inline-block;margin-top:7px;color:var(--acc);font-weight:600;font-size:12.5px">Open route page ›</a>
      </div>`;
    }).join('');
  }
  function syncFocus(fit){
    document.getElementById('nmPills').innerHTML = pillsHtml();
    document.getElementById('nmInfo').innerHTML = cardsHtml();
    repaint();
    if(fit && st.pills.length){
      const feats = ov.features.filter(f => st.pills.includes((f.properties?.name ?? '').toUpperCase()));
      if(feats.length){
        try{ _map.fitBounds(L.geoJSON({type:'FeatureCollection',features:feats}).getBounds(), { padding:[40,40] }); }catch(e){}
      }
    }
  }
  function addFocus(name){ if(!st.pills.includes(name)){ st.pills.push(name); syncFocus(true); } }
  function removeFocus(name){ st.pills = st.pills.filter(p => p !== name); syncFocus(st.pills.length > 0); }

  syncPop();
  syncFocus(st.pills.length > 0);

  /* ── wiring ── */
  document.getElementById('nmFilters').addEventListener('click', () => { st.panelOpen = !st.panelOpen; syncPop(); });
  pop.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if(chip){
      const set = st.f[chip.dataset.f];
      set.has(chip.dataset.v) ? set.delete(chip.dataset.v) : set.add(chip.dataset.v);
      syncPop(); repaint();
      return;
    }
    if(e.target.closest('#nmFClear')){ st.f.type.clear(); st.f.prop.clear(); st.f.op.clear(); syncPop(); repaint(); }
    if(e.target.closest('#nmFDone')){ st.panelOpen = false; syncPop(); }
  });
  document.querySelector('.netmap-foot .seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-cb]'); if(!b) return;
    st.colorBy = b.dataset.cb;
    document.querySelectorAll('.netmap-foot .seg button').forEach(x => x.classList.toggle('on', x === b));
    repaint();
  });
  document.getElementById('nmGarages').addEventListener('click', e => {
    st.garages = !st.garages;
    e.currentTarget.classList.toggle('on', st.garages);
    syncGarages();
  });
  document.getElementById('nmReset').addEventListener('click', () => {
    st.pills = []; st.f.type.clear(); st.f.prop.clear(); st.f.op.clear();
    syncPop(); syncFocus(false);
    _map.setView([51.505,-0.118], 11);
  });
  const nmq = document.getElementById('nmq');
  const names = new Set(routes.map(r => r.name.toUpperCase()));
  nmq.addEventListener('input', () => {
    const v = nmq.value.trim().toUpperCase();
    if(names.has(v)){ addFocus(v); nmq.value = ''; }
  });
  nmq.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const v = nmq.value.trim().toUpperCase();
      if(names.has(v)){ addFocus(v); nmq.value = ''; }
    }
    if(e.key === 'Backspace' && !nmq.value && st.pills.length) removeFocus(st.pills[st.pills.length-1]);
  });
  document.getElementById('nmqClear').addEventListener('click', () => { st.pills = []; syncFocus(false); nmq.focus(); });
  /* one delegated remove handler for pills + cards */
  document.querySelector('.netmap-panel').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if(rm) removeFocus(rm.dataset.rm);
  });
}

async function renderOperators(){
  main.innerHTML = `<h1 class="h1">Operators</h1><div class="sub">Who runs London’s buses — routes, fleet size and electrification.</div>
    <div class="oplist" id="oplist">${'<div class="skel" style="height:120px"></div>'.repeat(6)}</div>`;
  const [meta, garages] = await Promise.all([D.meta(), D.garages()]);
  const agg = new Map();
  for(const [name, m] of Object.entries(meta ?? {})){
    if(!m?.operator) continue;
    const a = agg.get(m.operator) ?? { routes:0, pvr:0, ev:0, evKnown:0, company:m.company };
    a.routes++;
    if(num(m.pvr)) a.pvr += m.pvr;
    if(m.propulsion){ a.evKnown++; if(m.propulsion==='electric'||m.propulsion==='hydrogen') a.ev++; }
    agg.set(m.operator, a);
  }
  const gCount = new Map();
  for(const g of garages ?? []) if(g.operator) gCount.set(g.operator, (gCount.get(g.operator) ?? 0) + 1);
  const list = [...agg.entries()].sort((a,b) => b[1].routes - a[1].routes);
  document.getElementById('oplist').innerHTML = list.map(([op,a]) => {
    const evPct = a.evKnown ? Math.round(a.ev / a.evKnown * 100) : null;
    return `<a class="opcard" href="#/operator/${encodeURIComponent(op)}">
      <div class="ophead">
        <span class="avatar" style="background:${opColor(op)}">${opInitials(op)}</span>
        <div><div class="nm">${esc(op)}</div><div class="co">${esc(stripTags(a.company ?? ''))}</div></div>
      </div>
      <div class="opstats">
        <div class="opstat"><div class="l">Routes</div><div class="v">${a.routes}</div></div>
        <div class="opstat"><div class="l">PVR</div><div class="v">${a.pvr || '—'}</div></div>
        <div class="opstat"><div class="l">Garages</div><div class="v">${gCount.get(op) ?? '—'}</div></div>
      </div>
      ${evPct != null ? `<div><div class="minibar"><i style="width:${evPct}%;background:var(--good)"></i></div>
        <div class="legendrow"><span>${evPct}% zero-emission routes</span></div></div>` : ''}
    </a>`;
  }).join('');
}

async function renderOperatorDetail(op){
