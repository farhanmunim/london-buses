    </div>
    <div class="facts" style="margin-top:14px">
      <div class="fact"><div class="l">Routes</div><div class="v">${myRoutes.length}</div></div>
      <div class="fact"><div class="l">PVR</div><div class="v">${pvr || '—'}</div></div>
      <div class="fact"><div class="l">TVR</div><div class="v">${tvrOf(pvr) ?? '—'}</div></div>
      <div class="fact"><div class="l">Garages</div><div class="v">${myGarages.length}</div></div>
      <div class="fact"><div class="l">Zero-emission</div><div class="v">${known ? Math.round(ev/known*100)+'%' : '—'}</div></div>
      <div class="fact"><div class="l">Night routes</div><div class="v">${myRoutes.filter(r=>r.type==='night').length}</div></div>
    </div>
    <div class="section"><div class="section-h">Garages</div>
      <div class="glist">${myGarages.map(g => `
        <a class="grow" href="#/garage/${encodeURIComponent(g.code)}">
          <span class="avatar" style="background:${opColor(op)}">${esc(g.code)}</span>
          <span class="g-nm"><b>${esc(g.name)}</b><span>${g.routes?.length ?? 0} routes${num(g.capacity)?` · capacity ${g.capacity}`:''}</span></span>
          <span class="g-pvr"><b>${g.pvr ?? '—'}</b>PVR</span>
        </a>`).join('') || '<div class="empty">No garages listed.</div>'}
      </div>
    </div>
    <div class="section"><div class="section-h">Routes</div>
      <div class="card"><div class="chiprow">${myRoutes.map(r => `<a class="rchip" href="#/route/${encodeURIComponent(r.name)}">${esc(r.name)}</a>`).join('')}</div></div>
    </div>`;

const garagesViewState = { q:'' };
async function renderGarages(){
  main.innerHTML = `
    <h1 class="h1">Garages</h1><div class="sub">Every operating garage on the TfL network.</div>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>

    </div></div>
    <div class="count-note" id="gCount"></div>
    <div class="glist" id="glist">${'<div class="skel" style="height:56px"></div>'.repeat(8)}</div>`;

  if(!garages?.length){ document.getElementById('glist').innerHTML = '<div class="empty">The Atlas API is unreachable right now.</div>'; return; }
  const rerender = () => {
    const q = garagesViewState.q.trim().toLowerCase();
    const list = garages.filter(g => !q || g.name?.toLowerCase().includes(q) || g.code?.toLowerCase() === q)
      .sort((a,b) => String(a.name).localeCompare(String(b.name)));
    document.getElementById('gCount').textContent = `${list.length} garage${list.length===1?'':'s'}`;
    document.getElementById('glist').innerHTML = list.map(g => `
      <a class="grow" href="#/garage/${encodeURIComponent(g.code)}">
        <span class="avatar" style="background:${opColor(g.operator)}">${opInitials(g.operator)}</span>
        <span class="g-nm"><b>${esc(g.name)} <span style="color:var(--mu);font-weight:500">(${esc(g.code)})</span></b>
        <span>${esc(g.operator ?? '—')} · ${g.routes?.length ?? 0} routes</span></span>
        <span class="g-pvr"><b>${g.pvr ?? '—'}</b>PVR</span>
      </a>`).join('') || '<div class="empty">No garages match.</div>';
  };
  rerender();
  const gq = document.getElementById('gq'), gqClear = document.getElementById('gqClear');
  gq.addEventListener('input', () => { garagesViewState.q = gq.value; gqClear.hidden = !gq.value; rerender(); });
  gqClear.addEventListener('click', () => { gq.value=''; garagesViewState.q=''; gqClear.hidden=true; rerender(); gq.focus(); });
}

/* Garage map — the garage pin plus every route based there, each line in its
   own colour (the validated comparison palette), tappable through to the
   route page. */
const GARAGE_MAP_COLORS = ['#2563eb','#c2410c','#199e70','#7c3aed','#a16207','#db2777','#15803d','#86198f'];
async function initGarageMap(g){
  const el = document.getElementById('map');
  if(!el) return;
  if(_map){ _map.remove(); _map = null; }
  _map = L.map(el, { zoomControl:false, preferCanvas:true, attributionControl:true });
  L.control.attribution({ prefix:false }).addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © CARTO').addTo(_map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(_map);
  const ov = await D.overview();
  if(!document.getElementById('map')) return; // navigated away mid-load
  const mine = new Map();
  (g.routes ?? []).forEach((r,i) => mine.set(String(r).toUpperCase(), GARAGE_MAP_COLORS[i % GARAGE_MAP_COLORS.length]));
  const feats = (ov?.features ?? []).filter(f => mine.has((f.properties?.name ?? '').toUpperCase()));
  const group = L.featureGroup();
  for(const f of feats){
    const name = f.properties.name.toUpperCase();
    L.geoJSON(f, { style:{ color: mine.get(name), weight:3.5, opacity:.9, lineCap:'round', lineJoin:'round' } })
      .bindPopup(`<b>Route ${esc(name)}</b><br><a href="#/route/${encodeURIComponent(name)}" style="color:var(--acc);font-weight:600">Open route ›</a>`)
      .addTo(group);
  }
  group.addTo(_map);
  if(Number.isFinite(g.lat) && Number.isFinite(g.lng)){
    L.marker([g.lat, g.lng], { icon: garagePinIcon(g) })
      .bindPopup(`<b>${esc(g.name)} (${esc(g.code)})</b>`)
      .addTo(_map);
  }
  try{ _map.fitBounds(group.getBounds().pad(0.06)); }
  catch(e){ if(Number.isFinite(g.lat)) _map.setView([g.lat,g.lng],12); else _map.setView([51.505,-0.118],11); }
}

/* ════════════════════ STOPS — search + live arrivals ════════════════════ */
const stopsViewState = { q:'' };
const haversineM = (aLat,aLng,bLat,bLng) => {
  const D = Math.PI/180, R = 6371e3;
  const x = Math.sin((bLat-aLat)*D/2)**2 + Math.cos(aLat*D)*Math.cos(bLat*D)*Math.sin((bLng-aLng)*D/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
};
const fmtDist = m => m < 950 ? `${Math.round(m/10)*10} m` : `${(m/1000).toFixed(1)} km`;

async function renderStops(){
  main.innerHTML = `
    <h1 class="h1">Bus stops</h1><div class="sub">Find any stop and see live arrival times, straight from TfL Countdown.</div>
    <div class="searchwrap">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input id="sq" placeholder="Search a stop, e.g. Angel Station" autocomplete="off" value="${esc(stopsViewState.q)}" />
        <button class="clear" id="sqClear" aria-label="Clear search" ${stopsViewState.q?'':'hidden'}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="livebtn" id="nearBtn" style="margin:0;flex:none"><span class="spin"></span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Near me</button>
      </div>
    </div>
    <div class="count-note" id="sCount"></div>
    <div class="glist" id="slist"><div class="empty" id="sHint">Loading the stop directory…</div></div>`;
  const reg = await stopRegistry();
  if(!reg?.size){ const l=document.getElementById('slist'); if(l) l.innerHTML = '<div class="empty">The Atlas API is unreachable right now.</div>'; return; }
  const all = [...reg.values()];

  const rowHtml = (s, dist) => `
    <a class="grow" href="#/stop/${encodeURIComponent(s.id)}">
      <span class="avatar" style="background:var(--acc);border-radius:50%;width:32px;height:32px;font-size:10px">${esc([...s.lines].length)}</span>
      <span class="g-nm"><b>${esc(s.name)}</b><span>${[...s.lines].sort(cmpRoute).slice(0,8).join(' · ')}${s.lines.size>8?' …':''}</span></span>
      ${dist != null ? `<span class="g-pvr"><b style="font-size:12.5px">${fmtDist(dist)}</b>away</span>` : ''}
    </a>`;

  const rerender = () => {
    const q = stopsViewState.q.trim().toLowerCase();
    const cEl = document.getElementById('sCount'), lEl = document.getElementById('slist');
    if(!cEl || !lEl) return;
    if(q.length < 2){
      cEl.textContent = `${all.length.toLocaleString('en-GB')} stops on the network`;
      lEl.innerHTML = '<div class="empty">Type at least two characters, or use “Near me”.</div>';
      return;
    }
    const list = all.filter(s => s.name?.toLowerCase().includes(q)).slice(0, 60);
    cEl.textContent = `${list.length}${list.length===60?'+':''} stop${list.length===1?'':'s'} match`;
    lEl.innerHTML = list.map(s => rowHtml(s)).join('') || '<div class="empty">No stops match.</div>';
  };
  rerender();
  const sq = document.getElementById('sq'), sqClear = document.getElementById('sqClear');
  sq.addEventListener('input', () => { stopsViewState.q = sq.value; sqClear.hidden = !sq.value; rerender(); });
  sqClear.addEventListener('click', () => { sq.value=''; stopsViewState.q=''; sqClear.hidden=true; rerender(); sq.focus(); });

  /* Near me — device location → closest stops, sorted by distance */
  const nearBtn = document.getElementById('nearBtn');
  nearBtn.addEventListener('click', () => {
    const cEl = document.getElementById('sCount'), lEl = document.getElementById('slist');
    if(!navigator.geolocation){ cEl.textContent = 'Location is not available in this browser.'; return; }
    nearBtn.classList.add('loading','on');
    navigator.geolocation.getCurrentPosition(pos => {
      nearBtn.classList.remove('loading');
      const { latitude:lat, longitude:lng } = pos.coords;
      const nearest = all
        .map(s => ({ s, d: haversineM(lat, lng, s.lat, s.lng) }))
        .sort((a,b) => a.d - b.d)
        .slice(0, 15);
      if(!cEl || !lEl) return;
      if(!nearest.length || nearest[0].d > 30000){
        cEl.textContent = 'You seem to be outside the TfL network.';
        lEl.innerHTML = '<div class="empty">No London bus stops nearby.</div>';
        return;
      }
      stopsViewState.q = ''; const qEl = document.getElementById('sq'); if(qEl) qEl.value = '';
      cEl.textContent = 'Closest stops to you';
      lEl.innerHTML = nearest.map(({s,d}) => rowHtml(s, d)).join('');
    }, err => {
      nearBtn.classList.remove('loading','on');
      const cEl2 = document.getElementById('sCount');
      if(cEl2) cEl2.textContent = err.code === 1
        ? 'Location permission was declined — search by name instead.'
        : 'Couldn’t get your location — try again or search by name.';
    }, { enableHighAccuracy:false, timeout:10000, maximumAge:60000 });
  });
}

async function renderStopDetail(id){
  main.innerHTML = `<a class="backrow" href="#/stops">‹ Stop search</a><div class="skel" style="height:120px"></div>`;
  const reg = await stopRegistry();
  const s = reg?.get(id);
  main.innerHTML = `
    <a class="backrow" href="#/stops">‹ Stop search</a>
    <div class="dhead">
      <span class="avatar" style="width:46px;height:46px;border-radius:50%;font-size:13px;background:var(--acc)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"/></svg>
      </span>
      <div class="dtitle"><h1>${esc(s?.name ?? 'Bus stop')}</h1>
      <div class="sub2"><span class="livechip"><i class="pulse"></i>LIVE</span> · <span id="nextUpd">updating…</span></div></div>
    </div>
    ${s?.lines?.size ? `<div class="section"><div class="section-h">Routes serving this stop</div>
      <div class="card"><div class="chiprow">${[...s.lines].sort(cmpRoute).map(l => `<a class="rchip" href="#/route/${encodeURIComponent(l)}">${esc(l)}</a>`).join('')}</div></div></div>` : ''}
    <div class="section"><div class="section-h">Next buses</div>
      <div class="card"><div class="kv" id="arrBoard"><div class="kv-empty">Loading arrivals…</div></div></div>
      <div class="legendrow" style="margin-top:7px"><span>Predictions by TfL Countdown, via the Atlas API. Times count down live and re-sync every 30 s.</span></div>
    </div>`;

  /* Live board: predictions carry an absolute due time, so the display
     counts down every second between the 30 s re-syncs — like the dot-matrix
     board at the stop itself. */
  const board = () => document.getElementById('arrBoard');
  const dueText = ms => ms <= 30000 ? 'Due' : `${Math.round(ms/60000)} min`;
  let nextIn = 0;
  async function poll(){
    const raw = await D.arrivals(id);
    const el = board(); if(!el) return;   // navigated away
    const t0 = Date.now();
    const rows = (raw?.data ?? [])
      .filter(a => Number.isFinite(a.timeToStation))
      .map(a => ({ ...a, dueAt: Number.isFinite(Date.parse(a.expectedArrival)) ? Date.parse(a.expectedArrival) : t0 + a.timeToStation*1000 }))
      .sort((a,b) => a.dueAt - b.dueAt)
      .slice(0, 12);
    if(!rows.length){
      el.innerHTML = '<div class="kv-empty">No buses predicted right now — the stop may not be served at this time of day.</div>';
      return;
    }
    el.innerHTML = rows.map(a => {
      const vHref = a.vehicleId
        ? `#/vehicle/${encodeURIComponent(String(a.vehicleId).toUpperCase())}?stop=${encodeURIComponent(id)}&line=${encodeURIComponent(a.lineName ?? '')}`
        : null;
      const sub = [a.currentLocation ? `<span>${esc(a.currentLocation)}</span>` : '',
        vHref ? `<a class="plate" href="${vHref}">${esc(String(a.vehicleId).toUpperCase())}</a>` : '']
        .filter(Boolean).join(' ');
      return `<div>
        <span class="k" style="display:flex;align-items:center;gap:9px;color:var(--tx)">
          <a class="rnum" style="min-width:40px;height:26px;font-size:12.5px;border-radius:7px" href="#/route/${encodeURIComponent(a.lineName)}">${esc(a.lineName)}</a>
          <span style="min-width:0"><b style="font-weight:600">${esc(title(a.destinationName ?? ''))}</b>
          ${sub ? `<span style="display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--mu);flex-wrap:wrap">${sub}</span>` : ''}</span>
        </span>
        <span class="v mono" data-due="${a.dueAt}" style="align-self:center;white-space:nowrap"></span>
      </div>`;
    }).join('');
    paintDues();
  }
  function paintDues(){
    const el = board(); if(!el) return;
    const now = Date.now();
    el.querySelectorAll('[data-due]').forEach(cell => {
      const ms = (+cell.dataset.due) - now;
      cell.textContent = ms < -90000 ? 'Departed' : dueText(Math.max(0, ms));
      cell.style.color = ms <= 30000 ? 'var(--good)' : 'var(--tx)';
    });
  }
  function tick(){
    if(!board()) return;
    paintDues();
    nextIn -= 1;
    const n = document.getElementById('nextUpd');
    if(n) n.textContent = nextIn > 0 ? `next update in ${nextIn} s` : 'updating…';
    if(nextIn <= 0){ nextIn = 30; poll(); }
  }
  poll(); nextIn = 30;
  const n0 = document.getElementById('nextUpd'); if(n0) n0.textContent = 'next update in 30 s';
  addLiveTimer(setInterval(tick, 1000));
}

/* Vehicle live-location map — find the bus in the live GPS feed (trying the
   arrival-context line first, then every route the register has seen it on),
   then draw it against its route's line and, when the user arrived from a
   stop's arrivals board, that stop. Polls every 15 s while the page is open. */
async function initVehicleLiveMap(R, v, ctxLine, ctxStop){
  const sec = document.getElementById('vLiveSec');
  const candidates = [...new Set([ctxLine, ...(v?.routes ?? [])].filter(Boolean).map(x => String(x).toUpperCase()))];
  if(!sec || !candidates.length) return;
  sec.hidden = false;

  async function findBus(){
    for(const line of candidates){
      const raw = await D.liveVehicles(line);
      const hit = (raw?.data ?? []).find(x => String(x.reg ?? '').toUpperCase() === R
        && Number.isFinite(x.lat) && Number.isFinite(x.lng));
      if(hit) return hit;
    }
    return null;
  }

  const first = await findBus();
  if(!document.getElementById('vLiveSec')) return;   // navigated away
  const note = document.getElementById('vLiveNote');
  if(!first){
    document.getElementById('map').remove();
    if(note) note.textContent = 'Not in the live GPS feed right now — it may not be in service.';
    return;
  }

  if(_map){ _map.remove(); _map = null; }
  _map = L.map(document.getElementById('map'), { zoomControl:false, preferCanvas:true, attributionControl:true });
  L.control.attribution({ prefix:false }).addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © CARTO').addTo(_map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(_map);
  _map.setView([first.lat, first.lng], 14);   // layers need a live projection before they're added

  const line = String(first.publishedLine ?? ctxLine ?? candidates[0]).toUpperCase();
  D.overview().then(ov => {
    if(!_map) return;
    const feats = (ov?.features ?? []).filter(f => (f.properties?.name ?? '').toUpperCase() === line);
    if(feats.length) L.geoJSON({type:'FeatureCollection',features:feats},
      { style:{ color:'#dc2626', weight:4, opacity:.6, lineCap:'round', lineJoin:'round' } }).addTo(_map);
  });

  let stopLL = null;
  if(ctxStop){
    const reg = await stopRegistry();     // cached — the user came through the stops flow
    const s = reg?.get(ctxStop);
    if(s && _map){
      stopLL = [s.lat, s.lng];
      L.circleMarker(stopLL, { radius:7, color:'#1c1917', weight:2.5, fillColor:'#fff', fillOpacity:1 })
        .bindPopup(`<b>${esc(s.name)}</b><br><a href="#/stop/${encodeURIComponent(ctxStop)}" style="color:var(--acc);font-weight:600">Live arrivals ›</a>`)
        .addTo(_map);
    }
  }

  let busMarker = null;
  function drawBus(b){
    const col = String(b.direction) === '2' ? '#06b6d4' : '#f97316';
    const icon = L.divIcon({ className:'lb-bus', iconSize:[22,22], iconAnchor:[11,11],
      html: Number.isFinite(b.bearing)
        ? `<div style="transform:rotate(${b.bearing}deg)"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 19 21 12 16 5 21Z" fill="${col}" stroke="#fff" stroke-width="1.6"/></svg></div>`
        : `<div style="width:13px;height:13px;margin:4px;border-radius:50%;background:${col};border:2px solid #fff"></div>` });
    if(busMarker){ busMarker.setLatLng([b.lat, b.lng]); busMarker.setIcon(icon); }
    else busMarker = L.marker([b.lat, b.lng], { icon })
      .bindPopup(`${plate(R, false)}<br>${esc(b.destination ? 'to ' + title(b.destination) : '')}`)
      .addTo(_map);
  }
  const noteText = extra => {
    if(note) note.innerHTML = `<span class="livechip"><i class="pulse"></i>LIVE</span> · on route ${esc(line)} · ${extra}`;
  };
  drawBus(first);
  let b = L.latLngBounds([[first.lat, first.lng]]);
  if(stopLL) b = b.extend(stopLL);
  _map.fitBounds(b.pad(0.35), { maxZoom: 15 });

  /* live-surface pattern: per-second countdown, 15 s re-poll */
  let nextIn = 15, gone = false;
  noteText('next update in 15 s');
  addLiveTimer(setInterval(async () => {
    if(!document.getElementById('vLiveSec')) return;
    nextIn -= 1;
    if(!gone) noteText(nextIn > 0 ? `next update in ${nextIn} s` : 'updating…');
    if(nextIn <= 0){
      nextIn = 15;
      const cur = await findBus();
      if(!document.getElementById('vLiveSec')) return;
      if(cur){ gone = false; drawBus(cur); noteText('next update in 15 s'); }
      else { gone = true; if(note) note.textContent = 'The bus has left the live feed — it may have completed its trip.'; }
    }
  }, 1000));
}

      <div class="prose">
        <p>An independent project, <b>not affiliated with Transport for London</b> or any bus operator. Not a journey planner — for travel advice use <a href="https://tfl.gov.uk" rel="noopener">tfl.gov.uk</a>.</p>
        <p>Every number on this site is served by the <a href="https://atlas.farhan.app/docs/" rel="noopener">Atlas API</a>. Upstream sources: <b>Transport for London</b> (routes, stops, geometry, service status, diversions, reliability, crowding) — <b>Powered by TfL Open Data</b>; DfT Bus Open Data Service (live bus positions, OGL v3.0); DVLA (vehicle details, OGL); londonbusroutes.net (operators, garages, PVR — community reference); basemap © OpenStreetMap contributors &amp; CARTO.</p>
        <p>Built by <a href="https://farhan.app" rel="noopener">Farhan Munim</a>. Contributors: Daniel Plumb, Mark Leonard-Adoko, Ross Levine, Paul Tran, Andy Corbett. <a href="../">Classic map app ›</a></p>
      </div>
    </div>
    <div class="section"><div class="section-h">Data freshness</div>
      <div class="card"><table class="fresh" id="freshTable"><tr><td colspan="2" style="color:var(--mu)">Loading…</td></tr></table></div>
    </div>
    <div class="footer">TVR = PVR × 1.13 (rounded down) · Data may be incomplete or out of date — verify before acting on it.</div>`;
  const mf = await D.manifest();
  const rows = Object.entries(mf?.datasets ?? {})
    .filter(([k]) => ['routes','route-meta','route-stops','garages','fleet','tenders','route-performance','crowding','route-diversions'].includes(k))
    .map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(fmtDate(v.fetchedAt) ?? '—')}${v.status && v.status!=='ok' ? ' ⚠️' : ''}</td></tr>`);
  document.getElementById('freshTable').innerHTML = rows.join('') || '<tr><td colspan="2" style="color:var(--mu)">Manifest unavailable.</td></tr>';
}

/* boot */
navigate();
</script>
