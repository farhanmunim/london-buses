<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Operator Intelligence · London Buses (v3 concept)</title>
<meta name="description" content="Concept: a London bus operator intelligence dashboard built on the project's open data.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#fff; --sunken:#f2f4f7; --hover:#f9fafb;
  --line:#e6e8ec; --line-2:#d5d9e0;
  --ink:#101828; --ink-2:#475467; --ink-3:#667085;
  --accent:#2a78d6; --accent-ink:#184f95; --accent-soft:#eaf2fd; --accent-line:#b7d3f6;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#2a78d6; --seq-5:#184f95;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b;
  --gray-bar:#d0d5dd;
  --zero:#104281; --hybrid:#2a78d6; --diesel:#86b6ef;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 1px rgba(16,24,40,.03);
  --pop:0 16px 40px rgba(16,24,40,.16),0 2px 8px rgba(16,24,40,.06);
  --rail:72px; --top:64px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:300}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell ------------------------------------------------------------------ */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;z-index:50}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;margin-bottom:14px}
.rail a.nav{width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:12px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:500}
.rail a.nav svg{width:20px;height:20px}
.rail a.nav:hover{background:var(--sunken);color:var(--ink)}
.rail a.nav.on{background:var(--accent-soft);color:var(--accent-ink)}
.rail .sp{flex:1}
.col{margin-left:var(--rail);min-width:0}
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 28px;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .mlogo{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#1d2939}
.btn svg{width:16px;height:16px;flex:none}
.opsw{position:relative}
.opsw>.btn{font-weight:600;padding:0 10px 0 8px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.menu{position:absolute;left:0;top:44px;min-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:6px;z-index:60}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px}
.menu button:hover,.menu button[aria-current=true]{background:var(--sunken)}
.menu .nm{font-weight:550;flex:1;white-space:nowrap}
.menu .mt{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.searchbtn{flex:1;max-width:420px;justify-content:flex-start;color:var(--ink-3);font-weight:400;background:var(--sunken);box-shadow:none;border-color:transparent}
.searchbtn:hover{background:#eaecf0}
kbd{margin-left:auto;font:inherit;font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:0 6px;line-height:18px}
.grow{flex:1}
.fresh{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:7px;white-space:nowrap}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--good)}
main{max-width:1520px;margin:0 auto;padding:28px 32px 80px}
.sec{margin-top:20px}

/* cards ------------------------------------------------------------------ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.ch{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0}
.ch h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.ch p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.ch{flex-wrap:wrap}
.ch .ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ch>div:first-child{flex:1 1 220px;min-width:0}
.ch .row2{width:100%}
.cb{padding:16px 20px 20px}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:2px}
.seg button{border:0;background:none;font-size:12px;font-weight:500;color:var(--ink-2);padding:5px 10px;border-radius:8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.seg button:not(.on):hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s2{grid-column:span 2}.s3{grid-column:span 3}

/* operator header --------------------------------------------------------- */
.hero{display:flex;gap:24px;align-items:stretch;overflow:hidden;position:relative}
.hero .who{padding:24px;display:flex;gap:18px;align-items:flex-start;flex:1;min-width:0}
.mono{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:19px;letter-spacing:-.02em;flex:none}
.hero h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.025em;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hero .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.foot{flex:0 0 440px;position:relative;background:linear-gradient(90deg,var(--surface) 0,rgba(255,255,255,0) 22%),var(--sunken);border-left:1px solid var(--line)}
.foot svg{position:absolute;inset:0;width:100%;height:100%}
.foot .cap{position:absolute;left:14px;bottom:10px;font-size:11px;color:var(--ink-3);background:rgba(255,255,255,.85);padding:1px 7px;border-radius:999px}
.foot path.hl{stroke-width:2.2!important;opacity:1!important}

/* KPI tiles --------------------------------------------------------------- */
.kpi{padding:18px 20px;display:flex;flex-direction:column;min-height:150px;position:relative}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.kpi .v{font-size:30px;line-height:1.1;font-weight:650;letter-spacing:-.03em;margin-top:8px}
.kpi .v small{font-size:14px;font-weight:550;color:var(--ink-3);letter-spacing:0;margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--ink-2);margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.kpi.hero-k{background:linear-gradient(180deg,#f4f8fe 0,#fff 85%);border-color:var(--accent-line)}
.kpi.hero-k .v{font-size:52px;letter-spacing:-.04em;margin-top:6px}
.kpi svg.spark{width:100%;max-width:150px;height:30px;margin-top:6px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:550;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good-ink)}.delta.dn{color:#b42318}.delta.nu{color:var(--ink-2)}
.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-3);font-size:10px;display:inline-grid;place-items:center;font-style:normal;cursor:help}

/* charts ------------------------------------------------------------------ */
.mrows{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:184px 1fr 104px;align-items:center;gap:12px;border:0;background:none;padding:7px 8px;border-radius:10px;text-align:left;width:100%}
.mrow:hover{background:var(--hover)}
.mrow .nm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.mrow .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.sel .nm{color:var(--ink);font-weight:600}
.mrow .tr{height:14px;background:transparent}
.mrow .tr i{display:block;height:14px;background:var(--gray-bar);border-radius:0 4px 4px 0;min-width:2px}
.mrow.sel .tr i{background:var(--accent)}
.mrow .vv{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.mrow.sel .vv{color:var(--ink);font-weight:600}
.cols{display:flex;align-items:flex-end;gap:2px;height:196px;padding-top:22px;border-bottom:1px solid var(--line-2);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 25%;position:relative}
.colw{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border:0;background:none;padding:0 2px;border-radius:6px 6px 0 0}
.colw:hover{background:rgba(42,120,214,.06)}
.colw.sel{background:var(--accent-soft)}
.colw .n{font-size:11.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:16px}
.colw .b{width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--seq-2);min-height:2px}
.colw.near .b{background:var(--seq-5)}
.xl{display:flex;gap:2px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{font-weight:550;text-align:left;color:var(--ink-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.dt td.r,table.dt th.r{text-align:right}
.meter{height:8px;border-radius:999px;background:var(--seq-1);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.stack{display:flex;gap:2px;height:22px}
.stack i{display:block;height:100%;border-radius:4px;min-width:3px}
.sub{color:var(--ink-3);font-size:12px}
.big{font-size:34px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pair>div{background:var(--sunken);border-radius:12px;padding:10px 12px}
.pair b{font-size:20px;font-weight:650;letter-spacing:-.02em;display:block}
.pair .won b{color:var(--accent-ink)}.pair .lost b{color:#b42318}

/* routes table ------------------------------------------------------------ */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px 0}
.sfield{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 10px;background:var(--surface);min-width:210px}
.sfield input{border:0;outline:0;font:inherit;width:100%;background:none}
.sfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fchip{height:30px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.fchip:hover{background:var(--hover)}
.fchip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tw{overflow-x:auto;margin-top:12px}
table.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:1100px}
table.rt th{position:sticky;top:0;text-align:left;font-weight:550;font-size:12px;color:var(--ink-3);padding:11px 11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fcfcfd;white-space:nowrap;cursor:pointer;user-select:none}
table.rt th:hover{color:var(--ink)}
table.rt th.num,table.rt td.num{text-align:right}
table.rt th .ar{font-size:10px;margin-left:3px;color:var(--accent-ink)}
table.rt td{padding:14px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rt tr.row{cursor:pointer}
table.rt tr.row:hover td{background:var(--hover)}
table.rt tr.row.sel td{background:var(--accent-soft)}
table.rt td.num{font-variant-numeric:tabular-nums}
table.rt td{white-space:nowrap}
table.rt .sub{overflow:hidden;text-overflow:ellipsis;max-width:270px}
table.rt .sub .flag:first-child{margin-left:0}
table.rt td .sub:not(:only-child){margin-left:2px}
.badge{display:inline-grid;place-items:center;min-width:40px;height:26px;padding:0 8px;border-radius:8px;background:var(--ink);color:#fff;font-weight:650;font-size:12.5px;letter-spacing:-.01em}
.rcell{display:flex;align-items:center;gap:12px}
.glyph{width:40px;height:26px;color:var(--ink-3);flex:none}
.cor{font-weight:500;max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvr{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pvr .bar{width:54px;height:6px;background:var(--sunken);border-radius:999px;overflow:hidden}
.pvr .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.runway{display:inline-block;width:52px;height:6px;background:var(--sunken);border-radius:999px;overflow:hidden;vertical-align:middle;margin-left:8px}
.runway i{display:block;height:100%;background:var(--seq-3);border-radius:999px}
.runway.soon i{background:var(--warn)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--warn-ink);margin-left:6px}
.flag svg{width:12px;height:12px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:550;background:var(--sunken);color:var(--ink-2)}
.tag.blue{background:var(--accent-soft);color:var(--accent-ink)}
.more{display:flex;justify-content:center;padding:14px}
.nx{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 4px;text-align:left;font-size:13px}
.nx:hover{background:var(--hover)}
.nx .cor{max-width:none;flex:1;min-width:0}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* drawer / overlays ---------------------------------------------------------*/
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.32);z-index:120;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:130;box-shadow:var(--pop);transform:translateX(104%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dh .badge{height:34px;min-width:54px;font-size:16px;border-radius:10px}
.dh h3{margin:0;font-size:17px;letter-spacing:-.015em;line-height:1.25}
.dh .x{margin-left:auto;display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.ib:hover{background:var(--hover)}
.ib svg{width:16px;height:16px}
.db{overflow:auto;padding:18px 22px 36px;display:flex;flex-direction:column;gap:22px}
.db h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini>div{border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.mini .l{font-size:11.5px;color:var(--ink-3);font-weight:500}
.mini .v{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.mini .s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.shape{border:1px solid var(--line);border-radius:12px;background:var(--sunken);overflow:hidden}
.shape svg{display:block;width:100%;height:auto}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:0 0 14px;position:relative}
.tl .it:before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:1px;background:var(--line-2)}
.tl .it:last-child:before{display:none}
.tl .it .dot{margin-top:4px}
.tl .t{font-weight:550;font-size:13px}
.tl .m{font-size:12px;color:var(--ink-3)}
.tl .p{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.status-line{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:12.5px}
.status-line.good{background:#f0faf0;color:var(--good-ink)}
.status-line.bad{background:#fff6e5;color:var(--warn-ink)}
.status-line svg{width:16px;height:16px;flex:none;margin-top:1px}
.modal{position:fixed;inset:0;z-index:200;display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px;background:rgba(16,24,40,.38)}
.modal[hidden]{display:none}
.pal{width:min(620px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--pop);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:15px;outline:0}
.pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.pal li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px}
.pal li button.act{background:var(--sunken)}
.pal .grp{padding:8px 12px 4px;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.pal .hint{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;gap:14px}
.about{width:min(640px,100%);background:var(--surface);border-radius:18px;box-shadow:var(--pop);padding:26px 28px;max-height:84vh;overflow:auto}
.about h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.about h5{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.about ul{margin:0;padding-left:18px;color:var(--ink-2)}
.about li{margin:3px 0}
#tip{position:fixed;z-index:400;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:9px;box-shadow:var(--pop);max-width:320px;opacity:0;transition:opacity .08s;white-space:pre-line}
#tip.on{opacity:1}#tip b{font-weight:650}
.loading{opacity:.55;transition:opacity .2s}
.err{margin:60px auto;max-width:480px;text-align:center;color:var(--ink-2)}

/* briefing + intelligence components ---------------------------------------- */
.ch h2{display:flex;align-items:center;gap:7px}
.spk{width:16px;height:16px;color:var(--accent);flex:none}
.brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 28px}
.bi{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.bi:nth-child(-n+2){border-top:0}

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════════
   Operator Intelligence — v3 concept.
   One idea: every route is the same compact "brief" (shape · PVR · fleet ·
   £/mile · operated % · contract runway · next tender) whether it is a table
   row or the detail drawer, and operator KPIs are the roll-up of those same
   fields, so the numbers always agree. All data is this project's own static
   JSON (data/api/*.json); route shapes are drawn as plain SVG — no map tiles.
   ═══════════════════════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ── tokens that charts need in JS ──────────────────────────────────────── */
// Operator identity: the validated 8-slot categorical order (fixed per operator).
const ALL = 'All London';
const AGE_LIMIT = 14;                    // TfL's maximum vehicle age, in years
const OPS = ['Go-Ahead London','Stagecoach London','Metroline','Arriva London','Transport UK London Bus','First Bus London','Uno','Falcon Coaches'];
const CAT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const opColour = o => CAT[OPS.indexOf(o)] ?? '#98a2b3';
// Propulsion is an ordered scale → one ordinal blue ramp (validated), not hues.
const CLASS = { diesel:{ label:'Diesel', c:'#86b6ef' }, hybrid:{ label:'Hybrid', c:'#2a78d6' }, zero:{ label:'Zero-emission', c:'#104281' } };
const propClass = p => p === 'electric' || p === 'hydrogen' ? 'zero' : p === 'hybrid' ? 'hybrid' : 'diesel';
const PROP_LABEL = { diesel:'Diesel', hybrid:'Hybrid', electric:'Electric', hydrogen:'Hydrogen' };

/* ── formatting ──────────────────────────────────────────────────────────── */
const nf = new Intl.NumberFormat('en-GB');
const fInt = n => Number.isFinite(n) ? nf.format(Math.round(n)) : '—';
const fNum = (n, d = 1) => Number.isFinite(n) ? n.toFixed(d) : '—';
const fPct = (n, d = 1) => Number.isFinite(n) ? n.toFixed(d) + '%' : '—';
const fGbp = n => !Number.isFinite(n) ? '—' : n >= 1e9 ? '£' + (n / 1e9).toFixed(2) + 'bn' : n >= 1e6 ? '£' + (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'm' : n >= 1e3 ? '£' + Math.round(n / 1e3) + 'k' : '£' + Math.round(n);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fMon = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : '—'; };
const fDate = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : '—'; };
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const median = a => { const v = a.filter(Number.isFinite).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const natKey = id => { const m = /^([A-Za-z]*)(\d+)/.exec(id) ?? []; return (m[1] ?? '').toUpperCase().padEnd(3, ' ') + String(m[2] ?? '').padStart(5, '0') + id; };

/* ── tooltip (text only — labels are data, never HTML) ───────────────────── */
const tip = $('#tip');
function tipShow(text, x, y){
  tip.replaceChildren();
  String(text).split('\n').forEach((line, i) => { const n = document.createElement(i === 0 ? 'b' : 'span'); n.textContent = (i ? '\n' : '') + line; tip.append(n); });
  tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 12)) + 'px';
  tip.style.top  = Math.max(8, Math.min(innerHeight - r.height - 8, y + 14)) + 'px';
}
const tipHide = () => tip.classList.remove('on');
document.addEventListener('pointermove', e => { const t = e.target.closest?.('[data-tip]'); t ? tipShow(t.dataset.tip, e.clientX, e.clientY) : tipHide(); });
document.addEventListener('pointerleave', tipHide, true);
document.addEventListener('focusin', e => { const t = e.target.closest?.('[data-tip]'); if(t){ const r = t.getBoundingClientRect(); tipShow(t.dataset.tip, r.left + r.width / 2, r.top - 34); } });
document.addEventListener('focusout', tipHide);
addEventListener('scroll', tipHide, { passive:true });

/* ── data ────────────────────────────────────────────────────────────────── */
const get = p => fetch(p).then(r => r.ok ? r.json() : Promise.reject(new Error(p + ' → ' + r.status)));
const opt = p => get(p).catch(() => null);
let D;                                   // everything below hangs off this
const TODAY = new Date(); const TODAY_ISO = TODAY.toISOString().slice(0, 10);
const plusMonths = n => { const d = new Date(TODAY); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 10); };

const grp = name => {                    // tender-form names → the 8 contracted groups
  const n = String(name ?? '').toLowerCase();
  if(!n || n === '?' ) return null;
  if(n.includes('stagecoach')) return 'Stagecoach London';
  if(n.startsWith('first')) return 'First Bus London';
  if(n.includes('arriva')) return 'Arriva London';
  if(n.includes('go-ahead')) return 'Go-Ahead London';
  if(n.includes('metroline')) return 'Metroline';
  if(n.includes('transport uk') || n.includes('abellio')) return 'Transport UK London Bus';
  if(n === 'uno') return 'Uno';
  if(n.includes('falcon')) return 'Falcon Coaches';
  return 'Other';
};
// a rival in the head-to-head: the eight groups keep their names; anyone else is named, not lumped
const rival = name => { const g = grp(name); if(g !== 'Other') return g; const n = String(name).trim(); return /ct plus|hct/i.test(n) ? 'HCT Group (CT Plus)' : n; };

async function load(){
  const [meta, tenders] = await Promise.all([get('/data/api/route-meta.json'), get('/data/api/tenders.json')]);
  const [fleet, garages, prog, perf, sched, crowd, status, dest, overview, manifest, vehicles, cpi, divhist, works] = await Promise.all([
    opt('/data/api/fleet.json'), opt('/data/api/garages.json'), opt('/data/api/tender-programme.json'),
    opt('/data/api/route-performance.json'), opt('/data/api/scheduled-mileage.json'), opt('/data/api/crowding.json'),
    opt('/data/api/line-status.json'), opt('/data/route_destinations.json'), opt('/data/api/routes-overview.json'),
    opt('/data/api/manifest.json'), opt('/data/api/vehicles.json'), opt('/data/api/cpi-cpa.json'),
    opt('/data/api/diversion-history.json'), opt('/data/api/roadworks.json'),
  ]);
  return { meta:meta.routes, tenders, fleet:fleet?.byRoute ?? {}, garages:garages?.garages ?? [], prog:prog?.entries ?? [],
           perf, sched:sched?.routes ?? {}, crowd:crowd?.routes ?? {}, status:status?.rows ?? [], dest:dest?.routes ?? dest ?? {},
           overview, manifest, veh:vehicles?.byReg ?? {}, cpi:cpi?.months ?? [], divhist:divhist?.entries ?? [], works:works?.disruptions ?? [] };
}

const FLAG = {
  rel:{ label:'Reliability', long:'Reliability is more than 10% worse than the contractual standard' },
  op: { label:'Mileage',     long:'Operated mileage is more than 2 points below the contractual minimum' },
  end:{ label:'Contract <12 mo', long:'Contract ends within 12 months' },
  load:{ label:'Crowded',    long:'Peak load is at or above 80% of capacity' },
  dis:{ label:'Disrupted',   long:'Disrupted right now' },
  age:{ label:'Old fleet',   long:'Average fleet age is over 12 years' },
};
const prevYear = p => String(p).replace(/(\d{2})\/(\d{2})$/, (m, a, b) => `${String(+a - 1).padStart(2, '0')}/${String(+b - 1).padStart(2, '0')}`);
const yrsLeft = r => r.cEnd ? Math.max(0, (Date.parse(r.cEnd) - TODAY.getTime()) / 3.15576e10) : null;

function build(raw){
  const periods = raw.perf?.periods ?? [];
  const last13 = periods.slice(-13);
  const statusBy = new Map(raw.status.map(r => [r.route, r]));
  const worksBy = new Map();
  for(const w of raw.works) for(const rid of w.routes ?? []) (worksBy.get(rid) ?? worksBy.set(rid, []).get(rid)).push(w);
  const d30 = new Date(TODAY.getTime() - 30 * 864e5).toISOString().slice(0, 10), divDays = new Map();
  for(const e of raw.divhist) for(const day of e.days ?? []) if(day >= d30) (divDays.get(e.route) ?? divDays.set(e.route, new Set()).get(e.route)).add(day);
  // earliest still-future programme entry per route token
  const progBy = new Map();
  for(const e of [...raw.prog].filter(e => e.contractStart >= TODAY_ISO).sort((a, b) => a.contractStart.localeCompare(b.contractStart)))
    for(const t of String(e.route).split('/').map(x => x.trim())) if(!progBy.has(t)) progBy.set(t, e);
  // route geometry (direction 1 preferred), for glyphs and the footprint
  const lines = new Map();
  for(const f of raw.overview?.features ?? []){
    const id = f.properties?.routeId; if(!id) continue;
    const g = f.geometry; const coords = g?.type === 'LineString' ? g.coordinates : g?.type === 'MultiLineString' ? g.coordinates.flat() : null;
    if(!coords?.length) continue;
    if(!lines.has(id) || String(f.properties.direction) === '1') lines.set(id, coords);
  }
  const short = x => String(x?.destination ?? '').replace(/,.*$/, '').trim();
  const routes = [];
  for(const [id, m] of Object.entries(raw.meta)){
    const hist = [...(raw.tenders.byRoute?.[id] ?? [])].sort((a, b) => String(b.awardDate).localeCompare(String(a.awardDate)));
    const cur = hist.find(a => a.contractStart && a.contractStart <= TODAY_ISO) ?? hist[0] ?? null;
    const fl = raw.fleet[id]; const pf = raw.perf?.routes?.[id];
    const latest = obj => { for(let i = periods.length - 1; i >= 0; i--){ const v = obj?.[periods[i]]; if(Number.isFinite(v)) return { v, p:periods[i], i }; } return null; };
    const op = latest(pf?.operatedPct), rel = latest(pf?.reliability);
    const prevOp = op ? (() => { for(let i = op.i - 1; i >= 0; i--){ const v = pf.operatedPct[periods[i]]; if(Number.isFinite(v)) return v; } return null; })() : null;
    const opLY = op ? pf?.operatedPct?.[prevYear(op.p)] : null;
    const d = raw.dest[id], dk = raw.sched[id]?.dailyKm ?? null;
    routes.push({
      id, op:m.operator, company:m.company, garage:m.garage, garageName:m.garageName, pvr:m.pvr ?? 0, tvr:m.tvr, vehicle:m.fleet,
      prop:m.propulsion ?? 'diesel', deck:m.deck, freq:m.frequency, km:m.lengthKm, type:m.type,
      cStart:m.contractStart ?? null, cEnd:m.contractEnd ?? null,
      from:short(d?.outbound), to:short(d?.inbound),
      age:fl?.avgAgeYears ?? null, fleetN:fl?.count ?? 0, makes:fl?.makes ?? [],
      cur, hist, bids:cur?.numberOfTenderers > 0 ? cur.numberOfTenderers : null,
      cpm:cur?.costPerMile > 0 ? cur.costPerMile : null,
      opPct:op?.v ?? null, opPeriod:op?.p ?? null, opPrev:prevOp, opMin:pf?.operatedMinStandard ?? null,
      opLY:Number.isFinite(opLY) ? opLY : null, opYoY:op && Number.isFinite(opLY) ? op.v - opLY : null,
      rel:rel?.v ?? null, relMetric:pf?.reliabilityMetric ?? null, relStd:pf?.reliabilityMinStandard ?? null, pf,
      dailyKm:dk?.weekday ?? null, dk, trips:raw.sched[id]?.trips?.weekday ?? null, periodKm:dk ? 20 * (dk.weekday || 0) + 4 * (dk.saturday || 0) + 4 * (dk.sunday || 0) : null,
      crowd:raw.crowd[id] ?? null, status:statusBy.get(id) ?? null,
      next:progBy.get(id) ?? progBy.get(id.replace(/^N/, '')) ?? null,
      works:worksBy.get(id) ?? [], divDays:divDays.get(id)?.size ?? 0,
    });
  }
  for(const r of routes){
    // just awarded: the latest award was made in the last 9 months, or its contract has not started yet
    const a = r.hist[0];
    r.award = a?.awardDate && (a.awardDate >= plusMonths(-9) || (a.contractStart && a.contractStart > TODAY_ISO)) ? a : null;
    // in the programme: a future tender that is not simply the contract we just awarded
    const n = r.next, same = n && r.award?.contractStart && Math.abs(Date.parse(n.contractStart) - Date.parse(r.award.contractStart)) < 150 * 864e5;
    r.pipe = n && !same ? n : null;
  }
  const byId = new Map(routes.map(r => [r.id, r]));
  const YEAR = TODAY.getUTCFullYear();
  const vlist = Object.values(raw.veh);
  const vAges = new Map();                                           // route → ages of the registered vehicles seen on it
  for(const v of vlist) if(v.year) for(const rid of v.routes ?? []) (vAges.get(rid) ?? vAges.set(rid, []).get(rid)).push(YEAR - v.year);
  for(const r of routes){
    const a = vAges.get(r.id) ?? [];
    r.vSeen = a.length; r.vOld = a.filter(x => x >= AGE_LIMIT - 2).length; r.vOver = a.filter(x => x >= AGE_LIMIT).length;
  }
  const netMedianCpm = median(routes.map(r => r.cpm));
  const relPass = r => r.rel != null && r.relStd != null ? (/EWT/.test(r.relMetric) ? r.rel <= r.relStd : r.rel >= r.relStd) : null;

  // attention signals — transparent rules, each one a fact the data can state
  for(const r of routes){
    const f = [];
    // material misses only: most routes sit a little under their standards, so a bare miss is the norm, not a signal
    if(relPass(r) === false && Math.abs(r.rel - r.relStd) / r.relStd >= 0.10) f.push('rel');
    if(r.opPct != null && r.opMin != null && r.opPct < r.opMin - 2) f.push('op');
    if(r.cEnd && r.cEnd >= TODAY_ISO && r.cEnd <= plusMonths(12)) f.push('end');
    if(r.crowd?.peakVC >= 0.8) f.push('load');
    if(r.status && r.status.status !== 'Good Service') f.push('dis');
    if((r.age != null && r.age > 12) || (r.vSeen >= 3 && r.vOld / r.vSeen >= 0.4)) f.push('age');
    r.flags = f;
  }

  // the fleet register: every registered vehicle, grouped to its parent brand
  const BANDS = [[0, 2, '0–2'], [3, 5, '3–5'], [6, 8, '6–8'], [9, 11, '9–11'], [12, 99, '12+']];
  const mkFleet = vs => {
    const aged = vs.filter(v => v.year); const ages = aged.map(v => YEAR - v.year);
    return {
      n:vs.length, avg:ages.length ? ages.reduce((a, b) => a + b, 0) / ages.length : null,
      ze:vs.length ? vs.filter(v => propClass(v.propulsion) === 'zero').length / vs.length * 100 : null,
      young:ages.length ? ages.filter(a => a <= 3).length / ages.length * 100 : null,
      old:ages.length ? ages.filter(a => a >= 12).length / ages.length * 100 : null,
      oldest:aged.length ? Math.min(...aged.map(v => v.year)) : null,
      hist:BANDS.map(([lo, hi, label]) => ({ label, n:ages.filter(a => a >= lo && a <= hi).length })),
      // exposure to the 14-year limit: buses reach it in (registration year + 14)
      limit:(() => { const c = n => ages.filter(x => x === n).length, over = ages.filter(x => x > AGE_LIMIT).length, y0 = c(AGE_LIMIT), y1 = c(AGE_LIMIT - 1), y2 = c(AGE_LIMIT - 2), y3 = c(AGE_LIMIT - 3);
        return { at:over + y0, over, soon:y1 + y2, within36:over + y0 + y1 + y2 + y3, rows:[{ label:`Past ${AGE_LIMIT}`, n:over }, { label:String(YEAR), n:y0 }, { label:String(YEAR + 1), n:y1 }, { label:String(YEAR + 2), n:y2 }, { label:String(YEAR + 3), n:y3 }], known:ages.length }; })(),
      makes:(() => { const c = {}; for(const v of vs) if(v.make) c[v.make] = (c[v.make] ?? 0) + 1; return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 3); })(),
      mix:Object.fromEntries(Object.keys(CLASS).map(k => [k, vs.length ? vs.filter(v => propClass(v.propulsion) === k).length / vs.length * 100 : 0])),
    };
  };
  const FLEET = Object.fromEntries(OPS.map(o => [o, mkFleet(vlist.filter(v => grp(v.operator) === o))]));
  const FNET = mkFleet(vlist.filter(v => OPS.includes(grp(v.operator))));

  const agg = list => {
    const pvr = sum(list, r => r.pvr);
    const aged = list.filter(r => r.age != null && r.fleetN > 0);
    const w = r => r.dailyKm ?? r.pvr ?? 1;
    const opd = list.filter(r => r.opPct != null);
    const series = last13.map(p => { const rs = list.filter(r => Number.isFinite(r.pf?.operatedPct?.[p])); const t = sum(rs, w); return t ? sum(rs, r => r.pf.operatedPct[p] * w(r)) / t : null; });
    const rp = list.map(relPass).filter(v => v != null);
    const priced = list.filter(r => r.cur?.acceptedBid > 0), wv = priced.filter(r => yrsLeft(r) != null);
    const both = list.filter(r => r.opPct != null && r.opLY != null);
    const exp24 = list.filter(r => r.cEnd && r.cEnd >= TODAY_ISO && r.cEnd <= plusMonths(24));
    const bidded = list.filter(r => r.bids);
    return {
      list, n:list.length, pvr,
      value:sum(list, r => r.cur?.acceptedBid),
      cpm:median(list.map(r => r.cpm)),
      age:aged.length ? sum(aged, r => r.age * r.fleetN) / sum(aged, r => r.fleetN) : null,
      ze:pvr ? sum(list.filter(r => propClass(r.prop) === 'zero'), r => r.pvr) / pvr * 100 : null,
      dd:pvr ? sum(list.filter(r => r.deck === 'double'), r => r.pvr) / pvr * 100 : null,
      mix:Object.fromEntries(Object.keys(CLASS).map(k => [k, pvr ? sum(list.filter(r => propClass(r.prop) === k), r => r.pvr) / pvr * 100 : 0])),
      opPct:opd.length ? sum(opd, r => r.opPct * w(r)) / sum(opd, w) : null,
      opSeries:series,
      yoy:both.length ? sum(both, r => (r.opPct - r.opLY) * w(r)) / sum(both, w) : null,
      lostKm:sum(list.filter(r => r.periodKm && r.opPct != null), r => r.periodKm * (1 - r.opPct / 100)),
      relPassPct:rp.length ? rp.filter(Boolean).length / rp.length * 100 : null, relN:rp.length,
      crowded:list.filter(r => r.crowd?.peakVC >= 0.8).length,
      disrupted:list.filter(r => r.status && r.status.status !== 'Good Service').length,
      attention:list.filter(r => r.flags.length >= 3),
      exp24, renewalValue:sum(exp24, r => r.cur?.acceptedBid), exp24InProg:exp24.filter(r => r.next).length,
      waut:wv.length ? sum(wv, r => r.cur.acceptedBid * yrsLeft(r)) / sum(wv, r => r.cur.acceptedBid) : null,
      valuePerPvr:(() => { const l = priced.filter(r => r.pvr > 0); return l.length ? sum(l, r => r.cur.acceptedBid) / sum(l, r => r.pvr) : null; })(),
      kmPerPvr:(() => { const l = list.filter(r => r.dailyKm && r.pvr > 0); return l.length ? sum(l, r => r.dailyKm) / sum(l, r => r.pvr) : null; })(),
      singleBid:bidded.length ? bidded.filter(r => r.bids === 1).length / bidded.length * 100 : null, bidN:bidded.length,
      garages:new Set(list.map(r => r.garage)).size,
      companies:new Set(list.map(r => r.company).filter(Boolean)).size,
    };
  };
  const ST = Object.fromEntries(OPS.map(o => [o, agg(routes.filter(r => r.op === o))]));
  for(const o of OPS) ST[o].opKey = o;
  const NET = agg(routes);
  for(const o of OPS) ST[o].spare = ST[o].pvr ? FLEET[o].n / ST[o].pvr : null;
  NET.spare = NET.pvr ? FNET.n / NET.pvr : null;

  // tender record and head-to-head, five years
  const from5 = plusMonths(-60);
  const REC = Object.fromEntries(OPS.map(o => [o, { retained:0, lost:0, won:0, wonFrom:{}, lostTo:{} }]));
  REC[ALL] = { retained:0, changed:0, wonFrom:{}, lostTo:{}, won:0, lost:0, network:true };
  for(const a of Object.values(raw.tenders.byId ?? {})){
    if(!a.awardDate || a.awardDate < from5) continue;
    const g = rival(a.operator), f = rival(a.fromOperator);
    if(!grp(a.operator) || !grp(a.fromOperator)) continue;
    if(g === f){ REC[ALL].retained++; if(REC[g]) REC[g].retained++; }
    else {
      REC[ALL].changed++;
      if(REC[f]){ REC[f].lost++; REC[f].lostTo[g] = (REC[f].lostTo[g] ?? 0) + 1; }
      if(REC[g]){ REC[g].won++; REC[g].wonFrom[f] = (REC[g].wonFrom[f] ?? 0) + 1; }
    }
  }

  // award price per mile by year, nominal and in today's money (CPI-deflated)
  const cpiBy = new Map(raw.cpi.map(m => [m.month, +m.cpi])), cpiNow = +raw.cpi.at(-1)?.cpi || null;
  const PY0 = 2015, PY1 = TODAY.getUTCFullYear(), PPTS = [];
  for(const a of Object.values(raw.tenders.byId ?? {})){
    if(!a.awardDate || !(a.costPerMile > 0) || a.costPerMile > 35) continue;   // above £35/mile is school/special work or a data slip, and would swamp the median
    const y = +a.awardDate.slice(0, 4); if(y < PY0 || y > PY1) continue;
    const f = cpiBy.get(a.awardDate.slice(0, 7));
    PPTS.push({ y, v:a.costPerMile, real:f && cpiNow ? a.costPerMile * cpiNow / f : null, g:grp(a.operator), tok:String(a.route ?? '').split('/').map(t => t.trim()) });
  }
  const PRICE = { years:Array.from({ length:PY1 - PY0 + 1 }, (_, i) => PY0 + i), cpiNow };
  PRICE.series = (pred, real, minOwn = 4) => PRICE.years.map(y => {
    const at = PPTS.filter(p => p.y === y), pick = arr => arr.map(x => real ? x.real : x.v).filter(Number.isFinite);
    const n = pick(at), o = pred ? pick(at.filter(pred)) : null;
    return { x:String(y), net:n.length >= 10 ? median(n) : null, op:o && o.length >= minOwn ? median(o) : null, nn:n.length, on:o?.length ?? 0 };
  });

  // depots: peak vehicles against licensed operating-centre capacity
  const gByCode = new Map(raw.garages.map(g => [g.code, g]));
  const mkDepots = list => {
    const by = {}; for(const r of list) (by[r.garage] ??= { code:r.garage, name:r.garageName, pvr:0, routes:0 }), by[r.garage].pvr += r.pvr, by[r.garage].routes++;
    return Object.values(by).map(d => { const g = gByCode.get(d.code); return { ...d, capacity:g?.capacity ?? null, util:g?.capacity ? d.pvr / g.capacity : null, g }; }).sort((a, b) => b.pvr - a.pvr);
  };
  const DEPOTS = Object.fromEntries(OPS.map(o => [o, mkDepots(ST[o].list)])); DEPOTS[ALL] = mkDepots(routes);
  ST[ALL] = NET; FLEET[ALL] = FNET;

  // scopes: the whole network, one operator, or one garage. Every card reads its numbers from the current scope.
  const gcache = new Map();
  const garageScope = code => {
    if(gcache.has(code)) return gcache.get(code);
    const g = gByCode.get(code), list = routes.filter(r => r.garage === code); if(!g || !list.length) return null;
    const cnt = {}; for(const r of list) cnt[r.op] = (cnt[r.op] ?? 0) + r.pvr; const op = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
    const ids = new Set(list.map(r => r.id)), tok = x => String(x ?? '').split('/').map(t => t.trim());
    const st = agg(list), F = mkFleet(vlist.filter(v => grp(v.operator) === op && (v.routes ?? []).some(x => ids.has(x))));
    st.spare = null;
    const rec = { retained:0, won:0, lost:null, wonFrom:{}, lostTo:{}, partial:true };
    for(const a of Object.values(raw.tenders.byId ?? {})){

}

function runwayBuckets(){
  const y0 = TODAY.getUTCFullYear(), all = SC().st.list, list = all.filter(r => r.cEnd && r.cEnd >= TODAY_ISO);

  b.push({ label:`${y0 + 10}+`, year:'later', rs:[] });
  for(const r of list){ const y = +r.cEnd.slice(0, 4); (b[Math.min(y - y0, 10)] ?? b[10]).rs.push(r); }

  return { b, ended, undated:all.filter(r => !r.cEnd).length };
}

function priceChart(pts){

  if(vals.length < 2) return '<div class="sub">Not enough priced awards.</div>';
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo || 1) * .15; lo = Math.max(0, lo - pad); hi += pad;
  const X = i => L + i * (W - L - R) / (pts.length - 1), Y = v => H - B - (v - lo) / (hi - lo) * (H - B - T);
  const path = key => { let d = '', pen = false; pts.forEach((p, i) => { if(Number.isFinite(p[key])){ d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[key]).toFixed(1); pen = true; } else pen = false; }); return d; };
  const last = key => { for(let i = pts.length - 1; i >= 0; i--) if(Number.isFinite(pts[i][key])) return [X(i), Y(pts[i][key])]; return null; };
  const ticks = [0, .33, .66, 1].map(f => lo + f * (hi - lo));

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Award price per mile by year">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)"/><text x="${L - 6}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">£${t.toFixed(t < 10 ? 1 : 0)}</text>`).join('')}

    ${pts.map((p, i) => i % 2 === 0 || i === pts.length - 1 ? `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${p.x}</text>` : '').join('')}
    ${pts.map((p, i) => `<rect x="${(X(i) - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" fill="transparent" data-tip="${p.x}\n${esc(SC().name)}: ${Number.isFinite(p.op) ? '£' + p.op.toFixed(2) + ' (' + p.on + ' awards)' : 'too few awards'}\nNetwork median: ${Number.isFinite(p.net) ? '£' + p.net.toFixed(2) + ' (' + p.nn + ' awards)' : '—'}"/>`).join('')}</svg>`;
}

    $('#app').innerHTML = `<div class="err"><b>Couldn't load the operator data.</b><br>${esc(e.message)}<br><a href="/v3">Reload</a></div>`;
  }
})();
</script>
