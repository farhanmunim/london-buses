<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Operator Intelligence · londonbuses.org</title>
<meta name="description" content="Concept: a London bus operator intelligence dashboard built on the project's open data.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/intelligence/base.css">
<link rel="stylesheet" href="/css/intelligence/components.css">
<link rel="stylesheet" href="/css/intelligence/features.css">
<link rel="stylesheet" href="/css/intelligence/polish.css">
</head>
<body>
<script src="/site-banner.js"></script>
<a class="skip" href="#main">Skip to content</a>

<nav class="rail" aria-label="Sections">
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h4a4 4 0 0 0 4-4v-1a4 4 0 0 1 4-4"/></svg></div>
  <a class="nav on" href="#overview" data-sec="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
  <a class="nav" href="#market" data-sec="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Market</a>
  <a class="nav" href="#contracts" data-sec="contracts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Contracts</a>
  <a class="nav" href="#renewals" data-sec="renewals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Renewals</a>
  <a class="nav" href="#fleet" data-sec="fleet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="13" rx="2.5"/><path d="M4 11h16M8 21v-4M16 21v-4"/></svg>Fleet</a>
  <a class="nav" href="#routes" data-sec="routes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h5a4 4 0 0 0 4-4V9a4 4 0 0 1 0-1.8"/></svg>Routes</a>
  <div class="sp"></div>
  <a class="nav" href="/" title="The current app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Current</a>
</nav>

<div class="col">
  <header class="top">
    <div class="mlogo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h4a4 4 0 0 0 4-4v-1a4 4 0 0 1 4-4"/></svg></div>
    <div class="opsw">
      <button class="btn" id="opBtn" aria-haspopup="listbox" aria-expanded="false"><i class="dot" id="opDot"></i><span id="opName">Operator</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" id="opMenu" role="listbox" hidden></div>
    </div>
    <div class="opsw" id="gsw">
      <button class="btn" id="gBtn" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M8 20v-6h8v6"/></svg><span id="gName">All garages</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu gm" id="gMenu" role="listbox" hidden><label class="gq"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gq" placeholder="Find a garage" aria-label="Find a garage" autocomplete="off"></label><div id="gList"></div></div>
    </div>
    <button class="btn searchbtn" id="searchBtn" aria-label="Search routes and operators"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="stxt">Search routes, garages, operators</span><kbd>⌘K</kbd></button>
    <div class="grow"></div>
    <span class="fresh" id="fresh"></span>
    <button class="btn abtn" id="aboutBtn" aria-label="Concept notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg><span>Concept notes</span></button>
  </header>

  <main id="main">
    <div id="app"><div class="err">Loading operator data…</div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true"></aside>
<div class="modal" id="pal" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="pal"><input id="palIn" placeholder="Search a route (25, N38, X68) or an operator…" autocomplete="off" aria-label="Search"><ul id="palList"></ul>
    <div class="hint"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div></div>
</div>
<div class="modal" id="aboutM" hidden role="dialog" aria-modal="true" aria-label="Concept notes"><div class="about" id="aboutBody"></div></div>
<div id="tip" role="tooltip" aria-label="Details"></div>

<script type="module" src="/js/intelligence/main.js"></script>
<div class="mapfs" id="mapfs" hidden role="dialog" aria-modal="true" aria-label="Map">
  <div class="mfbar"><div class="mft float"><b id="mfTitle"></b><span class="sub" id="mfSub"></span></div><button class="btn float" id="mfClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Close</button></div>
  <div class="mfbody" id="mfBody"></div>
</div>
</body>
</html>
